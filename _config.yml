# MESURE D'URGENCE UNIQUEMENT : GitHub Pages publie encore la racine main.
# Quand Settings > Pages > Source = GitHub Actions sera activé, supprimer
# ce contournement et ne publier que l'artefact isolé _site (issue #450).
#
# Retirer .nojekyll pour activer Jekyll; sans cela, toutes ces exclusions
# seraient ignorées et les fichiers techniques continueraient de sortir.
# Ne pas autoriser « source: » : GitHub Pages impose sa racine configurée.
safe: true
plugins: []
theme: null
include:
  - ".well-known"
  - ".well-known/security.txt"
  # Chemins publics revus dans l'allowlist du builder; Jekyll a tendance à
  # ignorer Markdown sans frontmatter et les dossiers exclus.
  - "projets/projet-nova/PROPOSITIONS_PUBLIQUES.md"
  - "projets/projet-nova/official/reference/architecture-numerique-interoperabilite-reversibilite.md"
  - "projets/projet-nova/official/reference/corpus.md"
  - "projets/projet-nova/official/reference/cybersecurite-resilience-continuite.md"
  - "projets/projet-nova/official/reference/finances.md"
  - "projets/projet-nova/official/reference/identite-numerique-vie-privee.md"
  - "projets/projet-nova/official/reference/programme.md"
  - "projets/projet-nova/official/reference/statuts.md"
  - "projets/sinjira/codex/index.html"
  # Liste positive des JSON d'interface autorisés par le générateur _site.
  - "projets/projet-nova/data/actualites.json"
  - "projets/projet-nova/data/boussole-electorale-v1.json"
  - "projets/projet-nova/data/boussole-electorale-v2.json"
  - "projets/projet-nova/data/boussole-partis-2026.json"
  - "projets/projet-nova/data/boussole-preuves-2026.json"
  - "projets/projet-nova/data/boussole-sources-partis-2026.json"
  - "projets/projet-nova/data/comptabilite.json"
  - "projets/projet-nova/data/documents-word-only.json"
  - "projets/projet-nova/data/documents.json"
  - "projets/projet-nova/data/rencontres.json"
  - "projets/projet-nova/data/sondage-citoyen-v1.json"
  - "projets/projet-nova/data/sources.json"
exclude:
  - ".git"
  - ".github"
  - ".vscode"
  - ".devcontainer"
  - ".env"
  - ".env.production"
  - ".env.local"
  - ".gitignore"
  - ".gitattributes"
  - ".nojekyll"
  - "_site"
  - "_pages_site"
  - "_preview_site"
  - "_containment_site"
  - "supabase"
  - "tests"
  - "scripts"
  - "mobile-native"
  - "docs"
  - "node_modules"
  - "coverage"
  - "playwright-report"
  - "test-results"
  - "vendor"
  - "Gemfile"
  - "Gemfile.lock"
  - "package.json"
  - "package-lock.json"
  - "pnpm-lock.yaml"
  - "yarn.lock"
  - "netlify.toml"
  - "vercel.json"
  - "README.md"
  # Aucun document Markdown racine n'est un fichier Web approuvé.
  # Jekyll générerait aussi pour chacun une page HTML publique.
  - "*.md"
  # Rapports, inventaires et instructions historiques uniquement dans Git.
  - "A_LIRE_*.txt"
  - "CNAME_APRES_NAMECHEAP.txt"
  - "DELETE_THESE_*.txt"
  - "DEPLOIEMENT_GITHUB.txt"
  - "FICHIERS_MODIFIES*.txt"
  - "GUIDE_MISE_EN_LIGNE.txt"
  - "INSTRUCTIONS*.txt"
