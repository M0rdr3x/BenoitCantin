  - "MANIFEST_PACK_CUMULATIF*.json"
  - "VERIFICATION*.json"
  - "projets/projet-nova/CNAME"
  - "SECURITY.md"
  - "CONTRIBUTING.md"
  - "LICENSE"
  - "Makefile"
  - "Dockerfile"
  - "script.js"
  - "projets/projet-nova/official/versions"
  - "projets/projet-nova/official/CURRENT_VERSION.json"
  - "projets/projet-nova/data/*.csv"
  # Refus global des futurs JSON de travail. Jekyll 3 examine include
  # avant exclude : les 12 fichiers ci-dessus restent publics uniquement.
  - "projets/projet-nova/data/*.json"
  # Garde P0 : ces trois JSON ne sont PAS dans la liste publique _site.
  # Les documents de travail NOVA restent réservés au dépôt Git.
