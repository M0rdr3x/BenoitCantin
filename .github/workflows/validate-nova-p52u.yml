name: Projet Nova P52U - Contenu PDF F09 et dossier relecteur
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p52u.yml"
      - "scripts/valider_pages_budget_nova_p52u.py"
      - "scripts/tests/test_valider_pages_budget_nova_p52u.py"
      - "projets/projet-nova/etudes/P52U_*"
      - "projets/projet-nova/etudes/P52J_RELECTURE_PRIMAIRE_BUDGET_2026_2027.json"
      - "projets/projet-nova/etudes/P52K_REGISTRE_PROVENANCE_BUDGET.json"
      - "projets/projet-nova/etudes/P52S_RECEPISSES_HTTPS_OBSERVES_2026_10_20.json"
      - "projets/projet-nova/etudes/P52T_PROCEDURE_DOUBLE_CAPTURE.json"
      - "projets/projet-nova/etudes/P52A_REGISTRE_PREUVES_FISCALES.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages-du-pdf-et-preuve-humaine-non-obtenue:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Fichiers du projet en lecture seule
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Analyseur PDF version fixee
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: pypdf==5.9.0
      - name: Trente-huit tests de structure, montants et fausses attestations
        run: |
          python -m py_compile scripts/valider_pages_budget_nova_p52u.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
              "scripts/tests",pattern="test_valider_pages_budget_nova_p52u.py")
          assert suite.countTestCases()==38,suite.countTestCases()
          out=unittest.TextTestRunner(verbosity=2).run(suite)
          assert out.wasSuccessful()
          PY
      - name: Verifier le registre sans reseau
        run: |
          python scripts/valider_pages_budget_nova_p52u.py --rapport p52u_structure.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("p52u_structure.json").read_text("utf-8"))
          assert r["documents_controles"]==0
          assert r["decision"]=="NO_GO_AUTOMATIQUE"
          PY
      - name: Verifier les octets et 39 valeurs directement dans les pages des PDF
        run: |
          python scripts/valider_pages_budget_nova_p52u.py --reseau --rapport p52u_pdf_pages_agregat.json || { cat p52u_pdf_pages_agregat.json; exit 2; }
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("p52u_pdf_pages_agregat.json").read_text("utf-8"))
          assert r["documents_controles"]==2
          assert r["valeurs_attendues"]==39
          assert r["valeurs_retrouvees"]==39
          assert not r["expert_independant_mandate"]
          assert not r["signature_officielle_verifiee"]
          assert r["decision"]=="NO_GO_AUTOMATIQUE"
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: Refuser toute expertise fictive
        run: |
          set +e
          python scripts/valider_pages_budget_nova_p52u.py --exiger-expertise --rapport p52u_non_atteste.json
          code=$?
          set -e
          test "$code" -eq 3
      - name: Resultats seulement, jamais les PDF ni le texte integral
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-p52u-controle-pages-f09-no-go
          path: |
            p52u_structure.json
            p52u_pdf_pages_agregat.json
            p52u_non_atteste.json
          retention-days: 7
          if-no-files-found: ignore
