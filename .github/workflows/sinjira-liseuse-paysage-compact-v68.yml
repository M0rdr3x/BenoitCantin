name: "SINJIRA V68 — liseuse adaptée au téléphone paysage"
on:
  pull_request:
    branches:
      - review/sinjira-liseuse-mobile-v64-integration-main-20261111
      - main
    paths:
      - 'assets/css/sinjira-liseuse-v26.css'
      - 'tests/e2e/test_sinjira_liseuse_responsive_v58.py'
      - '.github/workflows/sinjira-liseuse-paysage-compact-v68.yml'
  push:
    branches: [main]
    paths:
      - 'assets/css/sinjira-liseuse-v26.css'
      - 'tests/e2e/test_sinjira_liseuse_responsive_v58.py'
permissions:
  contents: read
jobs:
  small-landscape:
    name: "Livre paysage + lecture tactile — ${{ matrix.browser }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Code sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Syntaxe des tests et moteurs
        run: |
          node --check assets/js/sinjira-liseuse-touch-v52.mjs
          node --check assets/js/sinjira-liseuse-reflow-v53.mjs
          python3 -m py_compile tests/e2e/test_sinjira_liseuse_mobile_v54.py tests/e2e/test_sinjira_liseuse_real_page_v57.py tests/e2e/test_sinjira_liseuse_responsive_v58.py
      - name: Suite Node gestes et reflow V52–V67
        run: node --test tests/sinjira-liseuse-touch-v52.test.mjs tests/sinjira-liseuse-reflow-v53.test.mjs
      - name: Tests navigateur sur vrai HTML avec PDF synthétique
        run: |
          python3 -m venv .venv-reader-v68
          . .venv-reader-v68/bin/activate
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
          python tests/e2e/test_sinjira_liseuse_mobile_v54.py --browser ${{ matrix.browser }}
          python tests/e2e/test_sinjira_liseuse_real_page_v57.py --browser ${{ matrix.browser }}
          python tests/e2e/test_sinjira_liseuse_responsive_v58.py --browser ${{ matrix.browser }}
      - name: Absence de publication
        run: echo "V68-LAB-ONLY — aucune réception physique ni mise en production"
