name: Sécurité SINJIRA — décisions modération DOM

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/sinjira-admin-social-v20.js'
      - 'admin/sinjira/index.html'
      - 'scripts/test_sinjira_admin_social_ui_boundary.cjs'
      - '.github/workflows/sinjira-admin-social-ui-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-admin-social-v20.js'
      - 'admin/sinjira/index.html'
      - 'scripts/test_sinjira_admin_social_ui_boundary.cjs'
      - '.github/workflows/sinjira-admin-social-ui-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moderation-dom:
    name: Refuser les identifiants falsifiés et les décisions non motivées
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout sans jeton persistant
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Node.js épinglé
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Valider la syntaxe du client et du test
        run: |
          node --check assets/js/sinjira-admin-social-v20.js
          node --check scripts/test_sinjira_admin_social_ui_boundary.cjs
      - name: Exercer les vraies décisions de modération avec un DOM falsifié
        run: node scripts/test_sinjira_admin_social_ui_boundary.cjs
      - name: Vérifier la sécurité du service Edge de modération
        run: |
          python3 scripts/validate_admin_social_request_security.py
          python3 scripts/validate_admin_social_request_security.py --self-test
          python3 scripts/validate_moderation_appeals_v24_4_90.py
