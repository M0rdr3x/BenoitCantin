name: SINJIRA — sécurité des liens des projets et des livres

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/sinjira-library.js'
      - 'assets/js/sinjira-library-v24-4-61.js'
      - 'assets/js/sinjira-supabase.js'
      - 'assets/js/sinjira-document-url-policy.mjs'
      - 'scripts/test_sinjira_document_url_boundary.mjs'
      - 'scripts/test_sinjira_project_library_urls_security.mjs'
      - '.github/workflows/sinjira-project-library-urls-security.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-library.js'
      - 'assets/js/sinjira-library-v24-4-61.js'
      - 'assets/js/sinjira-supabase.js'
      - 'assets/js/sinjira-document-url-policy.mjs'
      - 'scripts/test_sinjira_document_url_boundary.mjs'
      - 'scripts/test_sinjira_project_library_urls_security.mjs'
      - '.github/workflows/sinjira-project-library-urls-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-library-destinations:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans jeton persistant
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Préparer Node épinglé
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          check-latest: false
      - name: Tester les vues réelles et leurs destinations HTML
        run: |
          node --test scripts/test_sinjira_project_library_urls_security.mjs
          node scripts/test_sinjira_document_url_boundary.mjs
