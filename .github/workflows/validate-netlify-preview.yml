name: Netlify preview — smoke HTTP

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: URL HTTPS de la Deploy Preview Netlify (*.netlify.app)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke HTTP preview Netlify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PREVIEW_URL: ${{ inputs.preview_url }}
    steps:
      - name: Récupérer le dépôt sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Auto-tester le smoke HTTP
        run: python3 scripts/validate_web_release_http.py --self-test
      - name: Vérifier la Deploy Preview Netlify
        shell: bash
        run: python3 scripts/validate_web_release_http.py "$PREVIEW_URL" --context preview
      - name: Résumer la preuve Deploy Preview
        if: success()
        shell: bash
        run: |
          {
            echo "### Smoke HTTP — Deploy Preview Netlify"
            echo "- Cible : \`$PREVIEW_URL\`"
            echo "- Contexte : \`preview\`"
            echo "- SHA testé : \`$GITHUB_SHA\`"
            echo "- Verdict : **SUCCESS**"
          } >> "$GITHUB_STEP_SUMMARY"
