name: Appliquer V24.4.51 temporaire

on:
  push:
    branches: [ v24-4-51-admin-notifications ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v6
        with:
          ref: v24-4-51-admin-notifications
          fetch-depth: 0
      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configurer Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Appliquer la passe V24.4.51
        run: python scripts/apply_v24_4_51_temp.py
      - name: Vérifier les JavaScript
        run: |
          node --check assets/js/sinjira-admin-v18.js
          python scripts/validate_admin_action_contract.py
          python scripts/validate_admin_console.py
          python scripts/validate_site.py
      - name: Retirer les fichiers temporaires
        run: |
          rm -f scripts/apply_v24_4_51_temp.py
          rm -f .github/workflows/apply-v24-4-51-temp.yml
      - name: Enregistrer la V24.4.51
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi
          git commit -m "SINJIRA V24.4.51 — centre de notifications administrateur"
          git push origin HEAD:v24-4-51-admin-notifications
