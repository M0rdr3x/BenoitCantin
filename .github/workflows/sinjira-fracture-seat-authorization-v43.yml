name: SINJIRA — Fracture contrôle des sièges V43
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'assets/js/sinjira-fracture-seat-authorization-v43.mjs'
      - 'tests/games/test_fracture_seat_authorization_v43.mjs'
      - 'docs/SINJIRA_FRACTURE_SEAT_AUTHORIZATION_V43.md'
      - '.github/workflows/sinjira-fracture-seat-authorization-v43.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-fracture-seat-authorization-v43.mjs'
      - 'tests/games/test_fracture_seat_authorization_v43.mjs'
      - 'docs/SINJIRA_FRACTURE_SEAT_AUTHORIZATION_V43.md'
      - '.github/workflows/sinjira-fracture-seat-authorization-v43.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sinjira-fracture-seat-authorization-v43-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  seat_contract:
    name: Solo, Duo, Express, bulletins humains et non-divulgation
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Récupérer les sources sans identifiants persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer la version Node épinglée
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Exécuter les contrats V36 et V43
        run: |
          node --check assets/js/sinjira-fracture-seat-authorization-v43.mjs
          node --test tests/games/test_fracture_mechanics_v36.mjs tests/games/test_fracture_seat_authorization_v43.mjs
      - name: Valider la frontière de confidentialité V36
        run: python3 scripts/validate_fracture_mechanics_v36.py
