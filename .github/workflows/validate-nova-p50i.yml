name: Projet Nova P50I - qualification sans autorisation
on:
  pull_request:
    paths:
      - "projets/projet-nova/controles/P50I_*"
      - "scripts/validate_nova_qualification_p50i.py"
      - "scripts/tests/test_validate_nova_qualification_p50i.py"
      - ".github/workflows/validate-nova-p50i.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification-preparatoire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compilation du validateur
        run: python -m py_compile scripts/validate_nova_qualification_p50i.py
      - name: Essais statiques uniquement
        run: python -m unittest discover -s scripts/tests -p 'test_validate_nova_qualification_p50i.py' -v
      - name: Audit local du modèle, toujours NO_GO
        run: python scripts/validate_nova_qualification_p50i.py
