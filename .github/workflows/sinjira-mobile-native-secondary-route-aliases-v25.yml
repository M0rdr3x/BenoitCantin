name: SINJIRA V25 — Alias secondaires vers hubs natifs

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile-native/NativeModuleRouter.tsx'
      - 'mobile-native/NativeLibraryHub.tsx'
      - 'mobile-native/NativeGamesHub.tsx'
      - 'mobile-native/NativeCommunityHub.tsx'
      - 'mobile-native/NativeMessagesHub.tsx'
      - 'mobile-native/NativeDatingHub.tsx'
      - 'mobile-native/NativeCharacterHub.tsx'
      - 'mobile-native/NativeSettingsHub.tsx'
      - 'mobile-native/NativePrivacyHub.tsx'
      - 'mobile-native/NATIVE_COMMUNITY_HUB_V25.md'
      - 'mobile-native/NATIVE_SECONDARY_ROUTE_ALIASES_V25.md'
      - 'mobile-native/NATIVE_ROUTE_DISPATCH_V25.md'
      - 'compte/blocages.html'
      - 'compte/regles-communaute.html'
      - 'compte/moderation.html'
      - 'assets/js/sinjira-moderation-appeals-v24-4-90.js'
      - 'mobile-native/safePublicShare.ts'
      - 'mobile-native/package.json'
      - 'mobile-native/package-lock.json'
      - 'mobile-native/scripts/validate-vault-mobile.mjs'
      - 'scripts/validate_mobile_native_secondary_route_aliases_v25.py'
      - 'scripts/validate_mobile_native_route_dispatch_v25.py'
      - 'scripts/validate_mobile_native_library_hub_v25.py'
      - 'scripts/validate_mobile_native_games_hub_v25.py'
      - 'scripts/validate_mobile_native_community_hub_v25.py'
      - 'scripts/validate_mobile_native_messages_hub_v25.py'
      - 'scripts/validate_mobile_native_dating_hub_v25.py'
      - 'scripts/validate_moderation_appeals_v24_4_90.py'
      - 'scripts/validate_mobile_native_character_hub_v25.py'
      - 'scripts/validate_mobile_native_settings_hub_v25.py'
      - 'scripts/validate_mobile_native_privacy_hub_v25.py'
      - 'scripts/validate_mobile_navigation_boundary_v25.py'
      - 'scripts/validate_mobile_safe_share_v25.py'
      - 'scripts/validate_device_challenge_client_boundary.py'
      - 'scripts/validate_no_committed_secrets.py'
      - 'scripts/validate_mobile_secondary_route_aliases_workflow_security.py'
      - '.github/workflows/sinjira-mobile-native-secondary-route-aliases-v25.yml'
      - '.github/workflows/sinjira-mobile-native-route-dispatch-v25.yml'
  push:
    branches: [ main ]
    paths:
      - 'mobile-native/**'
      - 'compte/blocages.html'
      - 'compte/regles-communaute.html'
      - 'compte/moderation.html'
      - 'assets/js/sinjira-moderation-appeals-v24-4-90.js'
      - 'scripts/validate_mobile_native_*.py'
      - 'scripts/validate_moderation_appeals_v24_4_90.py'
      - 'scripts/validate_mobile_navigation_boundary_v25.py'
      - 'scripts/validate_mobile_safe_share_v25.py'
      - 'scripts/validate_device_challenge_client_boundary.py'
      - 'scripts/validate_no_committed_secrets.py'
      - 'scripts/validate_mobile_secondary_route_aliases_workflow_security.py'
      - '.github/workflows/sinjira-mobile-native-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secondary-route-aliases:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false

      - name: Auto-tester le contrat CI des alias secondaires natifs
        run: python3 scripts/validate_mobile_secondary_route_aliases_workflow_security.py --self-test

      - name: Vérifier le contrat CI des alias secondaires natifs
        run: python3 scripts/validate_mobile_secondary_route_aliases_workflow_security.py

      - name: Valider les alias secondaires natifs V25
        run: python3 scripts/validate_mobile_native_secondary_route_aliases_v25.py

      - name: Revalider le routeur natif central
        run: python3 scripts/validate_mobile_native_route_dispatch_v25.py

      - name: Revalider le hub Bibliothèque
        run: python3 scripts/validate_mobile_native_library_hub_v25.py

      - name: Revalider le hub Mes parties
        run: python3 scripts/validate_mobile_native_games_hub_v25.py

      - name: Revalider le hub Communauté
        run: python3 scripts/validate_mobile_native_community_hub_v25.py

      - name: Revalider le hub Messages
        run: python3 scripts/validate_mobile_native_messages_hub_v25.py

      - name: Revalider le hub Rencontres
        run: python3 scripts/validate_mobile_native_dating_hub_v25.py

      - name: Revalider les décisions et appels humains
        run: python3 scripts/validate_moderation_appeals_v24_4_90.py

      - name: Revalider le hub Mon personnage
        run: python3 scripts/validate_mobile_native_character_hub_v25.py

      - name: Revalider le hub Paramètres
        run: python3 scripts/validate_mobile_native_settings_hub_v25.py

      - name: Revalider le hub Vie privée
        run: python3 scripts/validate_mobile_native_privacy_hub_v25.py

      - name: Revalider la frontière de navigation
        run: python3 scripts/validate_mobile_navigation_boundary_v25.py

      - name: Revalider le partage public natif
        run: python3 scripts/validate_mobile_safe_share_v25.py

      - name: Revalider la frontière challenge client
        run: python3 scripts/validate_device_challenge_client_boundary.py

      - name: Revalider l'absence de secrets suivis
        run: python3 scripts/validate_no_committed_secrets.py

      - name: Configurer Node.js sans cache implicite
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          check-latest: false

      - name: Installer les dépendances sans scripts de cycle de vie
        working-directory: mobile-native
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Vérifier le contrat mobile sensible existant
        working-directory: mobile-native
        run: npm run validate:vault

      - name: Vérifier TypeScript
        working-directory: mobile-native
        run: npm run typecheck
