name: Sécurité — interdire publication Pages depuis racine technique

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/validate_pages_artifact_boundary.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/validate_pages_artifact_boundary.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages-isolated-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python figé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Refuser les mutations Pages dangereuses
        run: python3 scripts/validate_pages_artifact_boundary.py --self-test
      - name: Valider tous les workflows de publication
        run: python3 scripts/validate_pages_artifact_boundary.py
