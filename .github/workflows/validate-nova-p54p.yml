name: Projet Nova P54P - Reproduction conditionnelle des localisations PDF 2024
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p54p.yml"
      - "scripts/reproduire_localisations_pdf_nova_p54p.py"
      - "scripts/tests/test_reproduire_localisations_pdf_nova_p54p.py"
      - "scripts/classer_ecarts_numeriques_nova_p54d.py"
      - "scripts/acquerir_publications_nova_p53z.py"
      - "scripts/controler_qualite_passation_nova_p54o.py"
      - "projets/projet-nova/etudes/P54P_*"
      - "projets/projet-nova/etudes/P54D_OBSERVATIONS_REELLES_2026_10_24.json"
      - "projets/projet-nova/etudes/P54O_CONTROLE_QUALITE_PASSATION_2024.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduction-sans-preuve-comptable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout lecture seule
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Pypdf epingle a la version des observations P54D
        run: python -m pip install pypdf==5.9.0
      - name: 70 tests offline de provenance, parsing et refus securise
        run: |
          python -m py_compile scripts/reproduire_localisations_pdf_nova_p54p.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
            "scripts/tests",pattern="test_reproduire_localisations_pdf_nova_p54p.py")
          assert suite.countTestCases()==70,suite.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
      - name: Bilan neutre avant tout acces reseau
        run: |
          python scripts/reproduire_localisations_pdf_nova_p54p.py \
            --bilan p54p_avant_acquisition.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("p54p_avant_acquisition.json").read_text("utf-8"))
          assert d["statut_capture"]=="NON_TENTE"
          assert d["copies_exactes_verifiees"]==0
          assert d["positions_caracteres_sur_texte_extrait"] is None
          assert d["occurrences_localisees_automatiquement"]==0
          assert d["economies_certifiees_cad"] is None
          assert d["decision"]=="NO_GO_AUTOMATIQUE"
          PY
      - name: Tenter acquisition HTTPS reelle sans publier les PDF
        shell: bash
        run: |
          set +e
          python scripts/reproduire_localisations_pdf_nova_p54p.py \
            --acquerir --bilan p54p_reproduction_conditionnelle.json
          result=$?
          set -e
          echo "Resultat capture P54P : $result (0=5 positions reproduites; 4=non reproduites)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ] && [ "$result" -ne 4 ]; then
            echo "ECHEC TECHNIQUE P54P $result" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("p54p_reproduction_conditionnelle.json").read_text("utf-8"))
          assert p["decision"]=="NO_GO_AUTOMATIQUE"
          assert p["economies_certifiees_cad"] is None
          assert p["tokens_bruts_publies"]==0
          assert p["originaux_confidentiels_publies"]==0
          assert p["expertises_independantes_signees"]==0
          assert p["pdf_sources_deja_attestes_par_emetteur"] is False
          assert p["occurrences_localisees_automatiquement"] in (0,5)
          if p["occurrences_localisees_automatiquement"]==5:
            a=p["positions_caracteres_sur_texte_extrait"]
            assert len(a)==5
            assert [x["index_observation_p54d"] for x in a]==list(range(5))
            assert p["copies_exactes_verifiees"]==2
            assert all(x["aucune_conclusion_financiere"] for x in a)
          else:
            assert p["positions_caracteres_sur_texte_extrait"] is None
          print("P54P copies exactes",p["copies_exactes_verifiees"])
          print("P54P positions reproduites",p["occurrences_localisees_automatiquement"])
          PY
      - name: Refuser certification meme apres acquisition technique
        run: |
          set +e
          python scripts/reproduire_localisations_pdf_nova_p54p.py \
            --exiger-certification
          result=$?
          set -e
          test "$result" -eq 3
      - name: Conserver uniquement bilans publics, jamais PDFs ni extraits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-p54p-reproduction-positions-pdf-conditionnelle
          path: |
            p54p_avant_acquisition.json
            p54p_reproduction_conditionnelle.json
          if-no-files-found: ignore
          retention-days: 7
