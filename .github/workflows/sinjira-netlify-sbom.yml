name: Sécurité — inventaire SBOM Netlify verrouillé

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/netlify-cli/**'
      - 'scripts/validate_netlify_cli_lock.py'
      - 'scripts/validate_netlify_sbom.py'
      - '.github/workflows/sinjira-netlify-sbom.yml'
  push:
    branches: [main]
    paths:
      - 'tools/netlify-cli/**'
      - 'scripts/validate_netlify_cli_lock.py'
      - 'scripts/validate_netlify_sbom.py'
      - '.github/workflows/sinjira-netlify-sbom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Vérifier le lockfile approuvé et le contrat SBOM
        run: |
          python3 scripts/validate_netlify_cli_lock.py
          python3 scripts/validate_netlify_sbom.py --self-test
      - name: Générer le SBOM sans installation ni scripts
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(mktemp -d)"
          trap 'rm -rf "$workspace"' EXIT
          # npm 10.9.8 exposes the directory basename as root component.name.
          # Keep isolation while making the directory match the reviewed package name.
          project="$workspace/sinjira-netlify-cli-toolchain"
          mkdir "$RUNNER_TEMP/netlify-sbom" "$workspace/home" "$project"
          cp tools/netlify-cli/package.json tools/netlify-cli/package-lock.json "$project/"
          touch "$workspace/user.conf" "$workspace/global.conf"
          cd "$project"
          test "$(npm --version)" = 10.9.8
          env -i PATH="$PATH" HOME="$workspace/home" npm sbom \
            --package-lock-only --sbom-format=cyclonedx --offline --ignore-scripts \
            --include=dev --include=optional --include=peer \
            --userconfig="$workspace/user.conf" --globalconfig="$workspace/global.conf" \
            > "$workspace/npm-raw.cdx.json"
          python3 "$GITHUB_WORKSPACE/scripts/validate_netlify_sbom.py" \
            --lock "$project/package-lock.json" --sbom "$workspace/npm-raw.cdx.json" \
            --normalized "$RUNNER_TEMP/netlify-sbom/netlify.cdx.json" \
            --receipt "$RUNNER_TEMP/netlify-sbom/receipt.json" \
            --source-sha "$GITHUB_SHA" --npm-version "$(npm --version)"
      - name: Conserver uniquement les deux rapports d'inventaire
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: netlify-sbom-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/netlify-sbom/netlify.cdx.json
            ${{ runner.temp }}/netlify-sbom/receipt.json
          retention-days: 7
          if-no-files-found: error
          overwrite: false
