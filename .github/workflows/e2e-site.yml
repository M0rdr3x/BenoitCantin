name: Tests navigateur SINJIRA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-site-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer Playwright et Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Démarrer le site statique local
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/sinjira-http.log 2>&1 &
          echo $! > /tmp/sinjira-http.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sinjira-http.log
          exit 1

      - name: Tester la version exacte du dépôt
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: python tests/e2e/test_public_site.py

      - name: Tester le site public réellement déployé
        if: github.event_name != 'pull_request'
        env:
          BASE_URL: https://www.benoitcantin.com/
        run: python tests/e2e/test_public_site.py

      - name: Arrêter le serveur local
        if: always()
        run: |
          if [ -f /tmp/sinjira-http.pid ]; then kill "$(cat /tmp/sinjira-http.pid)" || true; fi
