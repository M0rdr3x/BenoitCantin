name: Tests navigateur SINJIRA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-site-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-contract:
    name: Contrat sécurité CI navigateur
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Auto-tester les frontières du workflow navigateur
        run: python3 scripts/validate_e2e_workflow_security.py --self-test

      - name: Vérifier les frontières du workflow navigateur
        run: python3 scripts/validate_e2e_workflow_security.py

  browser-smoke:
    needs: workflow-contract
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Navigation ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble@sha256:a9731514f24121d1dcd25d58d0a38146646d290a5998fd80d3e533e7b5e21c69
      options: --user 1001
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Installer le client Playwright épinglé
        run: python -m pip install --disable-pip-version-check "playwright==1.61.0"

      - name: Démarrer le site statique local
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/sinjira-http.log 2>&1 &
          echo $! > /tmp/sinjira-http.pid
          i=0
          while [ "$i" -lt 20 ]; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1).read(1)" >/dev/null 2>&1; then exit 0; fi
            i=$((i + 1))
            sleep 1
          done
          cat /tmp/sinjira-http.log
          exit 1

      - name: Tester la version exacte du dépôt avec ${{ matrix.browser }}
        env:
          BASE_URL: http://127.0.0.1:4173/
          BROWSER: ${{ matrix.browser }}
        run: |
          run_suite() {
            python tests/e2e/test_public_site.py &&
            python tests/e2e/test_literature_site.py
          }
          if run_suite; then
            exit 0
          fi
          if [ "$BROWSER" != "firefox" ]; then
            exit 1
          fi
          echo "::warning::Premier passage Firefox en échec; une seule relance bornée est autorisée pour absorber un timeout moteur isolé."
          sleep 2
          run_suite

      - name: Tester le site public déployé avec ${{ matrix.browser }}
        if: github.event_name != 'pull_request'
        env:
          BASE_URL: https://www.benoitcantin.com/
          BROWSER: ${{ matrix.browser }}
        run: |
          python tests/e2e/test_public_site.py
          python tests/e2e/test_literature_site.py

      - name: Arrêter le serveur local
        if: always()
        run: |
          if [ -f /tmp/sinjira-http.pid ]; then kill "$(cat /tmp/sinjira-http.pid)" || true; fi

  lighthouse-mobile:
    needs: workflow-contract
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Lighthouse mobile Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Configurer Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'

      - name: Démarrer le site statique local
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/sinjira-http.log 2>&1 &
          echo $! > /tmp/sinjira-http.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sinjira-http.log
          exit 1

      - name: Auditer l’accueil en profil mobile Lighthouse
        run: |
          npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ \
            --quiet \
            --output=json \
            --output-path=/tmp/lighthouse-mobile.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
          python scripts/check_lighthouse.py /tmp/lighthouse-mobile.json

      - name: Arrêter le serveur local
        if: always()
        run: |
          if [ -f /tmp/sinjira-http.pid ]; then kill "$(cat /tmp/sinjira-http.pid)" || true; fi
