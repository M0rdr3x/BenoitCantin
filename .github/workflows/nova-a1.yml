name: Validation Projet Nova

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'projets/projet-nova/**'
      - 'scripts/check_nova_a1.py'
      - 'scripts/validate_nova_a1_workflow_security.py'
      - '.github/workflows/nova-a1.yml'
  push:
    branches: [ main ]
    paths:
      - 'projets/projet-nova/**'
      - 'scripts/check_nova_a1.py'
      - 'scripts/validate_nova_a1_workflow_security.py'
      - '.github/workflows/nova-a1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-nova:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Auto-tester le contrat CI Projet Nova
        run: python3 scripts/validate_nova_a1_workflow_security.py --self-test

      - name: Vérifier le contrat CI Projet Nova
        run: python3 scripts/validate_nova_a1_workflow_security.py

      - name: Vérifier Projet Nova
        run: python3 scripts/check_nova_a1.py
