name: Validation conformité globale V24.4.83

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/functions/delete-player-account/**'
      - 'assets/js/v24-signup.js'
      - 'assets/js/v24-data-control.js'
      - 'assets/js/sinjira-privacy-center-v24-4-83.js'
      - 'compte/inscription.html'
      - 'compte/vie-privee.html'
      - 'compte/confidentialite-joueur.html'
      - 'compte/parametres.html'
      - 'confidentialite.html'
      - 'gouvernance-vie-privee.html'
      - 'contact.html'
      - 'avis-legal.html'
      - 'docs/compliance/**'
      - 'scripts/validate_global_safety_compliance_v24_4_83.py'
      - 'scripts/validate_child_guardian_signup_v25.py'
      - 'scripts/validate_data_control_v24_4_69.py'
      - '.github/workflows/validate-global-safety-v24-4-83.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/functions/delete-player-account/**'
      - 'assets/js/v24-signup.js'
      - 'assets/js/v24-data-control.js'
      - 'assets/js/sinjira-privacy-center-v24-4-83.js'
      - 'compte/inscription.html'
      - 'compte/vie-privee.html'
      - 'compte/confidentialite-joueur.html'
      - 'compte/parametres.html'
      - 'confidentialite.html'
      - 'gouvernance-vie-privee.html'
      - 'contact.html'
      - 'avis-legal.html'
      - 'docs/compliance/**'
      - 'scripts/validate_global_safety_compliance_v24_4_83.py'
      - 'scripts/validate_child_guardian_signup_v25.py'
      - 'scripts/validate_data_control_v24_4_69.py'
      - '.github/workflows/validate-global-safety-v24-4-83.yml'

permissions:
  contents: read

jobs:
  compliance-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Récupérer le dépôt sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Compiler les validateurs
        run: >-
          python -m py_compile
          scripts/validate_global_safety_compliance_v24_4_83.py
          scripts/validate_child_guardian_signup_v25.py
          scripts/validate_data_control_v24_4_69.py
      - name: Valider le contrat V24.4.83 et sa convergence V25
        run: python scripts/validate_global_safety_compliance_v24_4_83.py
      - name: Valider le compte enfant supervisé V25
        run: python scripts/validate_child_guardian_signup_v25.py
      - name: Vérifier le contrôle des données et suppressions
        run: python scripts/validate_data_control_v24_4_69.py
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check assets/js/v24-signup.js
          node --check assets/js/v24-data-control.js
          node --check assets/js/sinjira-privacy-center-v24-4-83.js
      - name: Vérifier le ledger production
        run: python scripts/validate_production_migration_ledger.py
