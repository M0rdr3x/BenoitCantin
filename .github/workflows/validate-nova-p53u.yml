name: Projet Nova P53U - Revue independante sans avis signe
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p53u.yml"
      - "scripts/verifier_separation_controles_nova_p53u.py"
      - "scripts/tests/test_verifier_separation_controles_nova_p53u.py"
      - "scripts/verifier_integrite_locale_nova_p53t.py"
      - "scripts/suivre_demandes_acces_nova_p53s.py"
      - "scripts/preparer_demandes_acces_nova_p53r.py"
      - "scripts/inventorier_pieces_primaires_nova_p53q.py"
      - "scripts/constituer_dossiers_institutionnels_nova_p53p.py"
      - "scripts/prioriser_sources_officielles_nova_p53o.py"
      - "projets/projet-nova/etudes/P53U_*"
      - "projets/projet-nova/etudes/P53T_PROTOCOLE_INTEGRITE_PROVENANCE.json"
      - "projets/projet-nova/etudes/P53S_REGISTRE_SUIVI_ET_RECOURS.json"
      - "projets/projet-nova/etudes/P53R_PROJETS_DEMANDES_ACCES_2024.json"
      - "projets/projet-nova/etudes/P53Q_INVENTAIRE_PIECES_ET_CONTREPARTIES.json"
      - "projets/projet-nova/etudes/P53P_DOSSIERS_INSTITUTIONNELS_2024.json"
      - "projets/projet-nova/etudes/P53O_MATRICE_SOURCES_OFFICIELLES.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification-des-roles-et-garanties:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Code sans credentials permanents
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Exécuter 56 tests de séparation et de refus
        run: |
          python -m py_compile scripts/verifier_separation_controles_nova_p53u.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
            "scripts/tests",pattern="test_verifier_separation_controles_nova_p53u.py")
          assert suite.countTestCases()==56,suite.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
      - name: Générer 48 points de contrôle sans avis certifié
        run: |
          python scripts/verifier_separation_controles_nova_p53u.py --rapport p53u_bilan.json --matrice p53u_matrice.json
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path("p53u_bilan.json").read_text("utf-8"))
          m=json.loads(Path("p53u_matrice.json").read_text("utf-8"))["positions"]
          assert len(m)==48
          assert b["positions_documentaires_p53q"]==102
          assert b["personnes_reelles_independantes_attestees"]==0
          assert b["avis_comptables_independants_signes"]==0
          assert b["documents_provenance_authentifies"]==0
          assert b["economie_operationnelle_certifiee_cad"] is None
          assert b["decision"]=="NO_GO_AUTOMATIQUE"
          PY
          set +e
          python scripts/verifier_separation_controles_nova_p53u.py --exiger-certification-independante --rapport p53u_refus.json
          exit_code=$?
          set -e
          test "$exit_code" -eq 3
      - name: Conserver uniquement les synthèses non sensibles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-p53u-roles-preuves-no-go
          path: |
            p53u_bilan.json
            p53u_refus.json
          if-no-files-found: ignore
          retention-days: 7
