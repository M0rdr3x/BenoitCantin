name: SINJIRA — sécurité des EXECUTE des triggers privés

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-trigger-acl-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  private-trigger-acl:
    name: Refus de droits EXECUTE publics sur triggers internes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cloner sans conserver les identifiants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python épinglé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Tester les contre-exemples dangereux
        run: python3 scripts/validate_private_trigger_execute_acl.py --self-test
      - name: Vérifier la migration et la couverture pgtap
        run: python3 scripts/validate_private_trigger_execute_acl.py
