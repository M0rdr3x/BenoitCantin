name: Validation participation Projet Nova

on:
  pull_request:
    branches: [main]
    paths:
      - 'projets/projet-nova/recrutement.html'
      - 'projets/projet-nova/confidentialite.html'
      - 'projets/projet-nova/participer.html'
      - 'projets/projet-nova/avis-legal.html'
      - 'projets/projet-nova/contact.html'
      - 'scripts/validate_nova_participation_v21.py'
      - 'scripts/validate_nova_publication_p50b.py'
      - 'scripts/tests/test_validate_nova_publication_p50b.py'
      - '.github/workflows/validate-nova-participation.yml'
  push:
    branches: [main]
    paths:
      - 'projets/projet-nova/recrutement.html'
      - 'projets/projet-nova/confidentialite.html'
      - 'projets/projet-nova/participer.html'
      - 'projets/projet-nova/avis-legal.html'
      - 'projets/projet-nova/contact.html'
      - 'scripts/validate_nova_participation_v21.py'
      - 'scripts/validate_nova_publication_p50b.py'
      - 'scripts/tests/test_validate_nova_publication_p50b.py'

permissions:
  contents: read

jobs:
  nova-participation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Valider la participation progressive
        run: python scripts/validate_nova_participation_v21.py
      - name: Tester les écarts de contenu historiques (données fictives)
        run: python -m unittest discover -s scripts/tests -p test_validate_nova_publication_p50b.py -v
      - name: Vérifier les cinq pages publiques actives
        run: python scripts/validate_nova_publication_p50b.py
      - name: Valider les routes et fichiers du site
        run: python scripts/validate_site.py
