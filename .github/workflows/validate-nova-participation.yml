name: Validation participation Projet Nova

on:
  pull_request:
    branches: [main]
    paths:
      - 'projets/projet-nova/recrutement.html'
      - 'projets/projet-nova/confidentialite.html'
      - 'scripts/validate_nova_participation_v21.py'
      - '.github/workflows/validate-nova-participation.yml'
  push:
    branches: [main]
    paths:
      - 'projets/projet-nova/recrutement.html'
      - 'projets/projet-nova/confidentialite.html'
      - 'scripts/validate_nova_participation_v21.py'

permissions:
  contents: read

jobs:
  nova-participation:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Valider la participation progressive
        run: python scripts/validate_nova_participation_v21.py
      - name: Valider les routes et fichiers du site
        run: python scripts/validate_site.py
