name: Sécurité — répétition liaison coffre et session Auth

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/security-candidates/vault_auth_session_binding*.sql'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/vault-auth-session-binding-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Installer Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0
      - name: Vérifier la migration canonique exacte
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'f9d47832451382eefbec3d3d859b05f72d1696dec1a5d312f2b048ff31b494dd' 'supabase/migrations/20261128082928_sinjira_vault_auth_session_binding.sql' | sha256sum --check --strict
      - name: Démarrer la pile locale et rejouer la migration
        run: supabase start
      - name: Vérifier les autorisations et la révocation
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --local
          supabase test db supabase/security-candidates/vault_auth_session_binding.test.sql --local
      - name: Arrêter la pile locale
        if: always()
        run: supabase stop --no-backup || true
