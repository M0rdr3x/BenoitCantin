name: NOVA — surveillance du site public sans vote

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-production-readonly-smoke
  cancel-in-progress: false

jobs:
  public-smoke:
    name: Vérifier le vrai domaine, les corpus publics et l'API en lecture
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Récupérer le code public de référence
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Installer Python figé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Vérifier les cas négatifs du contrôle
        run: python scripts/smoke_nova_live_public.py --self-test
      - name: Vérifier le site réellement publié sans soumettre de bulletin
        run: python scripts/smoke_nova_live_public.py

  public-compass-browser:
    name: Boussole publique — ${{ matrix.browser }} sur desktop et mobile simulé
    needs: public-smoke
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble@sha256:a9731514f24121d1dcd25d58d0a38146646d290a5998fd80d3e533e7b5e21c69
      options: --user 1001
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Récupérer le dépôt sans droits persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Installer Playwright épinglé sans services additionnels
        run: python -m pip install --disable-pip-version-check "playwright==1.61.0"
      - name: Vérifier le contrat local du contrôle, hors réseau
        run: python scripts/smoke_nova_live_compass_browser.py --self-test
      - name: Parcours public réel, profil partiel, 64 sauts, vue mobile et rechargement sans vote
        env:
          BROWSER: ${{ matrix.browser }}
        run: python scripts/smoke_nova_live_compass_browser.py
