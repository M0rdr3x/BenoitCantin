name: SINJIRA V24.5.36 — Suivi admin précommandes

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - sinjira-v24.5.36-preorder-admin-workflow

permissions:
  contents: read

jobs:
  preorder-admin-workflow-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Vérifier Python 3.12 sur Ubuntu 24.04
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), "Python 3.12 requis"'
      - name: Vérifier V24.5.36
        run: python3 scripts/validate_preorder_admin_workflow_v24_5_36.py
      - name: Vérifier V24.5.35 historique
        run: python3 scripts/validate_preorder_reference_admin_lookup_v24_5_35.py
      - name: Vérifier le ledger production
        run: python3 scripts/validate_production_migration_ledger.py
