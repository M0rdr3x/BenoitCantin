name: SINJIRA V24.5.36 — Suivi admin précommandes

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - sinjira-v24.5.36-preorder-admin-workflow

permissions:
  contents: read

jobs:
  preorder-admin-workflow-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier V24.5.36
        run: python scripts/validate_preorder_admin_workflow_v24_5_36.py
      - name: Vérifier V24.5.35 historique
        run: python scripts/validate_preorder_reference_admin_lookup_v24_5_35.py
      - name: Vérifier le ledger production
        run: python scripts/validate_production_migration_ledger.py
