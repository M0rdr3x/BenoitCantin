name: SINJIRA — Fracture soupçons privés V39
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'assets/js/sinjira-fracture-soupcons-v39.mjs'
      - 'tests/games/test_fracture_soupcons_v39.mjs'
      - 'docs/SINJIRA_FRACTURE_SOUPCONS_V39.md'
      - '.github/workflows/sinjira-fracture-soupcons-v39.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-fracture-soupcons-v39.mjs'
      - 'tests/games/test_fracture_soupcons_v39.mjs'
      - 'docs/SINJIRA_FRACTURE_SOUPCONS_V39.md'
      - '.github/workflows/sinjira-fracture-soupcons-v39.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sinjira-fracture-soupcons-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Validation des soupçons et confidentialité structurelle
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Récupérer le dépôt sans identifiants persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Node épinglé
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Exécuter les contrats de règles V36 et de soupçons V39
        run: |
          node --check assets/js/sinjira-fracture-soupcons-v39.mjs
          node --test tests/games/test_fracture_mechanics_v36.mjs tests/games/test_fracture_soupcons_v39.mjs
      - name: Vérifier les frontières de confidentialité du moteur V36
        run: python3 scripts/validate_fracture_mechanics_v36.py
