name: SINJIRA V25 — Destinations hubs natifs

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'compte/*.html'
      - 'mobile-native/App.tsx'
      - 'mobile-native/NativeModuleRouter.tsx'
      - 'mobile-native/Native*Hub.tsx'
      - 'mobile-native/NATIVE_ACCOUNT_ROUTE_CLASSIFICATION_V25.md'
      - 'mobile-native/NATIVE_INTENT_ROUTING_V25.md'
      - 'mobile-native/NATIVE_HUB_DESTINATION_CONTRACT_V25.md'
      - 'mobile-native/package.json'
      - 'mobile-native/package-lock.json'
      - 'mobile-native/scripts/validate-vault-mobile.mjs'
      - 'scripts/validate_mobile_native_hub_destinations_v25.py'
      - 'scripts/validate_mobile_native_account_route_classification_v25.py'
      - 'scripts/validate_mobile_native_intent_routing_v25.py'
      - 'scripts/validate_mobile_native_route_dispatch_v25.py'
      - 'scripts/validate_mobile_navigation_boundary_v25.py'
      - 'scripts/validate_mobile_safe_share_v25.py'
      - 'scripts/validate_device_challenge_client_boundary.py'
      - 'scripts/validate_no_committed_secrets.py'
      - 'scripts/validate_mobile_hub_destinations_workflow_security.py'
      - '.github/workflows/sinjira-mobile-native-hub-destinations-v25.yml'
      - '.github/workflows/sinjira-mobile-native-route-dispatch-v25.yml'
  push:
    branches: [ main ]
    paths:
      - 'compte/*.html'
      - 'mobile-native/**'
      - 'scripts/validate_mobile_native_*.py'
      - 'scripts/validate_mobile_navigation_boundary_v25.py'
      - 'scripts/validate_mobile_safe_share_v25.py'
      - 'scripts/validate_device_challenge_client_boundary.py'
      - 'scripts/validate_no_committed_secrets.py'
      - 'scripts/validate_mobile_hub_destinations_workflow_security.py'
      - '.github/workflows/sinjira-mobile-native-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-hub-destinations:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false

      - name: Auto-tester le contrat CI des destinations des hubs natifs
        run: python3 scripts/validate_mobile_hub_destinations_workflow_security.py --self-test

      - name: Vérifier le contrat CI des destinations des hubs natifs
        run: python3 scripts/validate_mobile_hub_destinations_workflow_security.py

      - name: Valider le contrat des destinations des hubs natifs V25
        run: python3 scripts/validate_mobile_native_hub_destinations_v25.py

      - name: Revalider la classification exhaustive des routes compte
        run: python3 scripts/validate_mobile_native_account_route_classification_v25.py

      - name: Revalider le routage des intentions natives
        run: python3 scripts/validate_mobile_native_intent_routing_v25.py

      - name: Revalider le routage uniforme des hubs
        run: python3 scripts/validate_mobile_native_route_dispatch_v25.py

      - name: Revalider la frontière de navigation mobile
        run: python3 scripts/validate_mobile_navigation_boundary_v25.py

      - name: Revalider le partage public natif
        run: python3 scripts/validate_mobile_safe_share_v25.py

      - name: Revalider la frontière challenge client
        run: python3 scripts/validate_device_challenge_client_boundary.py

      - name: Revalider l'absence de secrets suivis
        run: python3 scripts/validate_no_committed_secrets.py

      - name: Configurer Node.js sans cache implicite
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          check-latest: false

      - name: Installer les dépendances sans scripts de cycle de vie
        working-directory: mobile-native
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Vérifier le contrat mobile sensible existant
        working-directory: mobile-native
        run: npm run validate:vault

      - name: Vérifier TypeScript
        working-directory: mobile-native
        run: npm run typecheck
