name: Projet Nova P54B - Verification des mesures reelles et non certifiees
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p54b-observations.yml"
      - "scripts/verifier_observations_numeriques_nova_p54b.py"
      - "scripts/tests/test_verifier_observations_numeriques_nova_p54b.py"
      - "scripts/comparer_postes_financiers_nova_p54b.py"
      - "scripts/verifier_resultats_observes_nova_p54a.py"
      - "projets/projet-nova/etudes/P54B_*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mesures-probatoires-sans-conclusion-financiere:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout lecture seule
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Dependances PDF epinglees
        run: python -m pip install pypdf==5.9.0
      - name: Executer 26 tests de resultat observe
        run: |
          python -m py_compile scripts/verifier_observations_numeriques_nova_p54b.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
            "scripts/tests",pattern="test_verifier_observations_numeriques_nova_p54b.py")
          assert suite.countTestCases()==26,suite.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
      - name: Verifier 11 paires tres ressemblantes mais zero montant certifie
        run: |
          python scripts/verifier_observations_numeriques_nova_p54b.py --bilan p54b_observations_validees.json
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path("p54b_observations_validees.json").read_text("utf-8"))
          assert b["paires_numériques_observees"]==12
          assert b["paires_recouvrement_au_moins_97_pourcent"]==11
          assert b["controles_comptables_toujours_requis"]==96
          assert b["montants_certifies"]==0
          assert b["economies_certifiees_cad"] is None
          assert b["decision"]=="NO_GO_AUTOMATIQUE"
          PY
          set +e
          python scripts/verifier_observations_numeriques_nova_p54b.py --exiger-certification
          result=$?
          set -e
          test "$result" -eq 3
      - name: Ne conserver que la synthese statistique
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-p54b-observations-validees-aucun-audit
          path: p54b_observations_validees.json
          if-no-files-found: ignore
          retention-days: 7
