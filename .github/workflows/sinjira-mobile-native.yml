name: Validation mobile native SINJIRA

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile-native/**'
      - 'scripts/validate_mobile_native_root_workflow_security.py'
      - '.github/workflows/sinjira-mobile-native.yml'
  push:
    branches: [ main ]
    paths:
      - 'mobile-native/**'
      - 'scripts/validate_mobile_native_root_workflow_security.py'
      - '.github/workflows/sinjira-mobile-native.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile-native
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Auto-tester le contrat CI mobile natif
        working-directory: .
        run: python3 scripts/validate_mobile_native_root_workflow_security.py --self-test

      - name: Vérifier le contrat CI mobile natif
        working-directory: .
        run: python3 scripts/validate_mobile_native_root_workflow_security.py

      - name: Configurer Node.js sans cache implicite
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'

      - name: Installer les dépendances sans scripts de cycle de vie
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Vérifier le contrat mobile V25 sensible
        run: npm run validate:vault

      - name: Tester la liaison du token push à l’installation
        run: npm run test:push-installation-binding

      - name: Vérifier TypeScript
        run: npm run typecheck
