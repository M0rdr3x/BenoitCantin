name: SINJIRA Livre I — frontière privée intégrale

on:
  push:
    branches: [ main ]
    paths:
      - 'projets/sinjira/**'
      - 'assets/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/tests/livre_i_entitlements_read_only_a1.test.sql'
      - 'supabase/functions/get-document-url/**'
      - 'supabase/functions/get-private-book-url/**'
      - 'scripts/validate_sinjira_livre_i_delivery.py'
      - 'scripts/validate_livre_i_entitlement_boundary.py'
      - '.github/workflows/sinjira-livre-i-private-delivery.yml'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'manifest.webmanifest'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'projets/sinjira/**'
      - 'assets/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/tests/livre_i_entitlements_read_only_a1.test.sql'
      - 'supabase/functions/get-document-url/**'
      - 'supabase/functions/get-private-book-url/**'
      - 'scripts/validate_sinjira_livre_i_delivery.py'
      - 'scripts/validate_livre_i_entitlement_boundary.py'
      - '.github/workflows/sinjira-livre-i-private-delivery.yml'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'manifest.webmanifest'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sinjira-livre-i-private-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  delivery-boundary:
    name: Vérifier la frontière de diffusion du Livre I
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Récupérer le dépôt sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Auto-tester le validateur de diffusion
        run: python3 scripts/validate_sinjira_livre_i_delivery.py --self-test

      - name: Vérifier le contrat, JWT, entitlements et actifs publics
        run: python3 scripts/validate_sinjira_livre_i_delivery.py

      - name: Auto-tester la frontière des droits numériques
        run: python3 scripts/validate_livre_i_entitlement_boundary.py --self-test

      - name: Vérifier la lecture seule des droits numériques
        run: python3 scripts/validate_livre_i_entitlement_boundary.py
