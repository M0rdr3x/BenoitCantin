name: SINJIRA Livre I — frontière privée intégrale

on:
  push:
    branches: [ main ]
    paths:
      - 'projets/sinjira/**'
      - 'assets/**'
      - 'compte/bibliotheque.html'
      - 'compte/licences.html'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/tests/livre_i_entitlements_read_only_a1.test.sql'
      - 'supabase/functions/get-document-url/**'
      - 'supabase/functions/get-private-book-url/**'
      - 'supabase/functions/_shared/private-book-storage-guard.mjs'
      - 'scripts/test_private_book_storage_guard.mjs'
      - 'scripts/test_livre_i_private_delivery_runtime.mjs'
      - 'scripts/validate_get_private_book_url_security.py'
      - 'scripts/validate_sinjira_livre_i_delivery.py'
      - 'scripts/validate_livre_i_entitlement_boundary.py'
      - 'scripts/validate_livre_i_entitlement_ui.py'
      - '.github/workflows/sinjira-livre-i-private-delivery.yml'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'manifest.webmanifest'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'projets/sinjira/**'
      - 'assets/**'
      - 'compte/bibliotheque.html'
      - 'compte/licences.html'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/tests/livre_i_entitlements_read_only_a1.test.sql'
      - 'supabase/functions/get-document-url/**'
      - 'supabase/functions/get-private-book-url/**'
      - 'supabase/functions/_shared/private-book-storage-guard.mjs'
      - 'scripts/test_private_book_storage_guard.mjs'
      - 'scripts/test_livre_i_private_delivery_runtime.mjs'
      - 'scripts/validate_get_private_book_url_security.py'
      - 'scripts/validate_sinjira_livre_i_delivery.py'
      - 'scripts/validate_livre_i_entitlement_boundary.py'
      - 'scripts/validate_livre_i_entitlement_ui.py'
      - '.github/workflows/sinjira-livre-i-private-delivery.yml'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'manifest.webmanifest'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sinjira-livre-i-private-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  delivery-boundary:
    name: Vérifier la frontière de diffusion du Livre I
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Récupérer le dépôt sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Configurer Node.js version verrouillée
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          check-latest: false

      - name: Tester le vrai handler Livre I, les buckets privés et les chemins PDF
        run: |
          node --check scripts/test_livre_i_private_delivery_runtime.mjs
          node --test scripts/test_private_book_storage_guard.mjs scripts/test_livre_i_private_delivery_runtime.mjs

      - name: Tester les régressions de signature privée du Livre I
        run: |
          python3 scripts/validate_get_private_book_url_security.py --self-test
          python3 scripts/validate_get_private_book_url_security.py

      - name: Auto-tester le validateur de diffusion
        run: python3 scripts/validate_sinjira_livre_i_delivery.py --self-test

      - name: Vérifier le contrat, JWT, entitlements et actifs publics
        run: python3 scripts/validate_sinjira_livre_i_delivery.py

      - name: Auto-tester la frontière des droits numériques
        run: python3 scripts/validate_livre_i_entitlement_boundary.py --self-test

      - name: Vérifier la lecture seule des droits numériques
        run: python3 scripts/validate_livre_i_entitlement_boundary.py

      - name: Auto-tester la clarté UI des droits Livre I
        run: python3 scripts/validate_livre_i_entitlement_ui.py --self-test

      - name: Vérifier rôle propriétaire, droits réels et diffusion non activée
        run: python3 scripts/validate_livre_i_entitlement_ui.py
