name: Projet Nova P53P - Dossiers documentaires institutionnels 2024
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p53p.yml"
      - "scripts/constituer_dossiers_institutionnels_nova_p53p.py"
      - "scripts/tests/test_constituer_dossiers_institutionnels_nova_p53p.py"
      - "scripts/prioriser_sources_officielles_nova_p53o.py"
      - "scripts/preparer_acquisition_preuves_nova_p53n.py"
      - "scripts/construire_registre_couts_evitables_nova_p53m.py"
      - "scripts/evaluer_hypotheses_economies_nova_p53l.py"
      - "scripts/preparer_controles_probatoires_nova_p53k.py"
      - "scripts/auditer_appariements_municipaux_nova_p53j.py"
      - "projets/projet-nova/etudes/P53P_*"
      - "projets/projet-nova/etudes/P53O_MATRICE_SOURCES_OFFICIELLES.json"
      - "projets/projet-nova/etudes/P53N_PLAN_ACQUISITION_PREUVES.json"
      - "projets/projet-nova/etudes/P53M_CRITERES_COUTS_EVITABLES.json"
      - "projets/projet-nova/etudes/P53L_CADRE_EVALUATION_ECONOMIES.json"
      - "projets/projet-nova/etudes/P53K_EXIGENCES_PROBATOIRES.json"
      - "projets/projet-nova/etudes/P53I_SOURCES_REVISION_ET_CHARGES_2024.json"
      - "projets/projet-nova/etudes/P53H_PRIORITES_VERIFICATION_2024.json"
      - "projets/projet-nova/etudes/sources/P53I_MAMH_2024_1344_RECETTES_CHARGES_SELECTION.csv"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dossier-reel-sans-economie-inventee:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Code en lecture seule
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Verifier les 46 tests de non certification
        run: |
          python -m py_compile scripts/constituer_dossiers_institutionnels_nova_p53p.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
            "scripts/tests",pattern="test_constituer_dossiers_institutionnels_nova_p53p.py")
          assert suite.countTestCases()==46,suite.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
      - name: Reconstituer six dossiers et bloquer les gains non prouvés
        run: |
          python scripts/constituer_dossiers_institutionnels_nova_p53p.py --bilan p53p_bilan.json --dossiers p53p_six_dossiers.json
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path("p53p_bilan.json").read_text("utf-8"))
          d=json.loads(Path("p53p_six_dossiers.json").read_text("utf-8"))["dossiers"]
          assert len(d)==6
          assert [x["code_organisme"] for x in d[:5]]==[
              "66023","T1025","23027","T0081","T0088"]
          assert d[-1]["code_organisme"]=="39135"
          assert b["cas_consolidation_reciproque_deja_signalee"]==2
          assert b["economies_certifiees_cad"] is None
          assert b["demandes_d_acces_envoyees"]==0
          assert b["decision"]=="NO_GO_AUTOMATIQUE"
          assert all(x["economie_budgetaire_certifiee_cad"] is None for x in d)
          PY
          set +e
          python scripts/constituer_dossiers_institutionnels_nova_p53p.py --exiger-economies-certifiees --bilan p53p_refus.json
          code=$?
          set -e
          test "$code" -eq 3
      - name: Uniquement synthese non sensible
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-p53p-6-dossiers-publics-no-go
          path: |
            p53p_bilan.json
            p53p_refus.json
          if-no-files-found: ignore
          retention-days: 7
