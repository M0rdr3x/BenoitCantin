name: SINJIRA V24.5.17 — Frontière RPC famille et playtest

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/playtest_invitations_v24_4_65.test.sql'
      - 'supabase/production-migration-ledger.txt'
      - 'scripts/validate_family_playtest_rpc_v24_5_17.py'
      - 'scripts/validate_family_playtest_rpc_workflow_security.py'
      - 'scripts/validate_parallel_user_rpc_v24_5_16.py'
      - 'scripts/validate_production_migration_ledger.py'
      - 'scripts/validate_production_schema_manifest.py'
      - 'scripts/validate_free_only_mode.py'
      - 'FAMILY_PLAYTEST_RPC_BOUNDARY_V24_5_17.md'
      - '.github/workflows/sinjira-family-playtest-rpc-v24-5-17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python exact
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Auto-tester le contrat CI famille/playtest
        run: python scripts/validate_family_playtest_rpc_workflow_security.py --self-test

      - name: Vérifier le contrat CI famille/playtest
        run: python scripts/validate_family_playtest_rpc_workflow_security.py

      - name: Contrat frontière famille/playtest V24.5.17
        run: python scripts/validate_family_playtest_rpc_v24_5_17.py

      - name: Contrat Monde parallèle historique V24.5.16
        run: python scripts/validate_parallel_user_rpc_v24_5_16.py

      - name: Validation statique du site
        run: python scripts/validate_site.py

      - name: Contrat Supabase
        run: python scripts/validate_supabase.py

      - name: Mode gratuit et services externes
        run: python scripts/validate_free_only_mode.py

      - name: Ledger production
        run: python scripts/validate_production_migration_ledger.py

      - name: Manifeste du schéma production
        run: python scripts/validate_production_schema_manifest.py
