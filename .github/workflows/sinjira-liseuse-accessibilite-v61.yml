name: "SINJIRA V61 — focus du livre et annonces de navigation"
on:
  pull_request:
    branches:
      - fix/sinjira-liseuse-v60-fin-de-page-sans-micro-ecran-20261110
      - main
    paths:
      - 'assets/js/sinjira-liseuse-reflow-v53.mjs'
      - 'assets/js/sinjira-liseuse-v26.js'
      - 'compte/liseuse.html'
      - 'assets/css/sinjira-liseuse-v26.css'
      - 'tests/sinjira-liseuse-reflow-v53.test.mjs'
      - 'tests/e2e/test_sinjira_liseuse_responsive_v58.py'
      - '.github/workflows/sinjira-liseuse-accessibilite-v61.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-liseuse-reflow-v53.mjs'
      - 'tests/e2e/test_sinjira_liseuse_responsive_v58.py'
      - '.github/workflows/sinjira-liseuse-accessibilite-v61.yml'
permissions:
  contents: read

jobs:
  focus-keyboard:
    name: "Clavier et vraie liseuse — ${{ matrix.browser }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout sans secrets persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Vérifier syntaxe JavaScript et Python
        run: |
          node --check assets/js/sinjira-liseuse-reflow-v53.mjs
          node --check assets/js/sinjira-liseuse-v26.js
          node --check assets/js/sinjira-liseuse-touch-v52.mjs
          node --check tests/sinjira-liseuse-reflow-v53.test.mjs
          python3 -m py_compile tests/e2e/test_sinjira_liseuse_mobile_v54.py tests/e2e/test_sinjira_liseuse_real_page_v57.py tests/e2e/test_sinjira_liseuse_responsive_v58.py
      - name: Régressions Node des versions V52 à V61
        run: |
          node --test tests/sinjira-liseuse-reflow-v53.test.mjs tests/sinjira-liseuse-touch-v52.test.mjs
      - name: Navigateur mobile synthétique, PDF et compte bloqués
        run: |
          python3 -m venv .venv-reader-v61
          . .venv-reader-v61/bin/activate
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
          python tests/e2e/test_sinjira_liseuse_mobile_v54.py --browser ${{ matrix.browser }}
          python tests/e2e/test_sinjira_liseuse_real_page_v57.py --browser ${{ matrix.browser }}
          python tests/e2e/test_sinjira_liseuse_responsive_v58.py --browser ${{ matrix.browser }}
