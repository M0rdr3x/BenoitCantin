name: SINJIRA V25 — Snapshot revue release enfant Junior

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/SINJIRA_V25_CHILD_JUNIOR_RELEASE_REVIEW_2026-09-18.md'
      - 'docs/SINJIRA_V25_PRODUCTION_MIGRATION_REVIEW_WORKSHEET_2026-09-23.md'
      - 'scripts/validate_v25_release_review_snapshot.py'
      - 'supabase/migrations/**'
      - 'supabase/production-reviewed-migration-batch.txt'
      - 'supabase/production-migration-ledger.txt'
      - '.github/workflows/sinjira-v25-release-review-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sinjira-v25-release-review-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-review-snapshot:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'a1/integration-rehearsal'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Récupérer le dépôt sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Compiler le garde du snapshot release
        run: python3 -m py_compile scripts/validate_v25_release_review_snapshot.py

      - name: Auto-tester le garde du snapshot release
        run: python3 scripts/validate_v25_release_review_snapshot.py --self-test

      - name: Vérifier le snapshot de revue V25
        run: python3 scripts/validate_v25_release_review_snapshot.py
