name: SINJIRA V25 — Frontière navigation mobile

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile-native/App.tsx'
      - 'mobile-native/package.json'
      - 'mobile-native/package-lock.json'
      - 'mobile-native/scripts/test-external-navigation-guard.mjs'
      - 'mobile-native/scripts/test-deep-link-normalizer.mjs'
      - 'mobile-native/scripts/test-notification-navigation-boundary.mjs'
      - 'scripts/validate_mobile_navigation_boundary_v25.py'
      - 'scripts/validate_mobile_navigation_boundary_workflow_security.py'
      - '.github/workflows/sinjira-mobile-navigation-boundary-v25.yml'
  push:
    branches: [main]
    paths:
      - 'mobile-native/App.tsx'
      - 'mobile-native/package.json'
      - 'mobile-native/package-lock.json'
      - 'mobile-native/scripts/test-external-navigation-guard.mjs'
      - 'mobile-native/scripts/test-deep-link-normalizer.mjs'
      - 'mobile-native/scripts/test-notification-navigation-boundary.mjs'
      - 'scripts/validate_mobile_navigation_boundary_v25.py'
      - 'scripts/validate_mobile_navigation_boundary_workflow_security.py'
      - '.github/workflows/sinjira-mobile-navigation-boundary-v25.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Auto-tester le contrat CI de navigation
        run: python3 scripts/validate_mobile_navigation_boundary_workflow_security.py --self-test

      - name: Vérifier le contrat CI de navigation
        run: python3 scripts/validate_mobile_navigation_boundary_workflow_security.py

      - name: Valider le contrat de navigation V25
        run: python3 scripts/validate_mobile_navigation_boundary_v25.py

      - name: Configurer Node.js sans cache implicite
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'

      - name: Installer les dépendances sans scripts de cycle de vie
        working-directory: mobile-native
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Tester la frontière externe adversariale
        working-directory: mobile-native
        run: npm run test:navigation-guard

      - name: Tester les deep links natifs
        working-directory: mobile-native
        run: npm run test:deep-link-normalizer

      - name: Tester les chemins des notifications
        working-directory: mobile-native
        run: npm run test:notification-navigation

      - name: Vérifier le contrat mobile sensible existant
        working-directory: mobile-native
        run: npm run validate:vault

      - name: Vérifier TypeScript
        working-directory: mobile-native
        run: npm run typecheck
