name: Reconstruction Supabase et tests SQL

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - '.github/workflows/recovery-drill.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - '.github/workflows/recovery-drill.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'

permissions:
  contents: read

concurrency:
  group: recovery-drill-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Démarrer une pile Supabase locale propre
        run: supabase start

      - name: Reconstruire la base depuis zéro
        run: supabase db reset

      - name: Exécuter les contrats pgTAP
        run: supabase test db

      - name: Arrêter et supprimer la pile locale
        if: always()
        run: supabase stop --no-backup
