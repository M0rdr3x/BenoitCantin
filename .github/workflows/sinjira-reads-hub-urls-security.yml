name: SINJIRA — liens sécurisés de Mes lectures et du hub

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/sinjira-reads-v24-4-61.js'
      - 'assets/js/sinjira-library-hub-v26.js'
      - 'assets/js/sinjira-supabase.js'
      - 'scripts/test_sinjira_reads_hub_urls_security.mjs'
      - '.github/workflows/sinjira-reads-hub-urls-security.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-reads-v24-4-61.js'
      - 'assets/js/sinjira-library-hub-v26.js'
      - 'assets/js/sinjira-supabase.js'
      - 'scripts/test_sinjira_reads_hub_urls_security.mjs'
      - '.github/workflows/sinjira-reads-hub-urls-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-reads-and-hub:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout du code sans jetons persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Node version fixée
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          check-latest: false
      - name: Test régressions contre liens et contenu hostiles
        run: node --test scripts/test_sinjira_reads_hub_urls_security.mjs
