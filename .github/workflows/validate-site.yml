name: Validation du site SINJIRA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Afficher le contexte exact de cette validation
        shell: bash
        run: |
          set -euo pipefail
          echo "Branche/ref : ${GITHUB_REF_NAME}"
          echo "SHA testé   : ${GITHUB_SHA}"
          echo "Événement   : ${GITHUB_EVENT_NAME}"
          {
            echo "### Contexte exact de cette validation"
            echo "- Événement : \`${GITHUB_EVENT_NAME}\`"
            echo "- Branche/ref : \`${GITHUB_REF_NAME}\`"
            echo "- SHA testé : \`${GITHUB_SHA}\`"
            echo
            echo "> **Important :** un ancien run GitHub reste attaché au SHA qu’il a testé. Le bouton **Re-run jobs** relance ce même SHA; il ne reteste pas automatiquement le \`main\` actuel."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configurer Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Vérifier le contrat CI des PR brouillon
        run: python scripts/validate_ci_draft_gate.py
      - name: Vérifier la compatibilité multi-navigateurs
        run: python scripts/validate_browser_compat.py
      - name: Vérifier l’accessibilité des parcours critiques
        run: python scripts/validate_accessibility.py
      - name: Vérifier l’assistant intelligent SINJIRA
        run: python scripts/validate_sinjira_assistant.py
      - name: Vérifier les budgets de performance
        run: python scripts/validate_performance_budget.py
      - name: Vérifier SEO, indexation et données structurées
        run: python scripts/validate_seo_quality.py
      - name: Vérifier résilience runtime et protections anti-abus
        run: python scripts/validate_runtime_resilience.py
      - name: Vérifier les routes, fichiers, secrets et JavaScript
        run: python scripts/validate_site.py
      - name: Vérifier le focus professionnel de l’accueil
        run: python scripts/validate_home_focus.py
      - name: Vérifier les flux d’authentification
        run: python scripts/validate_auth.py
      - name: Vérifier le MFA TOTP gratuit V24.4.66
        run: python scripts/validate_mfa_v24_4_66.py
      - name: Vérifier le MFA administrateur AAL2 V24.4.67
        run: python scripts/validate_admin_mfa_v24_4_67.py
      - name: Vérifier la gestion des sessions V24.4.68
        run: python scripts/validate_session_security_v24_4_68.py
      - name: Vérifier le contrôle des données V24.4.69
        run: python scripts/validate_data_control_v24_4_69.py
      - name: Vérifier les préférences self-only V24.4.70
        run: python scripts/validate_preferences_v24_4_70.py
      - name: Vérifier les messages non lus V24.4.71
        run: python scripts/validate_message_read_state_v24_4_71.py
      - name: Vérifier la gestion self-only du contenu social V24.4.72
        run: python scripts/validate_social_content_v24_4_72.py
      - name: Vérifier PWA, SEO et cache hors ligne
        run: python scripts/validate_pwa.py
      - name: Vérifier la structure Supabase
        run: python scripts/validate_supabase.py
      - name: Vérifier la bibliothèque canonique V24.4.61
        run: python scripts/validate_library_v24_4_61.py
      - name: Vérifier le mode gratuit verrouillé V24.4.62
        run: python scripts/validate_free_only_mode.py
      - name: Vérifier les notifications utilisateur V24.4.63
        run: python scripts/validate_user_notifications_v24_4_63.py
      - name: Vérifier les Playtests V24.4.64
        run: python scripts/validate_playtests_v24_4_64.py
      - name: Vérifier les invitations Playtests V24.4.65
        run: python scripts/validate_playtest_invitations_v24_4_65.py
      - name: Vérifier la sécurité publique des commentaires romans V24.4.55
        run: python scripts/validate_public_comment_security.py
      - name: Vérifier le rôle propriétaire/admin V24.4.56
        run: python scripts/validate_owner_role_invoker.py
      - name: Vérifier l’activation de licences V24.4.49
        run: python scripts/validate_license_activation.py
      - name: Vérifier les index licences V24.4.54
        run: python scripts/validate_license_fk_indexes.py
      - name: Vérifier la parité client/serveur de l’administration V24.4.50
        run: python scripts/validate_admin_action_contract.py
      - name: Vérifier les déclencheurs de notifications administrateur V24.4.52
        run: python scripts/validate_admin_notification_triggers.py
      - name: Vérifier l’identifiant de projet V24.4.53
        run: python scripts/validate_project_identifier_ui.py
      - name: Vérifier l’inventaire des Edge Functions
        run: python scripts/validate_edge_function_inventory.py
      - name: Vérifier le contrat de sécurité serveur
        run: python scripts/validate_security_contract.py
      - name: Vérifier le contrat social et les RLS
        run: python scripts/validate_social_rls_contract.py
      - name: Vérifier le contrat des liens familiaux
        run: python scripts/validate_family_link_contract.py
      - name: Vérifier la reconstruction du schéma production
        run: python scripts/validate_production_schema_manifest.py
      - name: Vérifier les avatars 512 × 512 et leurs politiques Storage
        run: python scripts/validate_storage_policies.py
      - name: Vérifier la console administrateur complète
        run: python scripts/validate_admin_console.py
      - name: Vérifier le moteur Fracture Online
        run: python scripts/validate_fracture_engine.py
      - name: Vérifier l’isolation des identités Fracture
        run: python scripts/validate_fracture_identity_isolation.py
      - name: Vérifier la cohérence de version Fracture
        run: python scripts/validate_fracture_version_consistency.py
      - name: Vérifier le compte propriétaire AbyssTime
        run: python scripts/validate_owner_account.py
      - name: Vérifier le titre officiel du Livre II pour AbyssTime V24.4.58
        run: python scripts/validate_owner_book2_title.py
      - name: Vérifier la séparation jeunesse / adulte — contrat canonique actuel
        run: python scripts/validate_youth_safety.py
      - name: Vérifier l’identité exacte des personnages sociaux
        run: python scripts/validate_character_identity_rls.py
      - name: Vérifier le Monde parallèle canonique
        run: python scripts/validate_parallel_world.py
