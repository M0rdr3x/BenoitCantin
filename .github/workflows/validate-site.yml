name: Validation du site SINJIRA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configurer Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Vérifier les routes, fichiers, secrets et JavaScript
        run: python scripts/validate_site.py
      - name: Vérifier les flux d’authentification
        run: python scripts/validate_auth.py
      - name: Vérifier PWA, SEO et cache hors ligne
        run: python scripts/validate_pwa.py
      - name: Vérifier la structure Supabase
        run: python scripts/validate_supabase.py
