name: Validation du site SINJIRA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-contract:
    name: Contrat sécurité validation site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Auto-tester le contrat de validation centrale
        run: python3 scripts/validate_site_workflow_security.py --self-test
      - name: Vérifier le contrat de validation centrale
        run: python3 scripts/validate_site_workflow_security.py

      - name: Auto-tester la portée web-only
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'a1/web-release-')
        run: python3 scripts/validate_web_release_scope.py --self-test
      - name: Vérifier la portée web-only
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'a1/web-release-')
        run: python3 scripts/validate_web_release_scope.py

      - name: Vérifier le périmètre public Netlify
        run: python3 scripts/build_netlify_public.py --check
      - name: Auto-tester la transition Formspree personnelle
        run: python3 scripts/configure_personal_formspree.py --self-test
      - name: Auto-tester la frontière Environments production
        run: python3 scripts/validate_production_environment_boundary.py --self-test
      - name: Vérifier la frontière Environments production
        run: python3 scripts/validate_production_environment_boundary.py
      - name: Auto-tester le smoke HTTP de release
        run: python3 scripts/validate_web_release_http.py --self-test
      - name: Résumer la readiness web-only
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'a1/web-release-')
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_count="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" | wc -l | tr -d ' ')"
          {
            echo "### Readiness web-only"
            echo "- SHA candidat : \`$HEAD_SHA\`"
            echo "- Base PR : \`$BASE_SHA\`"
            echo "- Fichiers modifiés : **$changed_count**"
            echo "- Artefact public : \`_site\` allowlisté + package Netlify autonome \`_headers\`/\`_redirects\`"
            echo "- Artefact CI : \`Web release — artefact public isolé\` (aucun déploiement)"
            echo "- Deploy preview Netlify : noindex/noarchive par construction"
            echo "- BubblaV : **fail-closed** (widget désactivé + CSP bloquante)"
            echo "- Smoke deploy unitaire : \`Netlify deploy — smoke HTTP\` (permalink atomique, preview / production-candidate)"
            echo "- Gate pré-DNS combiné : \`Netlify pré-DNS — gate combiné\` (même site Netlify + même SHA)"
            echo "- Smoke production : \`Web production — smoke HTTP\` (SHA + signature Netlify + apex canonique)"
            echo "- Portes externes restantes : bascule hébergeur sûre (#450), #135, #443, #444"
            echo
            echo "> Ce résumé prouve l'état du candidat Git/CI, pas un déploiement production."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Observer l’hébergement public sans modifier la production
        if: startsWith(github.head_ref, 'a1/web-release-') && github.event_name == 'pull_request'
        shell: bash
        continue-on-error: true
        run: |
          set -u
          origin="https://www.benoitcantin.com"
          apex_origin="https://benoitcantin.com"
          headers="$(mktemp)"
          body="$(mktemp)"
          apex_headers="$(mktemp)"
          http_code="$(curl -sS --connect-timeout 5 --max-time 15 -D "$headers" -o "$body" -w '%{http_code}' "$origin/" || true)"
          server="$(awk 'BEGIN{IGNORECASE=1} /^server:/ {sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$headers")"
          nf_request="$(awk 'BEGIN{IGNORECASE=1} /^x-nf-request-id:/ {found=1} END{print found ? "présent" : "absent"}' "$headers")"
          if grep -qiE '^server:[[:space:]]*Netlify|^x-nf-request-id:' "$headers"; then
            netlify_signature="observée"
          else
            netlify_signature="non observée"
          fi
          apex_http_code="$(curl -sS --connect-timeout 5 --max-time 15 -D "$apex_headers" -o /dev/null -w '%{http_code}' "$apex_origin/" || true)"
          apex_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$apex_headers")"
          apex_server="$(awk 'BEGIN{IGNORECASE=1} /^server:/ {sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$apex_headers")"
          apex_nf_request="$(awk 'BEGIN{IGNORECASE=1} /^x-nf-request-id:/ {found=1} END{print found ? "présent" : "absent"}' "$apex_headers")"
          {
            echo "### Observation hébergement public — lecture seule"
            echo "- Origine : \`$origin\`"
            echo "- HTTP accueil : \`${http_code:-000}\`"
            echo "- En-tête Server : \`${server:-non exposé}\`"
            echo "- x-nf-request-id : **$nf_request**"
            echo "- Signature Netlify HTTP : **$netlify_signature**"
            echo "- Apex : \`$apex_origin/\`"
            echo "- Apex HTTP initial : \`${apex_http_code:-000}\`"
            echo "- Apex Location : \`${apex_location:-absente}\`"
            echo "- Apex Server : \`${apex_server:-non exposé}\`"
            echo "- Apex x-nf-request-id : **$apex_nf_request**"
            echo
            echo "| Chemin technique | HTTP observé |"
            echo "|---|---:|"
            for p in \
              /supabase/config.toml \
              /scripts/build_netlify_public.py \
              /docs/README.md \
              /.github/workflows/validate-site.yml \
              /tests/e2e/test_public_site.py \
              /mobile-native/App.tsx
            do
              status="$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$origin$p" || true)"
              echo "| \`$p\` | \`${status:-000}\` |"
            done
            echo
            echo "> Observation uniquement : aucun déploiement, aucune écriture hébergeur et aucun secret utilisé."
          } | tee -a "$GITHUB_STEP_SUMMARY"

          smoke_output="$(mktemp)"
          smoke_status=0
          set +e
          timeout 90s python3 scripts/validate_web_release_http.py "$origin" --context production | tee "$smoke_output"
          smoke_status=${PIPESTATUS[0]}
          set -e
          if [ "$smoke_status" -eq 0 ]; then
            smoke_verdict="PASS"
          elif [ "$smoke_status" -eq 124 ]; then
            smoke_verdict="TIMEOUT"
          else
            smoke_verdict="FAIL attendu tant que #450 est ouvert"
          fi
          {
            echo
            echo "### Baseline smoke production — lecture seule"
            echo "- Cible : $origin"
            echo "- Verdict : **$smoke_verdict**"
            echo "- Code smoke : $smoke_status"
            echo
            echo "> Ce baseline est informatif et non bloquant. Il doit devenir PASS après la bascule #450."
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Auto-tester le contrat Transparence IA
        run: python3 scripts/validate_ai_transparency.py --self-test
      - name: Vérifier le contrat Transparence IA
        run: python3 scripts/validate_ai_transparency.py
      - name: Auto-tester la frontière assistant IA public
        run: python3 scripts/validate_public_ai_assistant.py --self-test
      - name: Vérifier la frontière assistant IA public
        run: python3 scripts/validate_public_ai_assistant.py

  validate:
    needs: workflow-contract
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || startsWith(github.head_ref, 'a1/web-release-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Afficher le contexte exact de cette validation
        shell: bash
        run: |
          set -euo pipefail
          echo "Branche/ref : ${GITHUB_REF_NAME}"
          echo "SHA testé   : ${GITHUB_SHA}"
          echo "Événement   : ${GITHUB_EVENT_NAME}"
          {
            echo "### Contexte exact de cette validation"
            echo "- Événement : \`${GITHUB_EVENT_NAME}\`"
            echo "- Branche/ref : \`${GITHUB_REF_NAME}\`"
            echo "- SHA testé : \`${GITHUB_SHA}\`"
            echo
            echo "> **Important :** un ancien run GitHub reste attaché au SHA qu’il a testé. Le bouton **Re-run jobs** relance ce même SHA; il ne reteste pas automatiquement le \`main\` actuel."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Configurer Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Vérifier le contrat CI des PR brouillon
        run: python scripts/validate_ci_draft_gate.py
      - name: Vérifier la compatibilité multi-navigateurs
        run: python scripts/validate_browser_compat.py
      - name: Vérifier l’accessibilité des parcours critiques
        run: python scripts/validate_accessibility.py
      - name: Vérifier l’assistant intelligent SINJIRA
        run: python scripts/validate_sinjira_assistant.py
      - name: Vérifier les budgets de performance
        run: python scripts/validate_performance_budget.py
      - name: Vérifier SEO, indexation et données structurées
        run: python scripts/validate_seo_quality.py
      - name: Vérifier résilience runtime et protections anti-abus
        run: python scripts/validate_runtime_resilience.py
      - name: Vérifier les routes, fichiers, secrets et JavaScript
        run: python scripts/validate_site.py
      - name: Vérifier le focus professionnel de l’accueil
        run: python scripts/validate_home_focus.py
      - name: Vérifier les flux d’authentification
        run: python scripts/validate_auth.py
      - name: Vérifier le MFA TOTP gratuit V24.4.66
        run: python scripts/validate_mfa_v24_4_66.py
      - name: Vérifier le MFA administrateur AAL2 V24.4.67
        run: python scripts/validate_admin_mfa_v24_4_67.py
      - name: Vérifier la gestion des sessions V24.4.68
        run: python scripts/validate_session_security_v24_4_68.py
      - name: Vérifier le contrôle des données V24.4.69
        run: python scripts/validate_data_control_v24_4_69.py
      - name: Vérifier les préférences self-only V24.4.70
        run: python scripts/validate_preferences_v24_4_70.py
      - name: Vérifier les messages non lus V24.4.71
        run: python scripts/validate_message_read_state_v24_4_71.py
      - name: Vérifier la gestion self-only du contenu social V24.4.72
        run: python scripts/validate_social_content_v24_4_72.py
      - name: Vérifier les avis de réponses sociales V24.4.73
        run: python scripts/validate_social_reply_notifications_v24_4_73.py
      - name: Vérifier les Rencontres par compatibilité V24.4.74
        run: python scripts/validate_dating_v24_4_74.py
      - name: Vérifier PWA, SEO et cache hors ligne
        run: python scripts/validate_pwa.py
      - name: Vérifier la structure Supabase
        run: python scripts/validate_supabase.py
      - name: Vérifier la bibliothèque canonique V24.4.61
        run: python scripts/validate_library_v24_4_61.py
      - name: Vérifier le mode gratuit verrouillé V24.4.62
        run: python scripts/validate_free_only_mode.py
      - name: Vérifier les notifications utilisateur V24.4.63
        run: python scripts/validate_user_notifications_v24_4_63.py
      - name: Vérifier les Playtests V24.4.64
        run: python scripts/validate_playtests_v24_4_64.py
      - name: Vérifier les invitations Playtests V24.4.65
        run: python scripts/validate_playtest_invitations_v24_4_65.py
      - name: Vérifier la sécurité publique des commentaires romans V24.4.55
        run: python scripts/validate_public_comment_security.py
      - name: Vérifier le rôle propriétaire/admin V24.4.56
        run: python scripts/validate_owner_role_invoker.py
      - name: Vérifier l’activation de licences V24.4.49
        run: python scripts/validate_license_activation.py
      - name: Vérifier les index licences V24.4.54
        run: python scripts/validate_license_fk_indexes.py
      - name: Vérifier la parité client/serveur de l’administration V24.4.50
        run: python scripts/validate_admin_action_contract.py
      - name: Vérifier les déclencheurs de notifications administrateur V24.4.52
        run: python scripts/validate_admin_notification_triggers.py
      - name: Vérifier l’identifiant de projet V24.4.53
        run: python scripts/validate_project_identifier_ui.py
      - name: Vérifier l’inventaire des Edge Functions
        run: python scripts/validate_edge_function_inventory.py
      - name: Vérifier le contrat de sécurité serveur
        run: python scripts/validate_security_contract.py
      - name: Vérifier le contrat social et les RLS
        run: python scripts/validate_social_rls_contract.py
      - name: Vérifier le contrat des liens familiaux
        run: python scripts/validate_family_link_contract.py
      - name: Vérifier la reconstruction du schéma production
        run: python scripts/validate_production_schema_manifest.py
      - name: Vérifier les avatars 512 × 512 et leurs politiques Storage
        run: python scripts/validate_storage_policies.py
      - name: Vérifier la console administrateur complète
        run: python scripts/validate_admin_console.py
      - name: Auto-tester la confidentialité et les purges admin V18
        run: python scripts/validate_admin_v18_privacy_security.py --self-test
      - name: Vérifier la confidentialité et les purges admin V18
        run: python scripts/validate_admin_v18_privacy_security.py
      - name: Auto-tester la cohérence et les logs admin-console
        run: python scripts/validate_admin_console_security.py --self-test
      - name: Vérifier la cohérence et les logs admin-console
        run: python scripts/validate_admin_console_security.py
      - name: Auto-tester les lectures admin privées
        run: python scripts/validate_admin_private_reads_security.py --self-test
      - name: Vérifier les lectures admin privées
        run: python scripts/validate_admin_private_reads_security.py
      - name: Vérifier le moteur Fracture Online
        run: python scripts/validate_fracture_engine.py
      - name: Vérifier l’isolation des identités Fracture
        run: python scripts/validate_fracture_identity_isolation.py
      - name: Vérifier la cohérence de version Fracture
        run: python scripts/validate_fracture_version_consistency.py
      - name: Vérifier le compte propriétaire AbyssTime
        run: python scripts/validate_owner_account.py
      - name: Vérifier le titre officiel du Livre II pour AbyssTime V24.4.58
        run: python scripts/validate_owner_book2_title.py
      - name: Vérifier la séparation jeunesse / adulte — contrat canonique actuel
        run: python scripts/validate_youth_safety.py
      - name: Vérifier l’identité exacte des personnages sociaux
        run: python scripts/validate_character_identity_rls.py
      - name: Vérifier le Monde parallèle canonique
        run: python scripts/validate_parallel_world.py
