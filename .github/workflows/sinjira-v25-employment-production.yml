name: SINJIRA V25 — Vérification production Emploi

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Saisir exactement VERIFY-SINJIRA-V25-EMPLOYMENT"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sinjira-v25-employment-production-verify
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: gpvivleexywljowcqkru
  EXPECTED_REMOTE_BASELINE: "20260905131659"
  EXPECTED_REMOTE_BASELINE_NAME: sinjira_v25_conscience_vault_audit_session_index
  EXPECTED_EMPLOYMENT_VERSION: "20260905133130"
  EXPECTED_EMPLOYMENT_NAME: sinjira_v25_employment_foundation
  SUPABASE_MANAGEMENT_API: https://api.supabase.com/v1

jobs:
  verify-employment-v25:
    name: Vérifier Emploi V25 en production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Vérifier la confirmation et le jeton
        shell: bash
        env:
          VERIFY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$VERIFY_CONFIRMATION" = "VERIFY-SINJIRA-V25-EMPLOYMENT" || {
            echo "Confirmation invalide; aucune vérification production Emploi n'est exécutée." >&2
            exit 1
          }
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "Secret SUPABASE_ACCESS_TOKEN manquant." >&2
            exit 1
          }

      - name: Checkout de main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Vérifier les contrats Emploi
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_employment_v25.py
          python3 scripts/validate_employment_production_deploy_workflow.py
          python3 scripts/validate_production_schema_manifest.py

      - name: Vérifier l'historique Emploi en lecture seule
        shell: bash
        run: |
          set -euo pipefail
          history="$RUNNER_TEMP/employment-production-migrations.json"
          curl --fail-with-body --silent --show-error \
            "$SUPABASE_MANAGEMENT_API/projects/$SUPABASE_PROJECT_REF/database/migrations" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Accept: application/json' \
            --output "$history"

          MIGRATION_HISTORY="$history" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ['MIGRATION_HISTORY']).read_text(encoding='utf-8'))
          if isinstance(payload, list):
              rows = payload
          elif isinstance(payload, dict):
              rows = next((payload[k] for k in ('migrations', 'data', 'result') if isinstance(payload.get(k), list)), None)
          else:
              rows = None
          if not rows:
              raise SystemExit('Historique de migration distant illisible ou vide.')

          rows = sorted(rows, key=lambda row: str(row.get('version', '')))
          baseline = (
              os.environ['EXPECTED_REMOTE_BASELINE'],
              os.environ['EXPECTED_REMOTE_BASELINE_NAME'],
          )
          employment = (
              os.environ['EXPECTED_EMPLOYMENT_VERSION'],
              os.environ['EXPECTED_EMPLOYMENT_NAME'],
          )

          baseline_indexes = [
              i for i, row in enumerate(rows)
              if (str(row.get('version', '')), str(row.get('name', ''))) == baseline
          ]
          if len(baseline_indexes) != 1:
              raise SystemExit('Baseline post-coffre introuvable de façon unique.')

          index = baseline_indexes[0]
          if index + 1 >= len(rows):
              raise SystemExit('Migration Emploi absente après la baseline.')

          observed = (
              str(rows[index + 1].get('version', '')),
              str(rows[index + 1].get('name', '')),
          )
          if observed != employment:
              raise SystemExit(
                  'Migration suivant la baseline inattendue: '
                  f'observé={observed}; attendu={employment}'
              )

          matches = [
              row for row in rows
              if str(row.get('name', '')) == os.environ['EXPECTED_EMPLOYMENT_NAME']
          ]
          if len(matches) != 1:
              raise SystemExit('La migration Emploi doit être présente une seule fois dans l’historique.')

          print(
              f"Emploi production confirmé: {employment[0]}_{employment[1]} "
              'suit immédiatement la baseline du coffre.'
          )
          PY

      - name: Résumé lecture seule
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF'
          Vérification Emploi V25 terminée en lecture seule.
          Aucune migration, aucune Edge Function et aucun secret n'ont été modifiés par ce workflow.
          Emploi reste séparé du Registre personnel, de Rencontres, de Histoire de vie, du Mode Voyage, de la sécurité et de Mon IA.
          EOF
