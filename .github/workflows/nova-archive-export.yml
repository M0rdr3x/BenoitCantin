name: Archive complète — Projet Nova
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/build_nova_archive.py'
      - 'docs/archives/PROJET_NOVA_CONTEXTE_2026-11-20.md'
      - '.github/workflows/nova-archive-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construire-archive-nova:
    name: Créer le ZIP Projet Nova et son inventaire
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout sans credentials persistés et avec historique
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Valider l'accueil SINJIRA unique, le shell et le SEO
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_home_focus.py
          python3 scripts/validate_public_root_shell.py
          python3 scripts/validate_seo_quality.py
          python3 scripts/validate_site.py
      - name: Prévenir un export incomplet
        run: python3 scripts/build_nova_archive.py --self-test
      - name: Assembler le ZIP sans accès réseau
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_nova_archive.py --output "${RUNNER_TEMP}/PROJET_NOVA_ARCHIVE_COMPLETE_2026-11-20.zip"
          python3 - "${RUNNER_TEMP}/PROJET_NOVA_ARCHIVE_COMPLETE_2026-11-20.zip" <<'PY'
          import sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None, "ZIP corrompu"
              entries = archive.namelist()
              assert "MANIFESTE_SHA256.json" in entries
              assert any(x.startswith("SOURCE_GITHUB/projets/projet-nova/") for x in entries)
              print(f"ZIP complet vérifié, {len(entries)} entrées")
          PY
      - name: Joindre le pack d'archive à la PR GitHub
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PROJET_NOVA_ARCHIVE_COMPLETE_2026-11-20
          path: ${{ runner.temp }}/PROJET_NOVA_ARCHIVE_COMPLETE_2026-11-20.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
