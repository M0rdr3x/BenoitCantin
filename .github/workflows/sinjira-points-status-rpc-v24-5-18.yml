name: SINJIRA V24.5.18 — Frontière RPC statut Points

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/production-migration-ledger.txt'
      - 'scripts/validate_points_status_rpc_v24_5_18.py'
      - 'scripts/validate_family_playtest_rpc_v24_5_17.py'
      - 'scripts/validate_production_migration_ledger.py'
      - 'POINTS_STATUS_RPC_BOUNDARY_V24_5_18.md'
      - '.github/workflows/sinjira-points-status-rpc-v24-5-18.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Contrat frontière statut Points V24.5.18
        run: python scripts/validate_points_status_rpc_v24_5_18.py
      - name: Contrat famille/playtest historique V24.5.17
        run: python scripts/validate_family_playtest_rpc_v24_5_17.py
      - name: Validation statique du site
        run: python scripts/validate_site.py
      - name: Contrat Supabase
        run: python scripts/validate_supabase.py
      - name: Ledger production
        run: python scripts/validate_production_migration_ledger.py
      - name: Manifeste du schéma production
        run: python scripts/validate_production_schema_manifest.py
      - name: Mode gratuit et services externes
        run: python scripts/validate_free_only_mode.py
