name: Sécurité — contrat déploiement security-context

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-rpc-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-context-rpc-gate:
    name: Bloquer le déploiement Edge sans RPC session sécurisée
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans conservation du jeton
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Installer Python épinglé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Vérifier tests de refus et sécurité du pipeline
        run: python3 scripts/test_security_context_deployment_gate.py
      - name: Vérifier la source RPC et l'étape de production
        run: python3 scripts/validate_security_context_deployment_gate.py --check-contract
