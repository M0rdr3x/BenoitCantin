name: SINJIRA — portée explicite des révocations de contributions

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/revoke-my-contributions/index.ts'
      - 'scripts/test_revocation_explicit_scope_security.mjs'
      - 'scripts/validate_revocation_explicit_scope_security.py'
      - '.github/workflows/sinjira-revocation-explicit-scope-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/revoke-my-contributions/index.ts'
      - 'scripts/test_revocation_explicit_scope_security.mjs'
      - 'scripts/validate_revocation_explicit_scope_security.py'
      - '.github/workflows/sinjira-revocation-explicit-scope-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explicit-revocation-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Installer Node.js version épinglée
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.2'

      - name: Tester le vrai handler contre suppressions globales ambiguës
        run: |
          node --check scripts/test_revocation_explicit_scope_security.mjs
          node --test scripts/test_revocation_explicit_scope_security.mjs

      - name: Vérifier les mutations de garde contre les suppressions imprévues
        run: |
          python3 scripts/validate_revocation_explicit_scope_security.py --self-test
          python3 scripts/validate_revocation_explicit_scope_security.py

      - name: Préserver les contrôles historiques Edge et RGPD
        run: |
          python3 scripts/validate_contribution_revocation_v24_5_52.py
          python3 scripts/validate_delete_account_v24_5_51.py
          python3 scripts/validate_edge_function_inventory.py
