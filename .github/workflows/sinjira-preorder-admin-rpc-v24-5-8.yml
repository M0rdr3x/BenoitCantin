name: SINJIRA V24.5.8 — Frontière RPC admin précommandes

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/production-migration-ledger.txt'
      - 'scripts/validate_preorder_admin_rpc_v24_5_8.py'
      - 'scripts/validate_production_migration_ledger.py'
      - 'PRECOMMANDES_ADMIN_RPC_V24_5_8.md'
      - 'assets/js/sinjira-admin-preorders-v24-5-4.js'
      - 'assets/js/sinjira-admin-preorder-fulfillment-v24-5-6.js'
      - '.github/workflows/sinjira-preorder-admin-rpc-v24-5-8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Contrat frontière admin V24.5.8
        run: python scripts/validate_preorder_admin_rpc_v24_5_8.py
      - name: Validation statique du site
        run: python scripts/validate_site.py
      - name: Contrat Supabase
        run: python scripts/validate_supabase.py
      - name: Ledger production
        run: python scripts/validate_production_migration_ledger.py
      - name: Manifeste du schéma production
        run: python scripts/validate_production_schema_manifest.py
      - name: Mode gratuit et services externes
        run: python scripts/validate_free_only_mode.py
