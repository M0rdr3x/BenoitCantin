name: SINJIRA V24.5.16 — Frontière RPC Monde parallèle utilisateur

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/production-migration-ledger.txt'
      - 'scripts/validate_parallel_user_rpc_v24_5_16.py'
      - 'scripts/validate_social_user_rpc_v24_5_15.py'
      - 'scripts/validate_parallel_world_admin_v24_4_92.py'
      - 'scripts/validate_production_migration_ledger.py'
      - 'PARALLEL_USER_RPC_BOUNDARY_V24_5_16.md'
      - '.github/workflows/sinjira-parallel-user-rpc-v24-5-16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Contrat frontière Monde parallèle V24.5.16
        run: python scripts/validate_parallel_user_rpc_v24_5_16.py
      - name: Contrat social historique V24.5.15
        run: python scripts/validate_social_user_rpc_v24_5_15.py
      - name: Contrat admin Monde parallèle V24.4.92
        run: python scripts/validate_parallel_world_admin_v24_4_92.py
      - name: Validation statique du site
        run: python scripts/validate_site.py
      - name: Contrat Supabase
        run: python scripts/validate_supabase.py
      - name: Ledger production
        run: python scripts/validate_production_migration_ledger.py
      - name: Manifeste du schéma production
        run: python scripts/validate_production_schema_manifest.py
      - name: Mode gratuit et services externes
        run: python scripts/validate_free_only_mode.py
