name: Sécurité — provenance des dépendances Edge

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/validate_edge_import_supply_chain.py'
      - '.github/workflows/edge-import-supply-chain.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/validate_edge_import_supply_chain.py'
      - '.github/workflows/edge-import-supply-chain.yml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-import-review:
    name: Refuser les imports distants non approuvés
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans jeton persistant
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python figé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Tester les mutations de sécurité
        run: python scripts/validate_edge_import_supply_chain.py --self-test
      - name: Contrôler toutes les sources Edge
        run: python scripts/validate_edge_import_supply_chain.py
