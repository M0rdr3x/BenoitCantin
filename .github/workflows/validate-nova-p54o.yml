name: Projet Nova P54O - Controle du paquet de passation et des blocages
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p54o.yml"
      - "scripts/controler_qualite_passation_nova_p54o.py"
      - "scripts/tests/test_controler_qualite_passation_nova_p54o.py"
      - "scripts/preparer_passation_humaine_nova_p54n.py"
      - "projets/projet-nova/etudes/P54O_*"
      - "projets/projet-nova/etudes/P54N_PASSATION_HUMAINE_DOSSIERS_2024.json"
      - "projets/projet-nova/etudes/P54D_OBSERVATIONS_REELLES_2026_10_24.json"
      - "projets/projet-nova/etudes/P54E_PLAN_REVUE_HUMAINE_2024.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controle-pas-de-remise-automatique:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout lecture seule sans credentials persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Dependances documentaires epinglees
        run: python -m pip install pypdf==5.9.0
      - name: 79 tests P54O sur donnees non sensibles
        run: |
          python -m py_compile scripts/controler_qualite_passation_nova_p54o.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
            "scripts/tests",pattern="test_controler_qualite_passation_nova_p54o.py")
          assert suite.countTestCases()==79,suite.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
      - name: Regenerer le paquet canonique P54N
        run: |
          python scripts/preparer_passation_humaine_nova_p54n.py \
            --dossier p54n_canonique.json \
            --instructions p54n_canonique.md \
            --bilan p54n_bilan_neutre.json
      - name: Confirmer les cinq occurrences et dix blocages
        run: |
          python scripts/controler_qualite_passation_nova_p54o.py \
            --paquet-p54n p54n_canonique.json \
            --instructions-p54n p54n_canonique.md \
            --plan p54o_plan_controle.json \
            --rapport p54o_rapport_bloque.md \
            --bilan p54o_bilan_neutre.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("p54o_plan_controle.json").read_text("utf-8"))
          b=json.loads(Path("p54o_bilan_neutre.json").read_text("utf-8"))
          assert len(p["observations"])==5
          assert [x["observation_index"] for x in p["observations"]]==[0,1,3,4,2]
          assert sum(x["classification"]=="INDETERMINE" for x in p["observations"])==4
          assert sum(x["classification"]=="ANNEE_DATE_PROBABLE" for x in p["observations"])==1
          assert len(p["points_bloquants"])==10
          assert all(x["etat"]=="NON_LEVE" for x in p["points_bloquants"])
          assert all(x["statut"]=="NON_INSTRUIT" for x in p["observations"])
          assert p["remise_externe_autorisee"] is False
          assert p["decision"]=="NO_GO_AUTOMATIQUE"
          assert b["taches_p54n_a_instruire"]==40
          assert b["conditions_humaines_non_levees"]==10
          assert b["controles_p54b_non_attestes"]==96
          assert b["controles_p54c_non_attestes"]==8
          assert b["autorisations_de_transmission_obtenues"]==0
          assert b["avis_originaux_independants_authentifies"]==0
          assert b["economies_certifiees_cad"] is None
          assert b["pret_a_transmettre"] is False
          assert b["decision"]=="NO_GO_AUTOMATIQUE"
          PY
      - name: Refuser modification du paquet et fausse task accomplie
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("p54n_canonique.json")
          doc=json.loads(p.read_text("utf-8"))
          doc["dossiers"][0]["instructions"][0]["etat"]="FAUSSEMENT_ACCOMPLI"
          Path("p54n_falsifie.json").write_text(
            json.dumps(doc,ensure_ascii=False),encoding="utf-8")
          PY
          set +e
          python scripts/controler_qualite_passation_nova_p54o.py \
            --paquet-p54n p54n_falsifie.json
          code=$?
          set -e
          test "$code" -eq 2
          rm p54n_falsifie.json
      - name: Refuser une transmission fictive
        run: |
          set +e
          python scripts/controler_qualite_passation_nova_p54o.py \
            --exiger-transmission
          code=$?
          set -e
          test "$code" -eq 3
      - name: Archive sans originaux ni jetons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-p54o-cinq-occurrences-et-dix-blocages-non-leves
          path: |
            p54o_plan_controle.json
            p54o_rapport_bloque.md
            p54o_bilan_neutre.json
          if-no-files-found: ignore
          retention-days: 7
