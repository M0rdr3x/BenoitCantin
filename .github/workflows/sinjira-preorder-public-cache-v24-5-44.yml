name: SINJIRA V24.5.44 — Convergence cache public précommandes

on:
  pull_request:
    paths:
      - 'compte/mes-achats.html'
      - 'projets/sinjira/romans/precommande.html'
      - 'PREORDER_PUBLIC_CACHE_CONVERGENCE_V24_5_44.md'
      - 'scripts/validate_preorder_public_cache_v24_5_44.py'
      - 'supabase/production-migration-ledger.txt'
      - '.github/workflows/sinjira-preorder-public-cache-v24-5-44.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Valider V24.5.44
        run: python3 scripts/validate_preorder_public_cache_v24_5_44.py
      - name: Valider le ledger production inchangé
        run: python3 scripts/validate_production_migration_ledger.py
