name: Projet Nova P50M - contrôle documentaire sans GO
on:
  pull_request:
    paths:
      - "projets/projet-nova/controles/P50M_*"
      - "scripts/validate_nova_decision_p50m.py"
      - "scripts/tests/test_validate_nova_decision_p50m.py"
      - ".github/workflows/validate-nova-p50m.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle-dossier-p50m:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compiler le contrôle de décision
        run: python -m py_compile scripts/validate_nova_decision_p50m.py
      - name: Tests à données fictives, sans authentifier de mandat
        run: python -m unittest discover -s scripts/tests -p "test_validate_nova_decision_p50m.py" -v
      - name: Contrôle du modèle public sans accès réseau
        run: |
          python scripts/validate_nova_decision_p50m.py --rapport p50m_resultat_local.json
          python -c "import json; r=json.load(open('p50m_resultat_local.json', encoding='utf-8')); assert r['decision']=='NO_GO_AUTOMATIQUE'; assert r['verification_live_github_effectuee'] is False; print('NO_GO_AUTOMATIQUE'); print(r['structure'])"
