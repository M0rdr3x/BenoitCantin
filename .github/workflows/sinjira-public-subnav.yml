name: UX SINJIRA — rubriques publiques PC et mobile

on:
  pull_request:
    branches: [main]
    paths:
      - 'projets/sinjira/index.html'
      - 'projets/sinjira/romans/index.html'
      - 'projets/sinjira/jeux/index.html'
      - 'assets/css/sinjira-universe-nav-v2.css'
      - 'assets/js/sinjira-universe-nav-v2.js'
      - 'tests/e2e/test_sinjira_universe_subnav.py'
      - '.github/workflows/sinjira-public-subnav.yml'
  push:
    branches: [main]
    paths:
      - 'projets/sinjira/index.html'
      - 'projets/sinjira/romans/index.html'
      - 'projets/sinjira/jeux/index.html'
      - 'assets/css/sinjira-universe-nav-v2.css'
      - 'assets/js/sinjira-universe-nav-v2.js'
      - 'tests/e2e/test_sinjira_universe_subnav.py'
      - '.github/workflows/sinjira-public-subnav.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rubriques:
    name: Navigation ${{ matrix.browser }} (240–1440px)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble@sha256:a9731514f24121d1dcd25d58d0a38146646d290a5998fd80d3e533e7b5e21c69
      options: --user 1001
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Télécharger la branche sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Installer Playwright version fixe
        run: python -m pip install --disable-pip-version-check "playwright==1.61.0"
      - name: Vérifier les scripts
        run: |
          python -m py_compile tests/e2e/test_sinjira_universe_subnav.py
      - name: Démarrer le site local
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/sinjira-public-subnav.log 2>&1 &
          echo $! > /tmp/sinjira-public-subnav.pid
          i=0
          while [ "$i" -lt 20 ]; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/', timeout=1).read(1)" >/dev/null 2>&1; then exit 0; fi
            i=$((i + 1))
            sleep 1
          done
          cat /tmp/sinjira-public-subnav.log
          exit 1
      - name: Tester les rubriques et le mode sans JavaScript
        env:
          BASE_URL: http://127.0.0.1:4173/
          BROWSER: ${{ matrix.browser }}
        run: python tests/e2e/test_sinjira_universe_subnav.py
      - name: Arrêter le serveur local
        if: always()
        run: |
          if [ -f /tmp/sinjira-public-subnav.pid ]; then kill "$(cat /tmp/sinjira-public-subnav.pid)" || true; fi
