name: Transparence IA — couverture publique

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.html'
      - 'assets/js/site.js'
      - 'assets/js/ai-transparency.js'
      - 'assets/css/ai-transparency.css'
      - 'projets/projet-nova/script.js'
      - 'AI_TRANSPARENCY.md'
      - 'README.md'
      - 'sitemap.xml'
      - 'scripts/validate_ai_transparency.py'
      - '.github/workflows/validate-ai-transparency.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-transparency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-transparency-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Récupérer le dépôt sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Vérifier le contrat de transparence IA
        run: |
          python3 -m py_compile scripts/validate_ai_transparency.py
          python3 scripts/validate_ai_transparency.py --self-test
          python3 scripts/validate_ai_transparency.py
