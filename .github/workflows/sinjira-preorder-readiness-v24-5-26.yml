name: SINJIRA V24.5.26 — Garde préparation commerciale

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260823171121_sinjira_v24_5_26_preorder_sale_readiness_guard.sql'
      - 'supabase/tests/preorder_sale_readiness_v24_5_26.test.sql'
      - 'supabase/production-migration-ledger.txt'
      - 'assets/js/sinjira-preorder-cost-summary-v24-5-25.js'
      - 'assets/js/sinjira-admin-preorder-commercial-v24-5-5.js'
      - 'assets/js/sinjira-admin-preorder-readiness-v24-5-26.js'
      - 'PREORDER_SALE_READINESS_V24_5_26.md'
      - 'scripts/validate_preorder_sale_readiness_v24_5_26.py'
      - '.github/workflows/sinjira-preorder-readiness-v24-5-26.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260823171121_sinjira_v24_5_26_preorder_sale_readiness_guard.sql'
      - 'supabase/tests/preorder_sale_readiness_v24_5_26.test.sql'
      - 'assets/js/sinjira-preorder-cost-summary-v24-5-25.js'
      - 'assets/js/sinjira-admin-preorder-readiness-v24-5-26.js'
      - 'PREORDER_SALE_READINESS_V24_5_26.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Valider V24.5.26
        run: python scripts/validate_preorder_sale_readiness_v24_5_26.py
