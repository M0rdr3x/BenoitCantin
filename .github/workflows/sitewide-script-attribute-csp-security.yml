name: Sécurité web — interdiction globale des attributs JavaScript inline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitewide-inline-attr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inline-event-boundary:
    name: Contrôle CSP globale et toutes pages HTML
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.12 épinglé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Interdire tout événement HTML inline et tester les refus
        run: python3 scripts/test_global_csp_script_attributes.py
