name: SINJIRA — tests Formspree synthétiques sous approbation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe_sinjira_formspree_synthetic.py'
      - '.github/workflows/sinjira-formspree-synthetic-smoke.yml'
      - 'docs/SINJIRA_FORMSPREE_SYNTHETIC_SMOKE_20261108.md'
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Écrire exactement AUTORISER_DEUX_TESTS_FORMSPREE"
        required: true
        type: string

permissions:
  contents: read

jobs:
  offline-check:
    name: Contrat synthétique sans HTTP ni donnée réelle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans credentials persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python épinglé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Exécuter les tests non destructifs
        run: |
          python3 -m py_compile scripts/probe_sinjira_formspree_synthetic.py
          python3 scripts/probe_sinjira_formspree_synthetic.py --self-test

  production-probe:
    name: Deux POST synthétiques sous approbation
    needs: offline-check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout sans credentials persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Python épinglé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Vérifier confirmation exacte et lancer les deux tests synthétiques
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: python3 scripts/probe_sinjira_formspree_synthetic.py --live
