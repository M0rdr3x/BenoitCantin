name: SINJIRA — garde Edge Functions publiques

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/**'
      - 'scripts/validate_public_edge_auth.py'
      - 'scripts/validate_public_edge_auth_workflow_security.py'
      - 'scripts/validate_license_redemption_security.py'
      - 'scripts/validate_security_context_request_security.py'
      - 'scripts/validate_admin_reports_request_security.py'
      - 'scripts/validate_admin_license_codes_security.py'
      - 'scripts/validate_admin_console_request_security.py'
      - 'scripts/validate_admin_sinjira_v18_request_security.py'
      - 'scripts/validate_admin_analytics_request_security.py'
      - '.github/workflows/sinjira-public-edge-auth-guard.yml'
  push:
    branches: [ main ]
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/**'
      - 'scripts/validate_public_edge_auth.py'
      - 'scripts/validate_public_edge_auth_workflow_security.py'
      - 'scripts/validate_license_redemption_security.py'
      - 'scripts/validate_security_context_request_security.py'
      - 'scripts/validate_admin_reports_request_security.py'
      - 'scripts/validate_admin_license_codes_security.py'
      - 'scripts/validate_admin_console_request_security.py'
      - 'scripts/validate_admin_sinjira_v18_request_security.py'
      - 'scripts/validate_admin_analytics_request_security.py'
      - '.github/workflows/sinjira-public-edge-auth-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-edge-auth-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Auto-tester le contrat du garde Edge public
        run: python scripts/validate_public_edge_auth_workflow_security.py --self-test
      - name: Vérifier le contrat du garde Edge public
        run: python scripts/validate_public_edge_auth_workflow_security.py
      - name: Vérifier les exceptions verify_jwt=false
        run: python scripts/validate_public_edge_auth.py
      - name: Auto-tester le contrat d’activation licence
        run: python scripts/validate_license_redemption_security.py --self-test
      - name: Vérifier l’activation sécurisée des licences
        run: python scripts/validate_license_redemption_security.py
      - name: Auto-tester security-context
        run: python scripts/validate_security_context_request_security.py --self-test
      - name: Vérifier les bornes et la confidentialité de security-context
        run: python scripts/validate_security_context_request_security.py
      - name: Auto-tester admin-reports
        run: python scripts/validate_admin_reports_request_security.py --self-test
      - name: Vérifier les bornes et la confidentialité de admin-reports
        run: python scripts/validate_admin_reports_request_security.py
      - name: Auto-tester admin-license-codes
        run: python scripts/validate_admin_license_codes_security.py --self-test
      - name: Vérifier la confidentialité des codes d’activation admin
        run: python scripts/validate_admin_license_codes_security.py
      - name: Auto-tester admin-console
        run: python scripts/validate_admin_console_request_security.py --self-test
      - name: Vérifier les bornes et la confidentialité de admin-console
        run: python scripts/validate_admin_console_request_security.py
      - name: Auto-tester admin-sinjira-v18
        run: python scripts/validate_admin_sinjira_v18_request_security.py --self-test
      - name: Vérifier la confidentialité et les décisions humaines de admin-sinjira-v18
        run: python scripts/validate_admin_sinjira_v18_request_security.py
      - name: Auto-tester admin-analytics
        run: python scripts/validate_admin_analytics_request_security.py --self-test
      - name: Vérifier les bornes et la confidentialité de admin-analytics
        run: python scripts/validate_admin_analytics_request_security.py
