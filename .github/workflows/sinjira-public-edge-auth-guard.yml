name: SINJIRA — garde Edge Functions publiques

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/**'
      - 'scripts/validate_public_edge_auth.py'
      - '.github/workflows/sinjira-public-edge-auth-guard.yml'
  push:
    branches: [ main ]
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/**'
      - 'scripts/validate_public_edge_auth.py'
      - '.github/workflows/sinjira-public-edge-auth-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-edge-auth-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Vérifier les exceptions verify_jwt=false
        run: python scripts/validate_public_edge_auth.py
