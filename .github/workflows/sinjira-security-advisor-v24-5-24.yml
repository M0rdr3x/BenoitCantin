name: SINJIRA V24.5.24 — Contrat advisor sécurité

on:
  pull_request:
    paths:
      - 'SECURITY_ADVISOR_CONTRACT_V24_5_24.md'
      - 'scripts/validate_security_advisor_contract_v24_5_24.py'
      - 'scripts/validate_security_advisor_workflow_security.py'
      - 'supabase/tests/security_advisor_contract_v24_5_24.test.sql'
      - 'supabase/production-migration-ledger.txt'
      - 'supabase/migrations/**'
      - '.github/workflows/sinjira-security-advisor-v24-5-24.yml'
  push:
    branches: [ main ]
    paths:
      - 'SECURITY_ADVISOR_CONTRACT_V24_5_24.md'
      - 'scripts/validate_security_advisor_contract_v24_5_24.py'
      - 'scripts/validate_security_advisor_workflow_security.py'
      - 'supabase/tests/security_advisor_contract_v24_5_24.test.sql'
      - 'supabase/production-migration-ledger.txt'
      - 'supabase/migrations/**'
      - '.github/workflows/sinjira-security-advisor-v24-5-24.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Valider le contrat advisor sécurité
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Auto-tester le contrat CI advisor sécurité
        run: python scripts/validate_security_advisor_workflow_security.py --self-test

      - name: Vérifier le contrat CI advisor sécurité
        run: python scripts/validate_security_advisor_workflow_security.py

      - name: Vérifier le contrat V24.5.24
        run: python scripts/validate_security_advisor_contract_v24_5_24.py
