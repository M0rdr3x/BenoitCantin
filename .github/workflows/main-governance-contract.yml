name: Contrat gouvernance main SINJIRA

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/main-governance.yml'
      - '.github/workflows/main-governance-contract.yml'
      - 'scripts/validate_main_governance_contract.py'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/main-governance.yml'
      - '.github/workflows/main-governance-contract.yml'
      - 'scripts/validate_main_governance_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Auto-tester les invariants de gouvernance
        run: python scripts/validate_main_governance_contract.py --self-test

      - name: Vérifier le contrat de gouvernance main
        run: python scripts/validate_main_governance_contract.py
