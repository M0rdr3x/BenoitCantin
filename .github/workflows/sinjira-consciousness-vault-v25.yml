name: SINJIRA V25 — Coffre des consciences

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/personal_consciousness_vault_v25.test.sql'
      - 'supabase/functions/conscience-vault/**'
      - 'supabase/functions/_shared/auth.ts'
      - 'supabase/config.toml'
      - 'compte/registre-personnel.html'
      - 'compte/index.html'
      - 'compte/histoire-de-vie.html'
      - 'assets/js/sinjira-consciousness-vault-v25.js'
      - 'assets/css/sinjira-consciousness-vault-v25.css'
      - 'assets/js/sinjira-security-center-v24-4-98.js'
      - 'scripts/validate_conscience_vault_edge_v25.py'
      - 'scripts/validate_conscience_vault_web_v25.py'
      - 'scripts/validate_edge_function_inventory.py'
      - 'scripts/validate_production_schema_manifest.py'
      - 'scripts/validate_v25_production_deploy_workflow.py'
      - 'scripts/validate_v25_production_verification_workflow_security.py'
      - 'scripts/validate_consciousness_vault_workflow_security.py'
      - '.github/workflows/sinjira-consciousness-vault-v25.yml'
      - '.github/workflows/sinjira-v25-production-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/personal_consciousness_vault_v25.test.sql'
      - 'supabase/functions/conscience-vault/**'
      - 'supabase/functions/_shared/auth.ts'
      - 'supabase/config.toml'
      - 'compte/registre-personnel.html'
      - 'compte/index.html'
      - 'compte/histoire-de-vie.html'
      - 'assets/js/sinjira-consciousness-vault-v25.js'
      - 'assets/css/sinjira-consciousness-vault-v25.css'
      - 'assets/js/sinjira-security-center-v24-4-98.js'
      - 'scripts/validate_conscience_vault_edge_v25.py'
      - 'scripts/validate_conscience_vault_web_v25.py'
      - 'scripts/validate_edge_function_inventory.py'
      - 'scripts/validate_production_schema_manifest.py'
      - 'scripts/validate_v25_production_deploy_workflow.py'
      - 'scripts/validate_v25_production_verification_workflow_security.py'
      - 'scripts/validate_consciousness_vault_workflow_security.py'
      - '.github/workflows/sinjira-consciousness-vault-v25.yml'
      - '.github/workflows/sinjira-v25-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consciousness-vault-pgtap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false

      - name: Auto-tester le contrat CI du Coffre des consciences
        run: python3 scripts/validate_consciousness_vault_workflow_security.py --self-test

      - name: Vérifier le contrat CI du Coffre des consciences
        run: python3 scripts/validate_consciousness_vault_workflow_security.py

      - name: Auto-tester le vérificateur production V25 en lecture seule
        run: python3 scripts/validate_v25_production_verification_workflow_security.py --self-test

      - name: Vérifier le contrat du vérificateur production V25
        run: python3 scripts/validate_v25_production_verification_workflow_security.py

      - name: Vérifier les contrats de sécurité du coffre
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_conscience_vault_edge_v25.py
          python3 scripts/validate_conscience_vault_web_v25.py
          python3 scripts/validate_edge_function_inventory.py
          python3 scripts/validate_production_schema_manifest.py
          python3 scripts/validate_v25_production_deploy_workflow.py

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0
          github-token: ${{ github.token }}

      - name: Démarrer PostgreSQL Supabase local et appliquer les migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db start

      - name: Exécuter les 32 assertions pgTAP du coffre V25
        shell: bash
        run: |
          set -euo pipefail
          supabase test db supabase/tests/personal_consciousness_vault_v25.test.sql --local

      - name: Arrêter la base locale
        if: always()
        shell: bash
        run: supabase stop --no-backup || true
