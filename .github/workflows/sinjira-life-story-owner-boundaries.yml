name: Sécurité SINJIRA — identités et codes privés Histoire de vie

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/sinjira-life-story-owner-boundaries.mjs'
      - 'assets/js/sinjira-life-story-v24-5-0.js'
      - 'assets/js/sinjira-life-story-v24-5-2.js'
      - 'compte/histoire-de-vie.html'
      - 'scripts/test_sinjira_life_story_owner_boundaries.cjs'
      - '.github/workflows/sinjira-life-story-owner-boundaries.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-life-story-owner-boundaries.mjs'
      - 'assets/js/sinjira-life-story-v24-5-0.js'
      - 'assets/js/sinjira-life-story-v24-5-2.js'
      - 'compte/histoire-de-vie.html'
      - 'scripts/test_sinjira_life_story_owner_boundaries.cjs'
      - '.github/workflows/sinjira-life-story-owner-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-boundaries:
    name: Refuser les UUID falsifiés et codes posthumes non conformes
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout sans jeton GitHub persistant
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Node.js à version immuable
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Contrôler la syntaxe des vrais modules
        run: |
          node --check assets/js/sinjira-life-story-owner-boundaries.mjs
          node --check assets/js/sinjira-life-story-v24-5-0.js
          node --check assets/js/sinjira-life-story-v24-5-2.js
          node --check scripts/test_sinjira_life_story_owner_boundaries.cjs
      - name: Tester identifiants falsifiés, directives et secrets de 256 bits
        run: node scripts/test_sinjira_life_story_owner_boundaries.cjs
      - name: Contrôler l'héritage, les droits RPC et la sécurité des remises
        run: |
          python3 scripts/validate_life_story_legacy_v24_5_2.py
          python3 scripts/validate_life_story_user_rpc_v24_5_13.py
          python3 scripts/validate_life_story_delivery_error_security.py
          python3 scripts/validate_life_story_export_request_security.py
