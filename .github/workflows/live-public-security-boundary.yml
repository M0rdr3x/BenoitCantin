name: Sécurité — surveiller les expositions techniques du site public

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check_live_public_security_boundary.py'
      - '.github/workflows/live-public-security-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/check_live_public_security_boundary.py'
      - '.github/workflows/live-public-security-boundary.yml'
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-web-public-boundary-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deterministic-contract:
    name: Tester les chemins interdits, les redirections et les pannes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python figé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Tester le moniteur hors réseau
        run: python3 scripts/check_live_public_security_boundary.py --self-test

  live-boundary:
    name: Refuser toute réapparition de sources techniques en production
    needs: deterministic-contract
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python figé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Sonde HTTPS de production à chemins fixes, sans corps de réponse
        run: python3 scripts/check_live_public_security_boundary.py --live
