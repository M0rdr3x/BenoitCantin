name: Sécurité — candidat lockfile mobile isolé

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile-native/package.json'
      - 'scripts/validate_mobile_lock_candidate.py'
      - '.github/workflows/sinjira-mobile-lock-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Valider les mutations synthétiques
        run: python3 scripts/validate_mobile_lock_candidate.py --self-test
      - name: Résoudre uniquement le lockfile et auditer sans secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm --version)" = 10.9.8
          workspace="$(mktemp -d)"
          trap 'rm -rf "$workspace"' EXIT
          mkdir "$workspace/home" "$workspace/project" "$RUNNER_TEMP/mobile-lock-candidate"
          touch "$workspace/user.conf" "$workspace/global.conf"
          cp mobile-native/package.json "$workspace/project/"
          cd "$workspace/project"
          clean_npm() {
            env -i PATH="$PATH" HOME="$workspace/home" npm "$@" \
              --userconfig="$workspace/user.conf" --globalconfig="$workspace/global.conf" \
              --registry=https://registry.npmjs.org/ --ignore-scripts --no-fund --no-progress
          }
          clean_npm install --package-lock-only --no-audit
          test ! -e node_modules
          status=0
          clean_npm audit --json --package-lock-only > "$workspace/audit.json" || status=$?
          python3 "$GITHUB_WORKSPACE/scripts/validate_mobile_lock_candidate.py" \
            --manifest package.json --lock package-lock.json --audit "$workspace/audit.json" \
            --audit-exit "$status" --source-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/mobile-lock-candidate/receipt.json"
          cmp package.json "$GITHUB_WORKSPACE/mobile-native/package.json"
          cp package-lock.json "$RUNNER_TEMP/mobile-lock-candidate/package-lock.json"
      - name: Conserver le candidat et le reçu agrégé pour revue
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mobile-lock-candidate-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mobile-lock-candidate/package-lock.json
            ${{ runner.temp }}/mobile-lock-candidate/receipt.json
          retention-days: 7
          if-no-files-found: error
          overwrite: false
      - name: Bloquer si vulnérabilité élevée ou critique
        run: |
          python3 -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"mobile-lock-candidate/receipt.json").read_text()); assert r["high_critical_gate_pass"] is True, "Candidate requires vulnerability remediation"'
