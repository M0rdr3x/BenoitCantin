name: Sécurité — candidat lockfile mobile isolé

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile-native/package.json'
      - 'scripts/validate_mobile_lock_candidate.py'
      - 'scripts/verify_mobile_lock_artifact.py'
      - 'scripts/validate_mobile_minimatch_candidate.py'
      - 'scripts/validate_mobile_locked_dependencies.py'
      - '.github/workflows/sinjira-mobile-lock-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Valider les mutations synthétiques
        run: python3 scripts/validate_mobile_lock_candidate.py --self-test
      - name: Résoudre uniquement le lockfile et auditer sans secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm --version)" = 10.9.8
          workspace="$(mktemp -d)"
          trap 'rm -rf "$workspace"' EXIT
          mkdir "$workspace/home" "$workspace/project" "$RUNNER_TEMP/mobile-lock-candidate"
          touch "$workspace/user.conf" "$workspace/global.conf"
          cp mobile-native/package.json "$workspace/project/"
          cd "$workspace/project"
          clean_npm() {
            env -i PATH="$PATH" HOME="$workspace/home" npm "$@" \
              --userconfig="$workspace/user.conf" --globalconfig="$workspace/global.conf" \
              --registry=https://registry.npmjs.org/ --ignore-scripts --no-fund --no-progress
          }
          clean_npm install --package-lock-only --no-audit
          test ! -e node_modules
          status=0
          clean_npm audit --json --package-lock-only > "$workspace/audit.json" || status=$?
          python3 "$GITHUB_WORKSPACE/scripts/validate_mobile_lock_candidate.py" \
            --manifest package.json --lock package-lock.json --audit "$workspace/audit.json" \
            --audit-exit "$status" --source-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/mobile-lock-candidate/receipt.json"
          cmp package.json "$GITHUB_WORKSPACE/mobile-native/package.json"
          # Identify findings even if the independent installation job cannot run.
          python3 "$GITHUB_WORKSPACE/scripts/verify_mobile_lock_artifact.py" \
            --audit "$workspace/audit.json" --audit-exit "$status" --summary-only \
            --lock package-lock.json
          cp package-lock.json "$RUNNER_TEMP/mobile-lock-candidate/package-lock.json"
      - name: Conserver le candidat et le reçu agrégé pour revue
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mobile-lock-candidate-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mobile-lock-candidate/package-lock.json
            ${{ runner.temp }}/mobile-lock-candidate/receipt.json
          retention-days: 7
          if-no-files-found: error
          overwrite: false
      - name: Bloquer si vulnérabilité élevée ou critique
        run: |
          python3 -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"mobile-lock-candidate/receipt.json").read_text()); assert r["high_critical_gate_pass"] is True, "Candidate requires vulnerability remediation"'

  exact-lock-compatibility:
    name: Installer et tester exactement le candidat du 26 novembre
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/mobile-lockfile-candidate-20261126'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Tester le vérificateur du candidat immuable
        run: python3 scripts/verify_mobile_lock_artifact.py --self-test
      - name: Télécharger le seul artefact examiné
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/mobile-reviewed"
          mkdir "$dest"
          # Retry only failed read-only transport, never a rejected digest or metadata.
          fetch_read() {
            local endpoint="$1" target="$2" attempt
            for attempt in 1 2 3; do
              if timeout 25s gh api "$endpoint" > "$target.partial" 2> "$dest/transport.err"; then
                mv -- "$target.partial" "$target"
                return 0
              fi
              rm -f -- "$target.partial"
              if ! grep -Eq 'HTTP (502|503|504)([^0-9]|$)' "$dest/transport.err"; then
                echo "GitHub read failed with non-retryable error" >&2
                return 1
              fi
              echo "Transient GitHub read failure; attempt $attempt/3" >&2
              if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 3))"; fi
            done
            return 1
          }
          fetch_read "repos/$GITHUB_REPOSITORY/actions/artifacts/15136205966" "$dest/metadata.json"
          jq -e --arg repo "$GITHUB_REPOSITORY_ID" '
            .id==15136205966 and .name=="mobile-lock-candidate-1" and .expired==false and
            .size_in_bytes==56200 and .digest=="sha256:fb6f9573e57aa83b6493ae1ba4406d4ea2c3170feb3c0d4e96a12f0cccda44dd" and
            .workflow_run.id==45854934493 and (.workflow_run.repository_id|tostring)==$repo and
            (.workflow_run.head_repository_id|tostring)==$repo and
            .workflow_run.head_sha=="e74707087e291330d4c3df46b6fbf7a94ff7f815" and
            .workflow_run.head_branch=="security/mobile-lockfile-candidate-20261126"
          ' "$dest/metadata.json" >/dev/null || { echo "Artifact metadata mismatch" >&2; exit 1; }
          fetch_read "repos/$GITHUB_REPOSITORY/actions/artifacts/15136205966/zip" "$dest/candidate.zip"
          test "$(stat -c %s "$dest/candidate.zip")" = 56200 || { echo "Artifact size mismatch" >&2; exit 1; }
          python3 scripts/verify_mobile_lock_artifact.py --zip "$dest/candidate.zip" \
            --manifest mobile-native/package.json --output "$dest/package-lock.json"
      - name: Installer avec npm ci et tester dans une copie jetable
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm --version)" = 10.9.8
          workspace="$(mktemp -d)"
          trap 'rm -rf "$workspace"' EXIT
          mkdir "$workspace/home"
          cp -a mobile-native "$workspace/project"
          test ! -e "$workspace/project/node_modules"
          test ! -e "$workspace/project/package-lock.json"
          test ! -e "$workspace/project/.npmrc"
          cp "$RUNNER_TEMP/mobile-reviewed/package-lock.json" "$workspace/project/"
          touch "$workspace/user.conf" "$workspace/global.conf"
          cd "$workspace/project"
          clean_npm() {
            env -i PATH="$PATH" HOME="$workspace/home" CI=true npm "$@" \
              --userconfig="$workspace/user.conf" --globalconfig="$workspace/global.conf" \
              --registry=https://registry.npmjs.org/ --ignore-scripts --no-fund --no-progress
          }
          clean_npm ci --no-audit
          cmp package-lock.json "$RUNNER_TEMP/mobile-reviewed/package-lock.json"
          clean_npm run validate:vault
          clean_npm run test:navigation-guard
          clean_npm run test:deep-link-normalizer
          clean_npm run test:notification-navigation
          clean_npm run test:push-installation-binding
          clean_npm run typecheck
          cmp package-lock.json "$RUNNER_TEMP/mobile-reviewed/package-lock.json"
          status=0
          clean_npm audit --json --package-lock-only > "$workspace/audit.json" || status=$?
          python3 "$GITHUB_WORKSPACE/scripts/verify_mobile_lock_artifact.py" --audit "$workspace/audit.json" --audit-exit "$status"
          echo "PASS: exact candidate installed and six mobile checks executed; no deployment."
      - name: Tester la correction minimatch ciblée sans modifier le projet
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm --version)" = 10.9.8
          python3 scripts/validate_mobile_minimatch_candidate.py --self-test
          workspace="$(mktemp -d)"
          trap 'rm -rf "$workspace"' EXIT
          mkdir "$workspace/home" "$RUNNER_TEMP/mobile-minimatch-remediation"
          cp -a mobile-native "$workspace/project"
          test ! -e "$workspace/project/node_modules"
          test ! -e "$workspace/project/package-lock.json"
          test ! -e "$workspace/project/.npmrc"
          baseline="$RUNNER_TEMP/mobile-reviewed/package-lock.json"
          cp "$baseline" "$workspace/project/package-lock.json"
          touch "$workspace/user.conf" "$workspace/global.conf"
          cd "$workspace/project"
          guard() {
            python3 "$GITHUB_WORKSPACE/scripts/validate_mobile_minimatch_candidate.py" \
              --original "$GITHUB_WORKSPACE/mobile-native/package.json" --baseline "$baseline" \
              --manifest package.json --lock package-lock.json "$@"
          }
          clean_npm() {
            env -i PATH="$PATH" HOME="$workspace/home" CI=true npm "$@" \
              --userconfig="$workspace/user.conf" --globalconfig="$workspace/global.conf" \
              --registry=https://registry.npmjs.org/ --ignore-scripts --no-fund --no-progress
          }
          guard --prepare
          clean_npm install --package-lock-only --no-audit
          test ! -e node_modules
          guard
          cp package-lock.json "$workspace/expected-lock.json"
          cp package.json "$workspace/expected-manifest.json"
          clean_npm ci --no-audit
          cmp package-lock.json "$workspace/expected-lock.json"
          cmp package.json "$workspace/expected-manifest.json"
          clean_npm run validate:vault
          clean_npm run test:navigation-guard
          clean_npm run test:deep-link-normalizer
          clean_npm run test:notification-navigation
          clean_npm run test:push-installation-binding
          clean_npm run typecheck
          # Exercise the actual Expo consumer, not just an isolated minimatch import.
          env -i PATH="$PATH" HOME="$workspace/home" CI=true timeout 90s node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const {createRequire} = require('node:module');
          const fromFingerprint = createRequire(require.resolve('@expo/fingerprint'));
          let dir = path.dirname(fromFingerprint.resolve('minimatch'));
          for (;;) {
            const pkg = path.join(dir, 'package.json');
            if (fs.existsSync(pkg)) {
              const meta = JSON.parse(fs.readFileSync(pkg, 'utf8'));
              if (meta.name === 'minimatch') {
                assert.equal(meta.version, '11.0.9');
                break;
              }
            }
            const parent = path.dirname(dir);
            assert.notEqual(parent, dir);
            dir = parent;
          }
          const {createFingerprintAsync} = require('@expo/fingerprint');
          (async () => {
            const result = await createFingerprintAsync(process.cwd());
            assert.match(result.hash, /^[0-9a-f]{40,64}$/);
            assert.ok(Array.isArray(result.sources) && result.sources.length > 0);
            console.log('PASS: Expo Fingerprint generated using scoped minimatch 11.0.9');
          })().catch(() => { console.error('Expo Fingerprint compatibility failed'); process.exitCode=1; });
          NODE
          cmp package-lock.json "$workspace/expected-lock.json"
          cmp package.json "$workspace/expected-manifest.json"
          status=0
          clean_npm audit --json --package-lock-only > "$workspace/audit.json" || status=$?
          guard --audit "$workspace/audit.json" --audit-exit "$status" \
            --receipt "$RUNNER_TEMP/mobile-minimatch-remediation/receipt.json"
          python3 "$GITHUB_WORKSPACE/scripts/validate_mobile_locked_dependencies.py" --self-test
          python3 "$GITHUB_WORKSPACE/scripts/validate_mobile_locked_dependencies.py" \
            --manifest package.json --lock package-lock.json \
            --audit "$workspace/audit.json" --audit-exit "$status" --handoff-public-lock
          cp package.json package-lock.json "$RUNNER_TEMP/mobile-minimatch-remediation/"
      - name: Conserver uniquement le candidat corrigé et le reçu
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mobile-minimatch-remediation-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mobile-minimatch-remediation/package.json
            ${{ runner.temp }}/mobile-minimatch-remediation/package-lock.json
            ${{ runner.temp }}/mobile-minimatch-remediation/receipt.json
          retention-days: 7
          if-no-files-found: error
          overwrite: false
