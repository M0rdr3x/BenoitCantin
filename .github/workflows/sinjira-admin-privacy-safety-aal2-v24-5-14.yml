name: SINJIRA V24.5.14 — AAL2 confidentialité/sécurité

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260824013042_sinjira_v24_5_14_admin_privacy_safety_aal2_hardening.sql'
      - 'supabase/production-migration-ledger.txt'
      - 'scripts/validate_admin_privacy_safety_aal2_v24_5_14.py'
      - 'scripts/validate_admin_aal2_workflow_security.py'
      - 'scripts/validate_site.py'
      - 'scripts/validate_supabase.py'
      - 'scripts/validate_production_migration_ledger.py'
      - 'scripts/validate_production_schema_manifest.py'
      - 'scripts/validate_free_only_mode.py'
      - 'ADMIN_PRIVACY_SAFETY_AAL2_V24_5_14.md'
      - '.github/workflows/sinjira-admin-privacy-safety-aal2-v24-5-14.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260824013042_sinjira_v24_5_14_admin_privacy_safety_aal2_hardening.sql'
      - 'supabase/production-migration-ledger.txt'
      - 'scripts/validate_admin_privacy_safety_aal2_v24_5_14.py'
      - 'scripts/validate_admin_aal2_workflow_security.py'
      - 'scripts/validate_site.py'
      - 'scripts/validate_supabase.py'
      - 'scripts/validate_production_migration_ledger.py'
      - 'scripts/validate_production_schema_manifest.py'
      - 'scripts/validate_free_only_mode.py'
      - 'ADMIN_PRIVACY_SAFETY_AAL2_V24_5_14.md'
      - '.github/workflows/sinjira-admin-privacy-safety-aal2-v24-5-14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Auto-tester le contrat CI AAL2 admin
        run: python scripts/validate_admin_aal2_workflow_security.py --self-test

      - name: Vérifier le contrat CI AAL2 admin
        run: python scripts/validate_admin_aal2_workflow_security.py

      - name: Contrat AAL2 confidentialité/sécurité
        run: python scripts/validate_admin_privacy_safety_aal2_v24_5_14.py
      - name: Validation statique du site
        run: python scripts/validate_site.py
      - name: Contrat Supabase
        run: python scripts/validate_supabase.py
      - name: Ledger production
        run: python scripts/validate_production_migration_ledger.py
      - name: Manifeste du schéma production
        run: python scripts/validate_production_schema_manifest.py
      - name: Mode gratuit et services externes
        run: python scripts/validate_free_only_mode.py
