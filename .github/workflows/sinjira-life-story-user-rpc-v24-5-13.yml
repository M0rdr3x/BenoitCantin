name: SINJIRA V24.5.13 — Frontière RPC Histoire de vie

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/production-migration-ledger.txt'
      - 'scripts/validate_life_story_user_rpc_v24_5_13.py'
      - 'scripts/validate_dating_rpc_v24_5_12.py'
      - 'scripts/validate_preorder_user_rpc_v24_5_11.py'
      - 'scripts/validate_security_rpc_v24_5_10.py'
      - 'scripts/validate_global_admin_rpc_v24_5_9.py'
      - 'scripts/validate_preorder_admin_rpc_v24_5_8.py'
      - 'scripts/validate_preorder_rpc_hardening_v24_5_7.py'
      - 'scripts/validate_production_migration_ledger.py'
      - 'LIFE_STORY_USER_RPC_BOUNDARY_V24_5_13.md'
      - '.github/workflows/sinjira-life-story-user-rpc-v24-5-13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Contrat frontière Histoire de vie V24.5.13
        run: python scripts/validate_life_story_user_rpc_v24_5_13.py
      - name: Contrat historique V24.5.12
        run: python scripts/validate_dating_rpc_v24_5_12.py
      - name: Contrat historique V24.5.11
        run: python scripts/validate_preorder_user_rpc_v24_5_11.py
      - name: Contrat historique V24.5.10
        run: python scripts/validate_security_rpc_v24_5_10.py
      - name: Contrat historique V24.5.9
        run: python scripts/validate_global_admin_rpc_v24_5_9.py
      - name: Contrat historique V24.5.8
        run: python scripts/validate_preorder_admin_rpc_v24_5_8.py
      - name: Contrat historique V24.5.7
        run: python scripts/validate_preorder_rpc_hardening_v24_5_7.py
      - name: Validation statique du site
        run: python scripts/validate_site.py
      - name: Contrat Supabase
        run: python scripts/validate_supabase.py
      - name: Ledger production
        run: python scripts/validate_production_migration_ledger.py
      - name: Manifeste du schéma production
        run: python scripts/validate_production_schema_manifest.py
      - name: Mode gratuit et services externes
        run: python scripts/validate_free_only_mode.py
