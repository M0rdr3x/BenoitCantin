name: Projet Nova P53N - Plan de collecte sans sollicitation reelle
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p53n.yml"
      - "scripts/preparer_acquisition_preuves_nova_p53n.py"
      - "scripts/tests/test_preparer_acquisition_preuves_nova_p53n.py"
      - "scripts/construire_registre_couts_evitables_nova_p53m.py"
      - "scripts/evaluer_hypotheses_economies_nova_p53l.py"
      - "scripts/preparer_controles_probatoires_nova_p53k.py"
      - "scripts/auditer_appariements_municipaux_nova_p53j.py"
      - "projets/projet-nova/etudes/P53N_*"
      - "projets/projet-nova/etudes/P53M_CRITERES_COUTS_EVITABLES.json"
      - "projets/projet-nova/etudes/P53L_CADRE_EVALUATION_ECONOMIES.json"
      - "projets/projet-nova/etudes/P53K_EXIGENCES_PROBATOIRES.json"
      - "projets/projet-nova/etudes/P53I_SOURCES_REVISION_ET_CHARGES_2024.json"
      - "projets/projet-nova/etudes/P53H_PRIORITES_VERIFICATION_2024.json"
      - "projets/projet-nova/etudes/sources/P53I_MAMH_2024_1344_RECETTES_CHARGES_SELECTION.csv"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controle-probatoire:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout sans credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Tests des 12 fiches, 144 pieces et refus des faux justificatifs
        run: |
          python -m py_compile scripts/preparer_acquisition_preuves_nova_p53n.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
            "scripts/tests",pattern="test_preparer_acquisition_preuves_nova_p53n.py")
          assert suite.countTestCases()==42,suite.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
      - name: Generer bilan et refuser toute certification
        run: |
          python scripts/preparer_acquisition_preuves_nova_p53n.py --rapport p53n_bilan.json --registre p53n_registre.json
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path("p53n_bilan.json").read_text("utf-8"))
          r=json.loads(Path("p53n_registre.json").read_text("utf-8"))
          assert b["fiches_d_acquisition_preparees"]==12
          assert b["emplacements_de_pieces_non_obtenues"]==144
          assert b["pieces_primaires_authentifiees"]==0
          assert b["demandes_effectivement_envoyees_verifiees"]==0
          assert b["economies_certifiees_cad"] is None
          assert b["decision"]=="NO_GO_AUTOMATIQUE"
          assert len(r["fiches"])==12
          assert all(x["economie_certifiee_cad"] is None for x in r["fiches"])
          PY
          set +e
          python scripts/preparer_acquisition_preuves_nova_p53n.py --exiger-preuves-certifiees --rapport p53n_refus.json
          statut=$?
          set -e
          test "$statut" -eq 3
      - name: Rapports generiques uniquement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-p53n-acquisition-non-effectuee
          path: |
            p53n_bilan.json
            p53n_refus.json
            p53n_registre.json
          if-no-files-found: ignore
          retention-days: 7
