name: Variantes légères identité et illustrations SINJIRA

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/generate_public_image_variants.py'
      - '.github/workflows/public-image-variants.yml'
      - 'assets/icons/sinjira-officiel-20261120.png'
      - 'assets/media/sinjira-communaute.webp'
      - 'assets/media/sinjira-demo-promo.webp'
      - 'assets/media/sinjira-reseau-mere-resistance-officiel.webp'
      - 'assets/media/sinjira-brand-*.webp'
      - 'assets/media/sinjira-*-public-*.webp'
      - 'scripts/public_image_variants_manifest.json'
      - 'scripts/validate_public_image_geometry.py'
      - 'projets/sinjira/**/index.html'

permissions:
  contents: read

jobs:
  thumbnails:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble@sha256:a9731514f24121d1dcd25d58d0a38146646d290a5998fd80d3e533e7b5e21c69
      options: --user 1001
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Installer le client Playwright épinglé
        run: python -m pip install --disable-pip-version-check "playwright==1.61.0"
      - name: Générer neuf variantes publiques
        run: python scripts/generate_public_image_variants.py --output /tmp/sinjira-public-variants
      - name: Vérifier les variantes intégrées
        run: python scripts/validate_public_image_geometry.py
