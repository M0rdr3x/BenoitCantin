name: SINJIRA V25 — Coffre fonctionnel AAL2

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/smoke_conscience_vault_functional_local.py'
      - 'scripts/validate_conscience_vault_functional_smoke.py'
      - 'scripts/smoke_sensitive_aal2_local.py'
      - 'scripts/validate_sensitive_aal2_smoke.py'
      - 'scripts/validate_conscience_vault_edge_v25.py'
      - 'scripts/validate_conscience_vault_web_v25.py'
      - 'scripts/validate_production_schema_manifest.py'
      - 'supabase/tests/personal_consciousness_vault_v25.test.sql'
      - 'supabase/functions/conscience-vault/**'
      - 'supabase/functions/_shared/auth.ts'
      - 'supabase/functions/_shared/cors.ts'
      - 'supabase/migrations/**conscience**.sql'
      - 'supabase/migrations/**security**.sql'
      - 'supabase/config.toml'
      - '.github/workflows/sinjira-conscience-vault-functional-v25.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conscience-vault-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Valider les contrats Coffre et AAL2
        run: |
          python3 scripts/validate_conscience_vault_edge_v25.py
          python3 scripts/validate_conscience_vault_web_v25.py
          python3 scripts/validate_sensitive_aal2_smoke.py
          python3 scripts/validate_conscience_vault_functional_smoke.py
          python3 scripts/validate_production_schema_manifest.py

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Démarrer Supabase local complet
        run: supabase start

      - name: Tester le Coffre avec pgTAP
        run: supabase test db supabase/tests/personal_consciousness_vault_v25.test.sql --local

      - name: Tester le parcours fonctionnel Coffre derrière AAL2
        shell: bash
        run: |
          set -euo pipefail
          status_env="$(supabase status -o env)"
          API_URL="$(sed -n 's/^API_URL="\(.*\)"$/\1/p' <<< "$status_env" | head -n1)"
          ANON_KEY="$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' <<< "$status_env" | head -n1)"
          test -n "$API_URL"
          test -n "$ANON_KEY"
          SINJIRA_LOCAL_API_URL="$API_URL" \
          SINJIRA_LOCAL_ANON_KEY="$ANON_KEY" \
            python3 scripts/smoke_conscience_vault_functional_local.py

      - name: Arrêter Supabase local
        if: always()
        run: supabase stop --no-backup || true
