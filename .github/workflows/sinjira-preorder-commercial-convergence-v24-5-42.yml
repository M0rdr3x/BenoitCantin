name: SINJIRA V24.5.42 — Convergence préparation commerciale

on:
  pull_request:
    paths:
      - 'assets/js/sinjira-admin-preorder-fulfillment-v24-5-6.js'
      - 'assets/js/sinjira-admin-preorder-tax-v24-5-27.js'
      - 'assets/js/sinjira-preorder-fulfillment-v24-5-6.js'
      - 'assets/js/sinjira-preorder-cost-summary-v24-5-25.js'
      - 'assets/js/sinjira-preorder-tax-estimate-v24-5-27.js'
      - 'admin/sinjira/precommandes-readiness.html'
      - 'PREORDER_COMMERCIAL_CONVERGENCE_V24_5_42.md'
      - 'scripts/validate_preorder_commercial_convergence_v24_5_42.py'
      - 'supabase/production-migration-ledger.txt'
      - '.github/workflows/sinjira-preorder-commercial-convergence-v24-5-42.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Valider V24.5.42
        run: python3 scripts/validate_preorder_commercial_convergence_v24_5_42.py
      - name: Valider le ledger production inchangé
        run: python3 scripts/validate_production_migration_ledger.py
