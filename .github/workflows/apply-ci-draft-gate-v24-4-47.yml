name: Appliquer garde PR brouillon V24.4.47

on:
  push:
    branches: [ v24-4-47-ci-draft-gate ]
    paths:
      - '.github/workflows/apply-ci-draft-gate-v24-4-47.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v24-4-47-ci-draft-gate
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Ajouter le garde brouillon au préflight Supabase
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/supabase-production-preflight.yml')
          text = path.read_text(encoding='utf-8')

          trigger_old = "  pull_request:\n    branches: [ main ]\n    paths:\n"
          trigger_new = "  pull_request:\n    branches: [ main ]\n    types: [opened, synchronize, reopened, ready_for_review]\n    paths:\n"
          if trigger_new not in text:
              if trigger_old not in text:
                  raise SystemExit('Bloc pull_request attendu introuvable')
              text = text.replace(trigger_old, trigger_new, 1)

          job_old = "jobs:\n  sync:\n    runs-on: ubuntu-latest\n"
          job_new = "jobs:\n  sync:\n    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false\n    runs-on: ubuntu-latest\n"
          if job_new not in text:
              if job_old not in text:
                  raise SystemExit('Bloc jobs.sync attendu introuvable')
              text = text.replace(job_old, job_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Enregistrer le correctif
        run: |
          if git diff --quiet; then
            echo "Préflight déjà aligné."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/supabase-production-preflight.yml
          git commit -m "V24.4.47 — protège le préflight Supabase sur PR brouillon"
          git push origin HEAD:v24-4-47-ci-draft-gate
