name: Sécurité CI — bloquer les injections de contexte GitHub dans run

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/validate_actions_run_interpolation.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/validate_actions_run_interpolation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-actions-shell:
    name: Analyser les workflows et tester les injections
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Auto-tests adversariaux (sans réseau ni secrets)
        run: python3 scripts/validate_actions_run_interpolation.py --self-test
      - name: Scanner les scripts GitHub Actions
        run: python3 scripts/validate_actions_run_interpolation.py
