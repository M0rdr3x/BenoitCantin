name: Projet Nova P52Q - Huit dossiers documentaires et limites legales
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p52q.yml"
      - "scripts/controler_dossiers_primaires_nova_p52q.py"
      - "scripts/tests/test_controler_dossiers_primaires_nova_p52q.py"
      - "projets/projet-nova/etudes/P52Q_*"
      - "projets/projet-nova/etudes/P52A_REGISTRE_PREUVES_FISCALES.json"
      - "projets/projet-nova/etudes/P52P_REGISTRE_COUVERTURE_ET_MANQUES.json"
      - "projets/projet-nova/etudes/P52O_PLAN_ACQUISITION_PREUVES.json"
      - "projets/projet-nova/etudes/P52N_CAHIER_MANDATS_ET_CONSULTATION.json"
      - "projets/projet-nova/etudes/P52J_RELECTURE_PRIMAIRE_BUDGET_2026_2027.json"
      - "projets/projet-nova/etudes/P52K_REGISTRE_PROVENANCE_BUDGET.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dossiers-primaires-sans-approbation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Lecture seule du depot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Installer Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Quarante-huit tests contradictoires des dossiers
        run: |
          python -m py_compile scripts/controler_dossiers_primaires_nova_p52q.py
          python - <<'PY'
          import unittest
          tests=unittest.defaultTestLoader.discover("scripts/tests",pattern="test_controler_dossiers_primaires_nova_p52q.py")
          assert tests.countTestCases()==48, tests.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(tests)
          assert result.wasSuccessful()
          PY
      - name: Rapport agrege sans source brute ni information de personne
        run: |
          python scripts/controler_dossiers_primaires_nova_p52q.py --rapport p52q_rapport_agrege.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("p52q_rapport_agrege.json").read_text("utf-8"))
          assert r["dossiers_prioritaires"]==8
          assert r["liens_officiels_a_analyser"]==13
          assert r["nouveaux_reperes_pour_F19"]==1
          assert r["sources_budget_P52J_sans_nouvel_archivage"]==2
          assert r["dossiers_avec_avis_independant_recu"]==0
          assert r["decision"]=="NO_GO_AUTOMATIQUE"
          PY
      - name: Toute exigence de certification stricte doit echouer en NO_GO
        run: |
          set +e
          python scripts/controler_dossiers_primaires_nova_p52q.py --exiger-expertises --rapport p52q_refus.json
          result=$?
          set -e
          test "$result" -eq 3
      - name: Artefacts agreges uniquement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-p52q-huit-dossiers-premiere-vague-no-go
          path: |
            p52q_rapport_agrege.json
            p52q_refus.json
          retention-days: 7
          if-no-files-found: ignore
