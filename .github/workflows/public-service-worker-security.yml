name: Sécurité PWA — confinement des caches publics

on:
  push:
    branches: [ main ]
    paths:
      - 'sw.js'
      - 'scripts/test_service_worker_security.cjs'
      - '.github/workflows/public-service-worker-security.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sw.js'
      - 'scripts/test_service_worker_security.cjs'
      - '.github/workflows/public-service-worker-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-worker-boundary:
    name: Refuser les fuites et caches non autorisés
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt sans conserver le jeton Git
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Node épinglé
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Vérifier la syntaxe du Service Worker et des tests
        run: |
          node --check sw.js
          node --check scripts/test_service_worker_security.cjs
      - name: Tester les frontières privées et l'absence de pollution inter-PWA
        run: node scripts/test_service_worker_security.cjs
