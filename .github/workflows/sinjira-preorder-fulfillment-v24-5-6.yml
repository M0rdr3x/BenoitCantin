name: SINJIRA V24.5.6 — Livraison et ramassage Livre I

on:
  pull_request:
    paths:
      - 'projets/sinjira/romans/precommande.html'
      - 'compte/mes-achats.html'
      - 'admin/sinjira/precommandes.html'
      - 'assets/js/sinjira-preorders-v24-5-3.js'
      - 'assets/js/sinjira-preorder-fulfillment-v24-5-6.js'
      - 'assets/js/sinjira-admin-preorder-fulfillment-v24-5-6.js'
      - 'assets/css/sinjira-preorder-fulfillment-v24-5-6.css'
      - 'assets/css/sinjira-admin-preorder-fulfillment-v24-5-6.css'
      - 'supabase/migrations/**'
      - 'supabase/production-migration-ledger.txt'
      - 'scripts/validate_preorder_fulfillment_v24_5_6.py'
      - 'scripts/validate_production_migration_ledger.py'
      - 'scripts/validate_production_schema_manifest.py'
      - 'LIVRAISON_RAMASSAGE_LIVRE_I_V24_5_6.md'
      - 'PRECOMMANDES_ROMAN_V24_5_3.md'
      - 'ARCHITECTURE_COMPTE_UNIVERSEL.md'
      - 'SERVICES_EXTERNES_PAYANTS.md'
      - '.github/workflows/sinjira-preorder-fulfillment-v24-5-6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Contrat livraison et ramassage V24.5.6
        run: python scripts/validate_preorder_fulfillment_v24_5_6.py
      - name: Validation statique du site
        run: python scripts/validate_site.py
      - name: Contrat Supabase
        run: python scripts/validate_supabase.py
      - name: Ledger production
        run: python scripts/validate_production_migration_ledger.py
      - name: Manifeste du schéma production
        run: python scripts/validate_production_schema_manifest.py
      - name: Mode gratuit et services externes
        run: python scripts/validate_free_only_mode.py
