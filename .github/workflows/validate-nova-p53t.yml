name: Projet Nova P53T - Integrite locale sans preuve de provenance
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p53t.yml"
      - "scripts/verifier_integrite_locale_nova_p53t.py"
      - "scripts/tests/test_verifier_integrite_locale_nova_p53t.py"
      - "scripts/suivre_demandes_acces_nova_p53s.py"
      - "scripts/preparer_demandes_acces_nova_p53r.py"
      - "scripts/inventorier_pieces_primaires_nova_p53q.py"
      - "scripts/constituer_dossiers_institutionnels_nova_p53p.py"
      - "scripts/prioriser_sources_officielles_nova_p53o.py"
      - "scripts/preparer_acquisition_preuves_nova_p53n.py"
      - "scripts/construire_registre_couts_evitables_nova_p53m.py"
      - "scripts/evaluer_hypotheses_economies_nova_p53l.py"
      - "scripts/preparer_controles_probatoires_nova_p53k.py"
      - "scripts/auditer_appariements_municipaux_nova_p53j.py"
      - "projets/projet-nova/etudes/P53T_*"
      - "projets/projet-nova/etudes/P53S_REGISTRE_SUIVI_ET_RECOURS.json"
      - "projets/projet-nova/etudes/P53R_PROJETS_DEMANDES_ACCES_2024.json"
      - "projets/projet-nova/etudes/P53Q_INVENTAIRE_PIECES_ET_CONTREPARTIES.json"
      - "projets/projet-nova/etudes/P53P_DOSSIERS_INSTITUTIONNELS_2024.json"
      - "projets/projet-nova/etudes/P53O_MATRICE_SOURCES_OFFICIELLES.json"
      - "projets/projet-nova/etudes/P53N_PLAN_ACQUISITION_PREUVES.json"
      - "projets/projet-nova/etudes/P53M_CRITERES_COUTS_EVITABLES.json"
      - "projets/projet-nova/etudes/P53L_CADRE_EVALUATION_ECONOMIES.json"
      - "projets/projet-nova/etudes/P53K_EXIGENCES_PROBATOIRES.json"
      - "projets/projet-nova/etudes/P53I_SOURCES_REVISION_ET_CHARGES_2024.json"
      - "projets/projet-nova/etudes/P53H_PRIORITES_VERIFICATION_2024.json"
      - "projets/projet-nova/etudes/sources/P53I_MAMH_2024_1344_RECETTES_CHARGES_SELECTION.csv"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity-technical-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Test 56 cas locaux synthetiques sans documents publics reels
        run: |
          python -m py_compile scripts/verifier_integrite_locale_nova_p53t.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
            "scripts/tests",pattern="test_verifier_integrite_locale_nova_p53t.py")
          assert suite.countTestCases()==56,suite.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
      - name: Verifier 102 positions et refus d'authentification
        run: |
          python scripts/verifier_integrite_locale_nova_p53t.py --bilan p53t_bilan.json --inventaire p53t_inventaire.json
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path("p53t_bilan.json").read_text("utf-8"))
          p=json.loads(Path("p53t_inventaire.json").read_text("utf-8"))
          assert b["positions_p53q"]==102
          assert b["preuves_origine_certifiees"]==0
          assert b["documents_financiers_2024_certifies"]==0
          assert b["economie_operationnelle_certifiee_cad"] is None
          assert b["decision"]=="NO_GO_AUTOMATIQUE"
          assert len(p["positions"])==102
          PY
          set +e
          python scripts/verifier_integrite_locale_nova_p53t.py --exiger-authentification-ou-economie --bilan p53t_refus.json
          code=$?
          set -e
          test "$code" -eq 3
      - name: Exporter bilan non sensible uniquement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-p53t-concordance-technique-non-certifiee
          path: |
            p53t_bilan.json
            p53t_refus.json
          if-no-files-found: ignore
          retention-days: 7
