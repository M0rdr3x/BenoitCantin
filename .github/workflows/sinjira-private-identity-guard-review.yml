name: Sécurité SINJIRA — revue des fonctions privées privilégiées

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sinjira-private-identity-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  private-identity-contract:
    name: Refuser les identités tierces dans les fonctions SQL privilégiées
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans credentials persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python épinglé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Vérifier la syntaxe du validateur et des tests
        run: python3 -m py_compile scripts/validate_private_role_identity_guard.py scripts/test_private_role_identity_guard.py
      - name: Tester les contournements de l'identité et les régressions RLS
        run: python3 scripts/test_private_role_identity_guard.py
      - name: Vérifier le contrat SQL hors des migrations de production
        run: python3 scripts/validate_private_role_identity_guard.py --check
