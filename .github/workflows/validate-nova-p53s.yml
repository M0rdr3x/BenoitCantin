name: Projet Nova P53S - Registre de suivi acces sans depot certifie
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p53s.yml"
      - "scripts/suivre_demandes_acces_nova_p53s.py"
      - "scripts/tests/test_suivre_demandes_acces_nova_p53s.py"
      - "scripts/preparer_demandes_acces_nova_p53r.py"
      - "scripts/tests/test_preparer_demandes_acces_nova_p53r.py"
      - "scripts/inventorier_pieces_primaires_nova_p53q.py"
      - "scripts/constituer_dossiers_institutionnels_nova_p53p.py"
      - "scripts/prioriser_sources_officielles_nova_p53o.py"
      - "scripts/preparer_acquisition_preuves_nova_p53n.py"
      - "scripts/construire_registre_couts_evitables_nova_p53m.py"
      - "scripts/evaluer_hypotheses_economies_nova_p53l.py"
      - "scripts/preparer_controles_probatoires_nova_p53k.py"
      - "scripts/auditer_appariements_municipaux_nova_p53j.py"
      - "projets/projet-nova/etudes/P53S_*"
      - "projets/projet-nova/etudes/P53R_PROJETS_DEMANDES_ACCES_2024.json"
      - "projets/projet-nova/etudes/P53Q_INVENTAIRE_PIECES_ET_CONTREPARTIES.json"
      - "projets/projet-nova/etudes/P53P_DOSSIERS_INSTITUTIONNELS_2024.json"
      - "projets/projet-nova/etudes/P53O_MATRICE_SOURCES_OFFICIELLES.json"
      - "projets/projet-nova/etudes/P53N_PLAN_ACQUISITION_PREUVES.json"
      - "projets/projet-nova/etudes/P53M_CRITERES_COUTS_EVITABLES.json"
      - "projets/projet-nova/etudes/P53L_CADRE_EVALUATION_ECONOMIES.json"
      - "projets/projet-nova/etudes/P53K_EXIGENCES_PROBATOIRES.json"
      - "projets/projet-nova/etudes/P53I_SOURCES_REVISION_ET_CHARGES_2024.json"
      - "projets/projet-nova/etudes/P53H_PRIORITES_VERIFICATION_2024.json"
      - "projets/projet-nova/etudes/sources/P53I_MAMH_2024_1344_RECETTES_CHARGES_SELECTION.csv"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  suivi-sans-attestation-automatique:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Code lecture seule
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Retester 48 controles P53R corriges
        run: |
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
            "scripts/tests",pattern="test_preparer_demandes_acces_nova_p53r.py")
          assert suite.countTestCases()==48,suite.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
      - name: Tester 64 cas P53S
        run: |
          python -m py_compile scripts/suivre_demandes_acces_nova_p53s.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
            "scripts/tests",pattern="test_suivre_demandes_acces_nova_p53s.py")
          assert suite.countTestCases()==64,suite.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
      - name: Generer registre initial et exiger refus de fausse attestation
        run: |
          python scripts/suivre_demandes_acces_nova_p53s.py --bilan p53s_bilan.json --registre p53s_registre.json
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path("p53s_bilan.json").read_text("utf-8"))
          p=json.loads(Path("p53s_registre.json").read_text("utf-8"))
          assert b["positions_de_suivi"]==66
          assert b["demandes_reellement_envoyees_verifiees"]==0
          assert b["accuses_reception_authentifies"]==0
          assert b["echeances_reponse_calculables"]==0
          assert b["economies_certifiees_cad"] is None
          assert b["decision"]=="NO_GO_AUTOMATIQUE"
          assert len(p["dossiers"])==6
          PY
          set +e
          python scripts/suivre_demandes_acces_nova_p53s.py --exiger-envoi-ou-reception-verifie --bilan p53s_refus.json
          status=$?
          set -e
          test "$status" -eq 3
      - name: Publier bilan agrege uniquement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-p53s-registre-non-atteste
          path: |
            p53s_bilan.json
            p53s_refus.json
          if-no-files-found: ignore
          retention-days: 7
