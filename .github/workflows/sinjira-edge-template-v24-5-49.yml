name: SINJIRA V24.5.49 — Modèle PDF Fracture sécurisé

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Vérifier V24.5.49
        run: |
          python scripts/validate_edge_template_fetch_v24_5_49.py
          python scripts/validate_edge_response_privacy_v24_5_48.py
          python scripts/validate_edge_function_inventory.py
