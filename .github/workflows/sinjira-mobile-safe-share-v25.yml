name: SINJIRA V25 — Partage natif mobile sûr

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile-native/App.tsx'
      - 'mobile-native/safePublicShare.ts'
      - 'mobile-native/package.json'
      - 'mobile-native/package-lock.json'
      - 'mobile-native/tsconfig.json'
      - 'mobile-native/scripts/validate-vault-mobile.mjs'
      - 'scripts/validate_mobile_safe_share_v25.py'
      - 'scripts/validate_device_challenge_client_boundary.py'
      - 'scripts/validate_no_committed_secrets.py'
      - 'scripts/validate_mobile_safe_share_workflow_security.py'
      - '.github/workflows/sinjira-mobile-safe-share-v25.yml'
  push:
    branches: [ main ]
    paths:
      - 'mobile-native/App.tsx'
      - 'mobile-native/safePublicShare.ts'
      - 'mobile-native/package.json'
      - 'mobile-native/package-lock.json'
      - 'mobile-native/tsconfig.json'
      - 'mobile-native/scripts/validate-vault-mobile.mjs'
      - 'scripts/validate_mobile_safe_share_v25.py'
      - 'scripts/validate_device_challenge_client_boundary.py'
      - 'scripts/validate_no_committed_secrets.py'
      - 'scripts/validate_mobile_safe_share_workflow_security.py'
      - '.github/workflows/sinjira-mobile-safe-share-v25.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-safe-share:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Auto-tester le contrat CI du partage mobile sûr
        run: python3 scripts/validate_mobile_safe_share_workflow_security.py --self-test

      - name: Vérifier le contrat CI du partage mobile sûr
        run: python3 scripts/validate_mobile_safe_share_workflow_security.py

      - name: Valider le partage public natif
        run: python3 scripts/validate_mobile_safe_share_v25.py

      - name: Revalider la frontière challenge client
        run: python3 scripts/validate_device_challenge_client_boundary.py

      - name: Revalider l'absence de secrets suivis
        run: python3 scripts/validate_no_committed_secrets.py

      - name: Configurer Node.js sans cache implicite
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'

      - name: Installer les dépendances mobile sans scripts
        working-directory: mobile-native
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Vérifier le contrat mobile historique du Coffre
        working-directory: mobile-native
        run: npm run validate:vault

      - name: Vérifier TypeScript mobile
        working-directory: mobile-native
        run: npm run typecheck
