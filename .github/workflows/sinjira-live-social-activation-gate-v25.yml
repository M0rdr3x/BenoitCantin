name: SINJIRA V25 — Garde activation En direct

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/production-migration-ledger.txt'
      - 'supabase/migrations/**'
      - 'scripts/validate_production_migration_ledger.py'
      - 'scripts/validate_production_schema_manifest.py'
      - 'scripts/validate_live_social_activation_gate_v25.py'
      - 'scripts/test_live_social_activation_gate_v25.py'
      - 'scripts/validate_live_social_activation_gate_workflow_security.py'
      - 'assets/js/**/*.js'
      - 'assets/css/**/*.css'
      - '**/*.html'
      - '.github/workflows/sinjira-live-social-activation-gate-v25.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/production-migration-ledger.txt'
      - 'supabase/migrations/**'
      - 'scripts/validate_production_migration_ledger.py'
      - 'scripts/validate_production_schema_manifest.py'
      - 'scripts/validate_live_social_activation_gate_v25.py'
      - 'scripts/test_live_social_activation_gate_v25.py'
      - 'scripts/validate_live_social_activation_gate_workflow_security.py'
      - 'assets/js/**/*.js'
      - 'assets/css/**/*.css'
      - '**/*.html'
      - '.github/workflows/sinjira-live-social-activation-gate-v25.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Auto-tester le contrat CI garde activation En direct
        run: python scripts/validate_live_social_activation_gate_workflow_security.py --self-test

      - name: Vérifier le contrat CI garde activation En direct
        run: python scripts/validate_live_social_activation_gate_workflow_security.py

      - name: Tester les états du garde En direct
        run: python scripts/test_live_social_activation_gate_v25.py

      - name: Vérifier le garde d activation En direct
        run: python scripts/validate_live_social_activation_gate_v25.py

      - name: Vérifier le ledger production canonique
        run: python scripts/validate_production_migration_ledger.py

      - name: Vérifier le manifeste de schéma production
        run: python scripts/validate_production_schema_manifest.py
