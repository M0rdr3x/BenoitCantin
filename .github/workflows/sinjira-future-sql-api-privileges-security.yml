name: Sécurité SQL — refuser les nouveaux objets publics sans permissions explicites

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/validate_new_supabase_api_privileges.py'
      - '.github/workflows/sinjira-future-sql-api-privileges-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/validate_new_supabase_api_privileges.py'
      - '.github/workflows/sinjira-future-sql-api-privileges-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-api:
    name: Contrôler les migrations SQL et les mutations dangereuses
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout et historique sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configurer Python épinglé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Contrôler la syntaxe du vérificateur
        run: python3 -m py_compile scripts/validate_new_supabase_api_privileges.py
      - name: Simuler tables, fonctions, séquences et vues dangereuses sans réseau
        run: python3 scripts/validate_new_supabase_api_privileges.py --self-test
      - name: Analyser les migrations ajoutées ou modifiées contre la base Git
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BASE_REF" =~ ^[a-fA-F0-9]{40}$ ]] || [[ "$BASE_REF" =~ ^0{40}$ ]]; then
            echo "::error::SHA base Git absent : contrôle refusé"
            exit 1
          fi
          python3 scripts/validate_new_supabase_api_privileges.py --base-ref "$BASE_REF"
