name: Vercel preview — smoke HTTP

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "URL exacte du déploiement Vercel (*.vercel.app)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke HTTP preview Vercel
    if: startsWith(github.ref, 'refs/heads/a1/web-release-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEPLOYMENT_URL: ${{ inputs.deployment_url }}
    steps:
      - name: Récupérer le dépôt sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Auto-tester le smoke HTTP
        run: python3 scripts/validate_web_release_http.py --self-test
      - name: Vérifier la preview Vercel
        run: python3 scripts/validate_web_release_http.py "$DEPLOYMENT_URL" --context preview-vercel --expected-sha "$GITHUB_SHA"
      - name: Résumer la preuve preview Vercel
        if: success()
        shell: bash
        run: |
          {
            echo "### Smoke HTTP — preview Vercel"
            echo "- Cible : $DEPLOYMENT_URL"
            echo "- Contexte : preview-vercel"
            echo "- SHA source attendu/publié : $GITHUB_SHA"
            echo "- Ref de validation : $GITHUB_REF"
            echo "- Verdict : **SUCCESS**"
            echo
            echo "> Cette preuve valide un staging isolé. Elle ne modifie ni DNS ni production officielle."
          } >> "$GITHUB_STEP_SUMMARY"
