name: Pages — diagnostic administratif sans publication

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pages-cutover-preflight.yml'
      - '.github/workflows/deploy-pages-controlled.yml'
      - 'scripts/report_pages_cutover_status.py'
      - 'scripts/report_pages_live_exposure.py'
      - 'scripts/validate_publication_live_boundary.py'
      - 'scripts/verify_pages_live.py'
      - 'scripts/attest_pages_production.py'
      - 'docs/PAGES_CONTROLLED_CUTOVER.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  pages-preflight:
    name: Lire Source Pages sans déploiement (rapport non bloquant)
    if: github.repository == 'M0rdr3x/BenoitCantin'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python figé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Vérifier les diagnostics et leurs cas négatifs
        run: python3 scripts/report_pages_cutover_status.py --self-test
      - name: Publier uniquement un rapport de configuration Pages en lecture seule
        env:
          GH_PAGES_READ_TOKEN: ${{ github.token }}
        run: python3 scripts/report_pages_cutover_status.py --report
      - name: Tester les refus HTTP sans réseau
        run: python3 scripts/report_pages_live_exposure.py --self-test
      - name: Observer uniquement les codes HEAD des sources techniques
        run: python3 scripts/report_pages_live_exposure.py --report
