name: SINJIRA V24.5.47 — Garde-fous advisor et CI

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Auto-tester le contrat advisor CI
        run: python scripts/validate_advisor_ci_workflow_security.py --self-test

      - name: Vérifier le contrat advisor CI
        run: python scripts/validate_advisor_ci_workflow_security.py

      - name: Vérifier les garde-fous V24.5.47
        run: python scripts/validate_advisor_ci_guardrails_v24_5_47.py

      - name: Vérifier le durcissement Auth V25
        run: python scripts/validate_auth_password_hardening_workflow.py
