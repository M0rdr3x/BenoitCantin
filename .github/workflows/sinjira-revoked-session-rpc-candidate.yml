name: Sécurité — sessions révoquées et RPC d'appareils SINJIRA

on:
  pull_request:
    branches: [main]
    paths:
      - 'security/candidates/sinjira_revoked_auth_session_device_rpcs.sql'
      - 'scripts/validate_revoked_session_rpc_candidate.py'
      - 'scripts/build_revoked_session_rpc_runtime_test.py'
      - 'scripts/smoke_revoked_session_http_local.py'
      - 'security/candidates/sinjira_revoked_auth_session_runtime_assertions.sql'
      - '.github/workflows/sinjira-revoked-session-rpc-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'security/candidates/sinjira_revoked_auth_session_device_rpcs.sql'
      - 'scripts/validate_revoked_session_rpc_candidate.py'
      - 'scripts/build_revoked_session_rpc_runtime_test.py'
      - 'scripts/smoke_revoked_session_http_local.py'
      - 'security/candidates/sinjira_revoked_auth_session_runtime_assertions.sql'
      - '.github/workflows/sinjira-revoked-session-rpc-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-revoked-sessions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python figé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Tester les mutations malveillantes de session
        run: python3 scripts/validate_revoked_session_rpc_candidate.py --self-test
      - name: Vérifier le candidat SQL sans connexion Supabase
        run: python3 scripts/validate_revoked_session_rpc_candidate.py

  local-runtime-revoked-sessions:
    name: Tester les sessions révoquées dans Supabase local (pgTAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout isolé
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python figé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Auto-tester l'assemblage SQL sans accès distant
        run: python3 scripts/build_revoked_session_rpc_runtime_test.py --self-test
      - name: Refuser tout endpoint distant dans le smoke JWT et contrôler les hypothèses
        run: python3 scripts/smoke_revoked_session_http_local.py --self-test
      - name: Installer Supabase CLI figée
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0
      - name: Démarrer la base Supabase de test locale
        run: supabase start
      - name: Exécuter 44 assertions pgTAP dont huit RPC avec rôle authenticated
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_revoked_session_rpc_runtime_test.py
          supabase test db supabase/tests/__sinjira_revoked_session_candidate_generated.test.sql --local
      - name: Prouver la révocation JWT via GoTrue et les huit RPC HTTP
        shell: bash
        run: |
          set -euo pipefail
          status_env="$(supabase status -o env)"
          API_URL="$(sed -n 's/^API_URL="\([^"]*\)"$/\1/p' <<< "$status_env" | head -n1)"
          ANON_KEY="$(sed -n 's/^ANON_KEY="\([^"]*\)"$/\1/p' <<< "$status_env" | head -n1)"
          test -n "$API_URL"
          test -n "$ANON_KEY"
          SINJIRA_LOCAL_API_URL="$API_URL" \
          SINJIRA_LOCAL_ANON_KEY="$ANON_KEY" \
          SINJIRA_LOCAL_SESSION_CANDIDATE_TEST=1 \
            python3 scripts/smoke_revoked_session_http_local.py
      - name: Fermer Supabase local et supprimer les données fictives
        if: always()
        run: supabase stop --no-backup || true
