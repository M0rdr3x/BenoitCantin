name: SINJIRA Emploi — liens HTTPS sécurisés

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/sinjira-employment-v25.js'
      - 'scripts/test_employment_source_url_boundary.cjs'
      - '.github/workflows/sinjira-employment-url-safety.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-employment-v25.js'
      - 'scripts/test_employment_source_url_boundary.cjs'
      - '.github/workflows/sinjira-employment-url-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  employment-url-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Node épinglé
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Vérifier la syntaxe du module et des tests
        run: |
          node --check assets/js/sinjira-employment-v25.js
          node --check scripts/test_employment_source_url_boundary.cjs
      - name: Vérifier le contrat HTTPS des liens Emploi
        run: node scripts/test_employment_source_url_boundary.cjs
