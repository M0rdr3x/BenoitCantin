name: SINJIRA — garde secrets Git

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-committed-secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Vérifier les fichiers suivis par Git
        run: python scripts/validate_no_committed_secrets.py
