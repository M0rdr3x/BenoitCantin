name: SINJIRA — garde secrets Git

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-committed-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Auto-tester le contrat du garde secrets
        run: python scripts/validate_secret_guard_workflow_security.py --self-test
      - name: Vérifier le contrat du garde secrets
        run: python scripts/validate_secret_guard_workflow_security.py
      - name: Tester le garde sécurité de tous les workflows GitHub
        run: python scripts/validate_repo_workflow_security.py --self-test
      - name: Refuser les déclencheurs privilégiés et actions mobiles dans tous les workflows
        run: python scripts/validate_repo_workflow_security.py
      - name: Prouver le scan exhaustif avec les cas négatifs synthétiques
        run: python scripts/validate_no_committed_secrets.py --self-test
      - name: Rejeter les corps administrateur trop volumineux, avant allocation
        run: node --test tests/test_admin_request_body_bounds.cjs
      - name: Refuser les flux HTTP lents ou micro-fragmentés des API AAL2
        run: node --test tests/test_sensitive_edge_stream_limits.cjs
      - name: Refuser les en-têtes géographiques falsifiables dans les API privées
        run: node --test tests/test_untrusted_geo_headers.cjs
      - name: Refuser les clés d'appareil prévisibles et les connexions sans contrôle de risque
        run: node --test tests/test_login_device_entropy_and_risk.cjs
      - name: Tester le téléchargement borné des modèles PDF distants
        run: node --test tests/test_edge_remote_pdf_stream.cjs
      - name: Valider les frontières PDF, JWT et les contrats historiques
        run: |
          python scripts/validate_send_game_report_security.py --self-test
          python scripts/validate_send_game_report_security.py
          python scripts/validate_send_player_sheet_security.py --self-test
          python scripts/validate_send_player_sheet_security.py
          python scripts/validate_edge_template_fetch_v24_5_49.py
          python scripts/validate_edge_function_inventory.py
      - name: Refuser les PDF sortants illimités et courriels fermés coûteux
        run: |
          python scripts/validate_edge_pdf_output_budget.py --self-test
          python scripts/validate_edge_pdf_output_budget.py
          node --test tests/test_edge_pdf_output_budget.cjs
      - name: Exiger un second facteur AAL2 pour les 7 API administrateur
        run: |
          python scripts/validate_admin_mfa_v24_4_67.py
          node --test tests/test_admin_mfa_policy.cjs
      - name: Interdire les nouvelles fonctions Edge publiques sans authentification vérifiée
        run: |
          python scripts/validate_edge_jwt_boundaries.py --self-test
          python scripts/validate_edge_jwt_boundaries.py
      - name: Empêcher les journaux privés de révéler les erreurs Supabase et Storage
        run: node --test tests/test_edge_error_log_redaction.cjs
      - name: Vérifier tous les fichiers suivis par Git, y compris les gros et binaires
        run: python scripts/validate_no_committed_secrets.py
