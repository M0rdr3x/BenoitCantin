name: SINJIRA — garde secrets Git

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-committed-secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Auto-tester le contrat du garde secrets
        run: python scripts/validate_secret_guard_workflow_security.py --self-test
      - name: Vérifier le contrat du garde secrets
        run: python scripts/validate_secret_guard_workflow_security.py
      - name: Vérifier les fichiers suivis par Git
        run: python scripts/validate_no_committed_secrets.py
