name: SINJIRA — garde secrets Git

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-committed-secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Vérifier Python 3.12 préinstallé
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), "Python 3.12 requis"'
      - name: Auto-tester le contrat du garde secrets
        run: python3 scripts/validate_secret_guard_workflow_security.py --self-test
      - name: Vérifier le contrat du garde secrets
        run: python3 scripts/validate_secret_guard_workflow_security.py
      - name: Auto-tester les motifs de secrets et les refus de fichiers illisibles
        run: python3 -m unittest scripts.test_secret_guard_patterns
      - name: Vérifier les fichiers suivis par Git
        run: python3 scripts/validate_no_committed_secrets.py
