name: Pages — déploiement isolé explicitement approuvé

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "DRY_RUN construit seulement; PUBLISH demande un déploiement explicitement confirmé"
        required: true
        type: choice
        options:
          - DRY_RUN
          - PUBLISH
        default: DRY_RUN
      confirm_actions_source:
        description: "Avant PUBLISH, Pages Settings doit utiliser GitHub Actions (pas Deploy from a branch)"
        required: true
        type: choice
        options:
          - NOT_CONFIRMED
          - ACTIONS_ONLY
        default: NOT_CONFIRMED
      expected_sha:
        description: "SHA complet (40 caractères) du commit main approuvé"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-production-controlled
  cancel-in-progress: false

jobs:
  artifact:
    name: Construire, auditer et téléverser uniquement _site
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout sans persistance des credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Vérifier SHA, source Pages et consentement explicite
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          SOURCE: ${{ inputs.confirm_actions_source }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_sha invalide"; exit 1; }
          test "$EXPECTED_SHA" = "$GITHUB_SHA" || { echo "::error::HEAD main a changé"; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || exit 1
          if [[ "$MODE" == "PUBLISH" ]]; then
            test "$SOURCE" = "ACTIONS_ONLY" || { echo "::error::Configurer Settings > Pages > GitHub Actions avant publication"; exit 1; }
          fi
          test "$MODE" = "DRY_RUN" || test "$MODE" = "PUBLISH"
          test ! -e .nojekyll
          test -f _config.yml
          test -f scripts/audit_pages_jekyll.py

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Attester Pages ET la fraîcheur de main avant le build
        if: ${{ inputs.mode == 'PUBLISH' }}
        env:
          GH_PAGES_READ_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/attest_pages_production.py --check

      - name: Vérifier le contrat Pages et ses auto-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_pages_jekyll.py --self-test
          python3 scripts/audit_pages_jekyll.py --source .
          python3 scripts/validate_nova_public_access.py --self-test
          python3 scripts/validate_nova_public_access.py --source .
          python3 scripts/validate_nova_public_results.py --self-test
          python3 scripts/validate_nova_public_results.py --source .
          python3 scripts/verify_pages_live.py --self-test
          python3 scripts/verify_pages_integrity.py --self-test
          python3 scripts/attest_pages_production.py --self-test
          python3 scripts/validate_publication_watch_workflow.py --self-test
          python3 scripts/validate_publication_watch_workflow.py --check
          python3 scripts/audit_public_documents.py --self-test
          python3 scripts/audit_public_documents.py --source .
          python3 scripts/audit_public_json.py --self-test
          python3 scripts/audit_public_json.py --source .
          python3 scripts/audit_public_csv.py --self-test
          python3 scripts/audit_public_csv.py --source .
          python3 scripts/audit_public_surface.py --self-test
          python3 scripts/audit_pages_secrets.py --self-test
          python3 scripts/pages_release_proof.py --self-test
          python3 scripts/verify_pages_tar_archive.py --self-test
          python3 scripts/audit_pwa_precache.py --self-test
          python3 scripts/audit_pwa_precache.py --source .
          python3 scripts/validate_sinjira_public_links.py --self-test
          node --test tests/test_sinjira_library_access.cjs
          node --test tests/test_document_url_authorization.cjs
          node --test tests/test_novel_file_authorization.cjs
          python3 scripts/validate_get_private_book_url_security.py --self-test
          node --test tests/test_private_book_authorization.cjs
          python3 scripts/validate_boussole_home_visual.py --self-test
          python3 scripts/audit_public_surface.py --source .

      - name: Construire Jekyll — pas la racine technique du dépôt
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_site

      - name: Permettre au runner de créer le reçu dans le build Jekyll
        shell: bash
        run: |
          set -euo pipefail
          test -d _site
          test ! -L _site
          sudo chown "$(id -u):$(id -g)" _site
          if test -d _site/.well-known; then
            test ! -L _site/.well-known
            sudo chown "$(id -u):$(id -g)" _site/.well-known
          fi

      - name: Marquer le build avec le SHA et l'identifiant du workflow
        shell: bash
        run: python3 scripts/pages_release_proof.py --write _site --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"

      - name: Refuser toute fuite de code et toute perte de route
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_pages_jekyll.py --source . --built _site
          python3 scripts/validate_nova_public_access.py --source . --built _site
          python3 scripts/validate_nova_public_results.py --source . --built _site
          python3 scripts/validate_sinjira_public_links.py --check
          python3 scripts/validate_sinjira_catalogues_metadata.py --built _site
          node --test tests/test_sinjira_library_access.cjs
          node --test tests/test_document_url_authorization.cjs
          node --test tests/test_novel_file_authorization.cjs
          python3 scripts/validate_get_private_book_url_security.py
          node --test tests/test_private_book_authorization.cjs
          python3 scripts/validate_boussole_home_visual.py --built _site
          python3 scripts/audit_public_documents.py --source . --built _site
          python3 scripts/audit_public_json.py --source . --built _site --release-sha "$GITHUB_SHA" --release-run-id "$GITHUB_RUN_ID"
          python3 scripts/audit_public_csv.py --source . --built _site
          python3 scripts/audit_public_surface.py --source . --built _site --release-sha "$GITHUB_SHA" --release-run-id "$GITHUB_RUN_ID"
          python3 scripts/audit_pwa_precache.py --source . --built _site
          python3 scripts/pages_release_proof.py --verify _site --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          python3 scripts/verify_pages_tar_archive.py --built _site --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          python3 scripts/audit_pages_secrets.py --built _site
          test -f _site/CNAME
          test ! -e _site/.nojekyll
          test ! -e _site/supabase
          test ! -e _site/mobile-native
          test ! -e _site/tests
          test ! -e _site/scripts
          test ! -e _site/docs
          test ! -e _site/.github

      - name: Téléverser uniquement l’artefact vérifié, et seulement en mode PUBLISH
        if: ${{ inputs.mode == 'PUBLISH' && inputs.confirm_actions_source == 'ACTIONS_ONLY' }}
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae
        with:
          path: _site
          # L'action epinglee 98ef48e (2026) accepte reellement ce parametre.
          # Audits de l'artefact + symlinks executes avant inclusion de .well-known.
          include-hidden-files: 'true'

      - name: Tracer l'origine du publish
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' '## Pages — préparation sans accès à la racine technique'
            printf '%s\n' "- Source commit : $GITHUB_SHA"
            printf '%s\n' "- Mode : $MODE"
            printf '%s\n' '- Répertoire upload-pages-artifact : _site (jamais la racine)'
            printf '%s\n' '- DRY_RUN : build et audits uniquement, aucun artefact Pages téléversé'
            printf '%s\n' '- PUBLISH : artefact téléversé seulement après contrôles, puis déploiement'
            printf '%s\n' '- Une publication exige PUBLISH + ACTIONS_ONLY + SHA exact'
            printf '%s\n' '- Aucun changement DNS et aucune activation de service externe'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publier uniquement après consentement explicite
    needs: artifact
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'PUBLISH' && inputs.confirm_actions_source == 'ACTIONS_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Checkout du commit approuvé après validation de l'environnement
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Revérifier Pages et HEAD main immédiatement avant le déploiement
        env:
          GH_PAGES_READ_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/attest_pages_production.py --check
      - name: Déployer l'artefact contrôlé
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  verify-live:
    name: Attendre la propagation CDN et refuser toute fuite technique
    needs: deploy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'PUBLISH' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout pour le validateur HTTP (sans credentials)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Attendre le reçu SHA/run réel puis vérifier les routes et refus techniques
        run: python3 scripts/verify_pages_live.py --check --release-sha "$GITHUB_SHA" --release-run-id "$GITHUB_RUN_ID" --await-release
      - name: Confirmer les octets CDN des 28 ressources critiques dans le budget borné
        run: python3 scripts/verify_pages_integrity.py --check --expected-sha "$GITHUB_SHA"
