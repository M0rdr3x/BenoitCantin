name: TEMP — Rechaînage intentions natives

on:
  push:
    branches:
      - sinjira-v25-native-intent-routing
    paths:
      - '.github/workflows/tmp-rechain-native-intent-routing.yml'

permissions:
  contents: write

jobs:
  apply-rechain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Appliquer le rechaînage borné
        run: python3 scripts/.tmp_rechain_native_intent_routing.py

      - name: Vérifier le diff
        run: git diff --check

      - name: Committer les deux fichiers centraux
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/sinjira-mobile-native-route-dispatch-v25.yml mobile-native/NATIVE_ROUTE_DISPATCH_V25.md
          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "V25 — Rechaîner le routage des intentions natives"
          git push
