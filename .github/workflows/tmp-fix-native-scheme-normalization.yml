name: TEMP — Normalisation liens SINJIRA

on:
  push:
    branches:
      - sinjira-v25-native-intent-routing
    paths:
      - '.github/workflows/tmp-fix-native-scheme-normalization.yml'
      - 'scripts/.tmp_fix_native_scheme_normalization.py'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Appliquer la correction bornée
        run: python3 scripts/.tmp_fix_native_scheme_normalization.py

      - name: Vérifier le diff
        run: git diff --check

      - name: Valider le routage corrigé
        run: python3 scripts/validate_mobile_native_intent_routing_v25.py

      - name: Committer la correction et retirer les outils temporaires
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V25 — Normaliser les liens sinjira entrants"
          git push
