name: Sécurité SINJIRA — redirections communauté et notifications

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/sinjira-social-navigation-guard.mjs'
      - 'assets/js/sinjira-community-rules.js'
      - 'assets/js/sinjira-user-notifications-v24-4-63.js'
      - 'compte/regles-communaute.html'
      - 'compte/notifications.html'
      - 'compte/index.html'
      - 'scripts/test_sinjira_social_navigation_boundary.cjs'
      - 'scripts/validate_user_notifications_v24_4_63.py'
      - 'scripts/validate_social_reply_notifications_v24_4_73.py'
      - '.github/workflows/sinjira-social-navigation-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-social-navigation-guard.mjs'
      - 'assets/js/sinjira-community-rules.js'
      - 'assets/js/sinjira-user-notifications-v24-4-63.js'
      - 'compte/regles-communaute.html'
      - 'compte/notifications.html'
      - 'compte/index.html'
      - 'scripts/test_sinjira_social_navigation_boundary.cjs'
      - 'scripts/validate_user_notifications_v24_4_63.py'
      - 'scripts/validate_social_reply_notifications_v24_4_73.py'
      - '.github/workflows/sinjira-social-navigation-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  social-navigation:
    name: Refuser les redirections de consentement et avis malveillantes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans jeton persistant
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Node épinglé
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Vérifier la syntaxe du garde et des modules
        run: |
          node --check assets/js/sinjira-social-navigation-guard.mjs
          node --check assets/js/sinjira-community-rules.js
          node --check assets/js/sinjira-user-notifications-v24-4-63.js
          node --check scripts/test_sinjira_social_navigation_boundary.cjs
      - name: Tester les destinations et les rendus réels
        run: node scripts/test_sinjira_social_navigation_boundary.cjs
      - name: Garantir les permissions minimales des notifications
        run: python3 scripts/validate_user_notifications_v24_4_63.py
      - name: Vérifier les contrats de modération communautaire
        run: python3 scripts/validate_community_safety_v24_4_79.py
      - name: Vérifier les notifications de réponses sociales
        run: python3 scripts/validate_social_reply_notifications_v24_4_73.py
