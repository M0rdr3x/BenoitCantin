name: Projet Nova P50H - habilitations (sans publication)
on:
  pull_request:
    paths:
      - "projets/projet-nova/controles/P50H_*"
      - "scripts/audit_nova_habilitations_p50h.py"
      - "scripts/tests/test_audit_nova_habilitations_p50h.py"
      - ".github/workflows/validate-nova-p50h.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle-documentaire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compilation et tests en lecture seule
        run: |
          python -m py_compile scripts/audit_nova_habilitations_p50h.py
          python -m unittest discover -s scripts/tests -p 'test_audit_nova_habilitations_p50h.py' -v
      - name: Vérification de structure du modèle public — sortie toujours NO_GO
        run: |
          python scripts/audit_nova_habilitations_p50h.py
