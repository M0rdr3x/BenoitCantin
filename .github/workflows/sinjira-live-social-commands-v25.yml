name: SINJIRA V25 — Commandes typées En direct

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/production-migration-ledger.txt'
      - 'supabase/migrations/**'
      - 'supabase/tests/live_social_typed_commands_v25.test.sql'
      - 'supabase/tests/live_social_foundation_v25.test.sql'
      - 'supabase/tests/live_social_moderation_v25.test.sql'
      - 'supabase/tests/live_social_private_invites_v25.test.sql'
      - 'supabase/tests/security_advisor_contract_v24_5_24.test.sql'
      - 'scripts/validate_live_social_typed_commands_v25.py'
      - 'scripts/validate_live_social_foundation_v25.py'
      - 'scripts/validate_live_social_safety_v25.py'
      - 'scripts/validate_supabase.py'
      - 'scripts/validate_production_migration_ledger.py'
      - 'scripts/validate_production_schema_manifest.py'
      - 'scripts/validate_live_social_commands_workflow_security.py'
      - '.github/workflows/sinjira-live-social-commands-v25.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/production-migration-ledger.txt'
      - 'supabase/migrations/**'
      - 'supabase/tests/live_social_typed_commands_v25.test.sql'
      - 'supabase/tests/live_social_foundation_v25.test.sql'
      - 'supabase/tests/live_social_moderation_v25.test.sql'
      - 'supabase/tests/live_social_private_invites_v25.test.sql'
      - 'supabase/tests/security_advisor_contract_v24_5_24.test.sql'
      - 'scripts/validate_live_social_typed_commands_v25.py'
      - 'scripts/validate_live_social_foundation_v25.py'
      - 'scripts/validate_live_social_safety_v25.py'
      - 'scripts/validate_supabase.py'
      - 'scripts/validate_production_migration_ledger.py'
      - 'scripts/validate_production_schema_manifest.py'
      - 'scripts/validate_live_social_commands_workflow_security.py'
      - '.github/workflows/sinjira-live-social-commands-v25.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-social-commands:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false

      - name: Auto-tester le contrat CI commandes En direct
        run: python scripts/validate_live_social_commands_workflow_security.py --self-test

      - name: Vérifier le contrat CI commandes En direct
        run: python scripts/validate_live_social_commands_workflow_security.py

      - name: Contrats statiques commandes En direct
        run: |
          python scripts/validate_live_social_typed_commands_v25.py
          python scripts/validate_live_social_foundation_v25.py
          python scripts/validate_live_social_safety_v25.py
          python scripts/validate_supabase.py
          python scripts/validate_production_migration_ledger.py
          python scripts/validate_production_schema_manifest.py

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0

      - name: Démarrer Supabase local complet
        run: supabase start

      - name: Tester les commandes typées avec pgTAP
        run: supabase test db supabase/tests/live_social_typed_commands_v25.test.sql --local

      - name: Rejouer la fondation En direct
        run: supabase test db supabase/tests/live_social_foundation_v25.test.sql --local

      - name: Rejouer la sécurité En direct
        run: |
          supabase test db supabase/tests/live_social_moderation_v25.test.sql --local
          supabase test db supabase/tests/live_social_private_invites_v25.test.sql --local

      - name: Rejouer la frontière advisor sécurité
        run: supabase test db supabase/tests/security_advisor_contract_v24_5_24.test.sql --local

      - name: Arrêter Supabase local
        if: always()
        run: supabase stop --no-backup || true
