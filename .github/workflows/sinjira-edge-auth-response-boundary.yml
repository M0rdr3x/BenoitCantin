name: Sécurité Edge — décisions Auth et Admin

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/auth.ts'
      - 'scripts/test_sinjira_edge_auth_response_boundary.cjs'
      - '.github/workflows/sinjira-edge-auth-response-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/auth.ts'
      - 'scripts/test_sinjira_edge_auth_response_boundary.cjs'
      - '.github/workflows/sinjira-edge-auth-response-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-auth-response-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans jeton persistant
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Node épinglé
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Tester les réponses Auth et Admin sans accès distant
        run: node scripts/test_sinjira_edge_auth_response_boundary.cjs
