name: SINJIRA V24.5.39 — Feuille logistique imprimable locale

on:
  pull_request:
    paths:
      - 'assets/js/sinjira-admin-preorder-workflow-v24-5-36.js'
      - 'PREORDER_LOGISTICS_PRINT_V24_5_39.md'
      - 'scripts/validate_preorder_logistics_print_v24_5_39.py'
      - 'supabase/production-migration-ledger.txt'
      - '.github/workflows/sinjira-preorder-logistics-print-v24-5-39.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider V24.5.39
        run: python3 scripts/validate_preorder_logistics_print_v24_5_39.py
      - name: Valider le ledger production inchangé
        run: python3 scripts/validate_production_migration_ledger.py
