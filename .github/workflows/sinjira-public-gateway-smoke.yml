name: SINJIRA — preuve HTTP publique Registre, JWT et Auth

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/test_sinjira_public_gateway_smoke.py'
      - '.github/workflows/sinjira-public-gateway-smoke.yml'
      - 'docs/SINJIRA_PUBLIC_GATEWAY_SMOKE_20261108.md'
  push:
    branches: [main]
    paths:
      - 'scripts/test_sinjira_public_gateway_smoke.py'
      - '.github/workflows/sinjira-public-gateway-smoke.yml'
      - 'docs/SINJIRA_PUBLIC_GATEWAY_SMOKE_20261108.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke:
    name: Pages en ligne et refus JWT sans compte
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout du code sans persister les identifiants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python épinglé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Tester les erreurs prévues et le contrat de confidentialité
        run: |
          python3 -m py_compile scripts/test_sinjira_public_gateway_smoke.py
          python3 scripts/test_sinjira_public_gateway_smoke.py --self-test
      - name: Vérifier le site et les protections JWT en production
        run: python3 scripts/test_sinjira_public_gateway_smoke.py --public
