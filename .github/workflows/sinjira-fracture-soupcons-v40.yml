name: SINJIRA — Fracture soupçons par humain V40
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'assets/js/sinjira-fracture-soupcons-v40.mjs'
      - 'tests/games/test_fracture_soupcons_v40.mjs'
      - 'docs/SINJIRA_FRACTURE_SOUPCONS_V40.md'
      - '.github/workflows/sinjira-fracture-soupcons-v40.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-fracture-soupcons-v40.mjs'
      - 'tests/games/test_fracture_soupcons_v40.mjs'
      - 'docs/SINJIRA_FRACTURE_SOUPCONS_V40.md'
      - '.github/workflows/sinjira-fracture-soupcons-v40.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sinjira-fracture-soupcons-v40-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Interdiction par joueur, politique explicite et non-divulgation
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Récupérer le code sans conserver les identifiants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Node vérifié
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Tester V36, V38, V39 et V40 sur les véritables fichiers
        run: |
          node --check assets/js/sinjira-fracture-soupcons-v40.mjs
          node --test tests/games/test_fracture_mechanics_v36.mjs tests/games/test_fracture_accusations_v38.mjs tests/games/test_fracture_soupcons_v39.mjs tests/games/test_fracture_soupcons_v40.mjs
      - name: Préserver la confidentialité V36
        run: python3 scripts/validate_fracture_mechanics_v36.py
