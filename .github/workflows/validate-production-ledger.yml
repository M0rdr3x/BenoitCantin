name: Validation du ledger Supabase production

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/production-migration-ledger.txt'
      - 'supabase/production-reviewed-migration-batch.txt'
      - 'docs/SUPABASE_PRODUCTION_RUNBOOK.md'
      - 'scripts/build_supabase_production_workspace.py'
      - 'scripts/test_production_reviewed_migration_batch.py'
      - 'scripts/validate_production_migration_ledger.py'
      - 'scripts/validate_production_schema_manifest.py'
      - 'scripts/validate_supabase_production_preflight_security.py'
      - 'scripts/test_supabase_production_preflight_security.py'
      - 'scripts/validate_production_migration_workflow_security.py'
      - 'scripts/test_production_migration_workflow_security.py'
      - 'scripts/validate_production_migration_history_workflow_security.py'
      - '.github/workflows/supabase-production-preflight.yml'
      - '.github/workflows/supabase-production-safe.yml'
      - '.github/workflows/sinjira-production-migration-history-guard-v25.yml'
      - '.github/workflows/validate-production-ledger.yml'
  push:
    branches: [ main ]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/production-migration-ledger.txt'
      - 'supabase/production-reviewed-migration-batch.txt'
      - 'docs/SUPABASE_PRODUCTION_RUNBOOK.md'
      - 'scripts/build_supabase_production_workspace.py'
      - 'scripts/test_production_reviewed_migration_batch.py'
      - 'scripts/validate_production_migration_ledger.py'
      - 'scripts/validate_production_schema_manifest.py'
      - 'scripts/validate_supabase_production_preflight_security.py'
      - 'scripts/test_supabase_production_preflight_security.py'
      - 'scripts/validate_production_migration_workflow_security.py'
      - 'scripts/test_production_migration_workflow_security.py'
      - 'scripts/validate_production_migration_history_workflow_security.py'
      - '.github/workflows/supabase-production-preflight.yml'
      - '.github/workflows/supabase-production-safe.yml'
      - '.github/workflows/sinjira-production-migration-history-guard-v25.yml'
      - '.github/workflows/validate-production-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ledger:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Prouver l'intégrité dédiée du garde historique migrations
        run: python scripts/validate_production_migration_history_workflow_security.py --self-test
      - name: Vérifier l'intégrité dédiée du garde historique migrations
        run: python scripts/validate_production_migration_history_workflow_security.py
      - name: Prouver l'intégrité des workflows de garde migrations
        run: python scripts/test_production_migration_workflow_security.py
      - name: Vérifier l'intégrité des workflows de garde migrations
        run: python scripts/validate_production_migration_workflow_security.py
      - name: Prouver que le lot de migrations revu échoue en fermeture sûre
        run: python scripts/test_production_reviewed_migration_batch.py
      - name: Prouver le cloisonnement du préflight Supabase production
        run: python scripts/test_supabase_production_preflight_security.py
      - name: Vérifier le contrat sécurité du préflight Supabase production
        run: python scripts/validate_supabase_production_preflight_security.py
      - name: Vérifier la reconstruction des tables production
        run: python scripts/validate_production_schema_manifest.py
      - name: Vérifier le ledger, le lot revu, le runbook et la voie production unique
        run: python scripts/validate_production_migration_ledger.py
