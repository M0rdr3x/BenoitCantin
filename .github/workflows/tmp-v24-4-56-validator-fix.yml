name: Temp V24.4.56 validator fix

on:
  push:
    branches:
      - v24-4-56-owner-role-invoker

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v24-4-56-owner-role-invoker
          fetch-depth: 0

      - name: Corriger les validateurs V24.4.56
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/validate_security_contract.py')
          text = path.read_text(encoding='utf-8')

          old_helper = '''def require_latest_function_contract(
              errors: list[str], all_sql: str, name: str, markers: tuple[str, ...]
          ) -> None:
              definition = latest_function(all_sql, name)
              if not definition:
                  fail(errors, f"Fonction de sécurité introuvable: {name}.")
                  return
              normalized = compact(definition)
              if "securitydefiner" not in normalized:
                  fail(errors, f"{name}: SECURITY DEFINER attendu par le contrat actuel.")
              if "setsearch_path=public,auth" not in normalized:
                  fail(errors, f"{name}: search_path explicite public,auth absent.")
              for marker in markers:
                  if compact(marker) not in normalized:
                      fail(errors, f"{name}: garde d'autorisation manquante: {marker}.")
          '''

          new_helper = '''def require_latest_function_contract(
              errors: list[str], all_sql: str, name: str, markers: tuple[str, ...]
          ) -> None:
              definition = latest_function(all_sql, name)
              if not definition:
                  fail(errors, f"Fonction de sécurité introuvable: {name}.")
                  return
              normalized = compact(definition)
              if "securitydefiner" not in normalized:
                  fail(errors, f"{name}: SECURITY DEFINER attendu par le contrat actuel.")
              if "setsearch_path=public,auth" not in normalized:
                  fail(errors, f"{name}: search_path explicite public,auth absent.")
              for marker in markers:
                  if compact(marker) not in normalized:
                      fail(errors, f"{name}: garde d'autorisation manquante: {marker}.")


          def require_latest_invoker_role_contract(
              errors: list[str], all_sql: str, name: str, markers: tuple[str, ...]
          ) -> None:
              definition = latest_function(all_sql, name)
              if not definition:
                  fail(errors, f"Fonction de rôle introuvable: {name}.")
                  return
              normalized = compact(definition)
              if "securityinvoker" not in normalized:
                  fail(errors, f"{name}: SECURITY INVOKER attendu depuis V24.4.56.")
              if "securitydefiner" in normalized:
                  fail(errors, f"{name}: SECURITY DEFINER ne doit plus être utilisé depuis V24.4.56.")
              if "setsearch_path=public,auth,pg_temp" not in normalized:
                  fail(errors, f"{name}: search_path explicite public,auth,pg_temp absent.")
              for marker in markers:
                  if compact(marker) not in normalized:
                      fail(errors, f"{name}: garde de rôle manquante: {marker}.")
          '''

          if old_helper not in text:
              raise SystemExit('Bloc helper attendu introuvable; arrêt sans modifier le fichier.')
          text = text.replace(old_helper, new_helper, 1)

          old_calls = '''    # Contrats de self-scope SECURITY DEFINER. Les avertissements du Security Advisor
              # sont génériques; ces gardes empêchent un navigateur authentifié d'interroger
              # l'état d'un UUID arbitraire en profitant des privilèges du propriétaire de fonction.
              require_latest_function_contract(
                  errors, all_sql, "is_sinjira_admin",
                  ("p_user_id=auth.uid()", "auth.jwt()->>'role'", "'service_role'", "else false"),
              )
              require_latest_function_contract(
                  errors, all_sql, "is_sinjira_owner",
                  ("p_user_id=auth.uid()", "auth.jwt()->>'role'", "'service_role'", "kingtyrano@gmail.com"),
              )
          '''

          new_calls = '''    # V24.4.56 : les vérifications de rôle utilisent désormais SECURITY INVOKER + RLS self-only.
              # Le navigateur ne lit que sa propre ligne internal_admin_users; service_role conserve
              # le chemin serveur nécessaire aux Edge Functions.
              require_latest_invoker_role_contract(
                  errors, all_sql, "is_sinjira_admin",
                  ("p_user_id=(select auth.uid())", "auth.jwt()->>'role'", "'service_role'", "internal_admin_users"),
              )
              require_latest_invoker_role_contract(
                  errors, all_sql, "is_sinjira_owner",
                  ("p_user_id=(select auth.uid())", "auth.jwt()->>'role'", "'service_role'", "a.role='owner'"),
              )
          '''

          if old_calls not in text:
              raise SystemExit('Bloc appels rôle attendu introuvable; arrêt sans modifier le fichier.')
          text = text.replace(old_calls, new_calls, 1)

          text = text.replace(
              'f"état joueur assaini, self-scope SECURITY DEFINER et diagnostics {VERSION}/{SENSITIVE_ACL_VERSION} protégés."',
              'f"état joueur assaini, rôles owner/admin SECURITY INVOKER + RLS self-only, autres self-scopes privilégiés contrôlés et diagnostics {VERSION}/{SENSITIVE_ACL_VERSION} protégés."',
              1,
          )
          path.write_text(text, encoding='utf-8')

          owner = Path('scripts/validate_owner_role_invoker.py')
          owner_text = owner.read_text(encoding='utf-8')
          anchor = "    need(\"role in ('owner','admin')\" in sql,'élément rôle propriétaire absent: role in owner/admin')\n" if "élément rôle propriétaire absent: role in owner/admin" in owner_text else ""
          if not anchor:
              anchor = "    need(sql.count('security invoker') >= 3,'fonctions rôle/health non SECURITY INVOKER')\n"
              addition = "    need(\"lower(coalesce(u.email,''))='kingtyrano@gmail.com'\" in sql,'le rôle owner n’est pas explicitement rattaché au compte propriétaire attendu')\n"
              if addition not in owner_text:
                  owner_text = owner_text.replace(anchor, addition + anchor, 1)
          owner.write_text(owner_text, encoding='utf-8')

      - name: Vérifier les validateurs corrigés
        run: |
          python scripts/validate_owner_role_invoker.py
          python scripts/validate_security_contract.py

      - name: Committer le correctif et retirer ce workflow temporaire
        run: |
          rm .github/workflows/tmp-v24-4-56-validator-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_security_contract.py scripts/validate_owner_role_invoker.py .github/workflows/tmp-v24-4-56-validator-fix.yml
          git commit -m "V24.4.56 — aligne les validateurs sur SECURITY INVOKER"
          git push origin HEAD:v24-4-56-owner-role-invoker
