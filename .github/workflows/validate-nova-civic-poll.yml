name: NOVA sondage et boussole — vérification

on:
  pull_request:
    branches: [main]
    paths:
      - 'projets/projet-nova/index.html'
      - 'projets/projet-nova/boussole-electorale.html'
      - 'projets/projet-nova/sondage-citoyen.html'
      - 'projets/projet-nova/assets/boussole-electorale.js'
      - 'projets/projet-nova/assets/boussole-electorale.css'
      - 'projets/projet-nova/assets/sondage-citoyen.js'
      - 'projets/projet-nova/assets/sondage-citoyen.css'
      - 'projets/projet-nova/data/*'
      - 'supabase/NOVA_POLL_SCHEMA_PREDEPLOY.sql'
      - 'supabase/functions/nova-civic-poll/**'
      - 'supabase/config.toml'
      - 'netlify.toml'
      - 'vercel.json'
      - 'projets/projet-nova/netlify.toml'
      - 'scripts/test_nova_civic_poll.py'
      - 'scripts/test_nova_boussole_runtime.cjs'
      - 'scripts/smoke_nova_poll_edge.py'
      - 'scripts/validate_nova_release_artifact.py'
      - 'scripts/build_netlify_public.py'
      - 'scripts/normalize_nova_seo.py'
      - 'scripts/check_nova_a1.py'
      - 'scripts/validate_seo_quality.py'
      - '.github/workflows/validate-nova-civic-poll.yml'
  push:
    branches: [main]
    paths:
      - 'projets/projet-nova/**'
      - 'supabase/NOVA_POLL_SCHEMA_PREDEPLOY.sql'
      - 'supabase/functions/nova-civic-poll/**'
      - 'scripts/test_nova_civic_poll.py'
permissions:
  contents: read
jobs:
  test-nova:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Vérifier les invariants et la syntaxe
        run: python scripts/test_nova_civic_poll.py
      - name: Configurer Node pour les tests du moteur
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
      - name: Tester le calcul et la carte de la boussole
        run: node scripts/test_nova_boussole_runtime.cjs
      - name: Vérifier le service public sans envoyer de vote
        run: python scripts/smoke_nova_poll_edge.py
      - name: Construire l'artefact public isolé
        env:
          SINJIRA_RELEASE_SHA: ${{ github.sha }}
        run: python scripts/build_netlify_public.py --output _site --standalone-netlify
      - name: Valider les liens et les ressources NOVA réellement publiables
        run: python scripts/validate_nova_release_artifact.py _site
      - name: Vérifier les liens et les fichiers du site
        run: python scripts/validate_site.py
