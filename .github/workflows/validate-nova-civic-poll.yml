name: NOVA sondage et boussole — vérification

on:
  pull_request:
    branches: [main]
    paths:
      - 'projets/projet-nova/index.html'
      - 'projets/projet-nova/boussole-electorale.html'
      - 'projets/projet-nova/sondage-citoyen.html'
      - 'projets/projet-nova/sondages-a-valider.html'
      - 'docs/nova-sondages/**'
      - 'scripts/test_nova_candidate_questionnaires.py'
      - 'projets/projet-nova/assets/boussole-electorale.js'
      - 'projets/projet-nova/assets/boussole-electorale.css'
      - 'projets/projet-nova/assets/sondage-citoyen.js'
      - 'projets/projet-nova/assets/nova-civic-integrity.js'
      - 'projets/projet-nova/assets/sondage-citoyen.css'
      - 'projets/projet-nova/assets/sondage-citoyen.svg'
      - 'projets/projet-nova/assets/sondage-public-corpus.js'
      - 'projets/projet-nova/assets/boussole-public-corpus.js'
      - 'projets/projet-nova/data/*'
      - 'supabase/NOVA_POLL_SCHEMA_PREDEPLOY.sql'
      - 'supabase/functions/nova-civic-poll/**'
      - 'supabase/config.toml'
      - 'netlify.toml'
      - 'vercel.json'
      - 'projets/projet-nova/netlify.toml'
      - 'scripts/test_nova_civic_poll.py'
      - 'scripts/test_nova_poll_delta_privacy.py'
      - 'scripts/test_nova_public_bundles.py'
      - 'scripts/validate_jekyll_emergency_pages.py'
      - 'scripts/test_nova_boussole_runtime.cjs'
      - 'scripts/test_nova_evidence_retry.cjs'
      - 'scripts/test_nova_boussole_navigation.cjs'
      - 'projets/projet-nova/tests/nova-civic-readiness.test.mjs'
      - 'scripts/test_nova_boussole_network.cjs'
      - 'scripts/test_nova_poll_runtime.cjs'
      - 'scripts/test_nova_civic_integrity.cjs'
      - 'scripts/test_nova_poll_network.cjs'
      - 'scripts/test_nova_poll_body_read.cjs'
      - 'scripts/test_nova_poll_refresh.cjs'
      - 'scripts/test_nova_poll_recovery.cjs'
      - 'scripts/test_nova_edge_snapshot.cjs'
      - 'scripts/test_nova_edge_canonical_questions.cjs'
      - 'scripts/test_nova_edge_explicit_consent.cjs'
      - 'scripts/smoke_nova_poll_edge.py'
      - 'scripts/smoke_nova_live_public.py'
      - 'scripts/smoke_nova_live_compass_browser.py'
      - '.github/workflows/nova-public-readonly-smoke.yml'
      - 'scripts/validate_nova_release_artifact.py'
      - 'scripts/build_netlify_public.py'
      - 'scripts/normalize_nova_seo.py'
      - 'scripts/check_nova_a1.py'
      - 'scripts/validate_seo_quality.py'
      - 'tests/security/sql/nova_poll_v7_*.sql'
      - 'tests/security/test_nova_poll_v7_disposable_contract.py'
      - 'tests/security/test_nova_poll_v8_concurrency_contract.py'
      - 'scripts/test_nova_poll_v8_concurrent_local.sh'
      - '.github/workflows/nova-poll-v7-sql-private-lab.yml'
      - '.github/workflows/validate-nova-civic-poll.yml'
  push:
    branches: [main]
    paths:
      - 'projets/projet-nova/**'
      - 'supabase/NOVA_POLL_SCHEMA_PREDEPLOY.sql'
      - 'supabase/functions/nova-civic-poll/**'
      - 'scripts/test_nova_civic_poll.py'
      - 'tests/security/sql/nova_poll_v7_*.sql'
      - 'tests/security/test_nova_poll_v7_disposable_contract.py'
      - 'tests/security/test_nova_poll_v8_concurrency_contract.py'
      - 'scripts/test_nova_poll_v8_concurrent_local.sh'
      - '.github/workflows/nova-poll-v7-sql-private-lab.yml'
      - '.github/workflows/validate-nova-civic-poll.yml'
permissions:
  contents: read
jobs:
  test-nova:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Vérifier les invariants et la syntaxe
        run: python scripts/test_nova_civic_poll.py
      - name: Vérifier les avant-projets 64/40 en lecture seule, sans vote
        run: python scripts/test_nova_candidate_questionnaires.py
      - name: Tester les écarts entre lots publiés sans votes réels
        run: python scripts/test_nova_poll_delta_privacy.py
      - name: Vérifier l'identité des bundles publics avec les JSON canoniques
        run: python scripts/test_nova_public_bundles.py
      - name: Configurer Node pour les tests du moteur
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
      - name: Contrôler la syntaxe des corpus JavaScript publics
        run: |
          node --check projets/projet-nova/assets/boussole-public-corpus.js
          node --check projets/projet-nova/assets/sondage-public-corpus.js
          node --check projets/projet-nova/assets/nova-civic-integrity.js
      - name: Tester l’intégrité canonique et le moteur local partagé 64/16
        run: node scripts/test_nova_civic_integrity.cjs
      - name: Tester les 16 dimensions et 260 profils de parité de calcul
        run: node --test projets/projet-nova/tests/nova-civic-scoring.test.mjs
      - name: Tester le calcul et la carte de la boussole
        run: node scripts/test_nova_boussole_runtime.cjs
      - name: Tester le repli réseau de la boussole et les 64 propositions / 16 axes
        run: node scripts/test_nova_boussole_network.cjs
      - name: Valider l'absence de doublons dans les événements de l'explorateur documentaire
        run: node scripts/test_nova_evidence_retry.cjs
      - name: Parcourir les 64 questions et les scénarios sans opinion
        run: node scripts/test_nova_boussole_navigation.cjs
      - name: Contrôler les critères de réception affichés et le sondage fermé
        run: node --test projets/projet-nova/tests/nova-civic-readiness.test.mjs
      - name: Tester la cohérence atomique des résultats publics sans vote
        run: node scripts/test_nova_edge_snapshot.cjs
      - name: Vérifier le verrou éditorial côté serveur des 8 questions officielles
        run: node scripts/test_nova_edge_canonical_questions.cjs
      - name: Vérifier le consentement politique explicite avant toute écriture
        run: node scripts/test_nova_edge_explicit_consent.cjs
      - name: Tester le rétablissement d'une lecture GET temporairement indisponible
        run: node scripts/test_nova_poll_recovery.cjs
      - name: Tester le verrou du formulaire client sans réseau
        run: node scripts/test_nova_poll_runtime.cjs
      - name: Valider la fermeture du sondage après incident réseau
        run: node scripts/test_nova_poll_refresh.cjs
      - name: Tester les délais réseau GET/POST et la récupération après interruption
        run: node scripts/test_nova_poll_network.cjs
      - name: Tester la lecture des corps POST lents, tronqués et abandonnés sur la fonction Edge
        run: node scripts/test_nova_poll_body_read.cjs
      - name: Tester les contrôles HTTP publics sans réseau
        run: python scripts/smoke_nova_live_public.py --self-test
      - name: Tester la configuration du navigateur public sans réseau
        run: python scripts/smoke_nova_live_compass_browser.py --self-test
      - name: Vérifier les tentatives bornées de lecture, sans réseau
        run: python scripts/smoke_nova_poll_edge.py --self-test
      - name: Vérifier le service public sans envoyer de vote
        run: python scripts/smoke_nova_poll_edge.py
      - name: Construire l'artefact public isolé
        env:
          SINJIRA_RELEASE_SHA: ${{ github.sha }}
        run: python scripts/build_netlify_public.py --output _site --standalone-netlify
      - name: Valider les liens et les ressources NOVA réellement publiables
        run: python scripts/validate_nova_release_artifact.py _site
      - name: Vérifier les liens et les fichiers du site
        run: python scripts/validate_site.py

  test-poll-v7-private-sql-isolated:
    name: Vérifier SQL réel anti-rejeu et lots privés sur PostgreSQL jetable
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: nova_poll_v7_disposable
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd=pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - name: Lire les sources de ce commit sans credential persistant
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Contrat statique d'isolation 11 cas
        run: python3 -m unittest discover -s tests/security -p test_nova_poll_v7_disposable_contract.py -v
      - name: Préparer le schéma sur PostgreSQL local jetable
        env:
          PGCONNECT_TIMEOUT: '10'
        run: psql --no-psqlrc -h 127.0.0.1 -U postgres -d nova_poll_v7_disposable -v ON_ERROR_STOP=1 -f tests/security/sql/nova_poll_v7_lab_setup.sql
      - name: Contrôler RLS, rôles et anti-rejeu avec 10 faux bulletins
        env:
          PGCONNECT_TIMEOUT: '10'
        run: psql --no-psqlrc -h 127.0.0.1 -U postgres -d nova_poll_v7_disposable -v ON_ERROR_STOP=1 -f tests/security/sql/nova_poll_v7_security_replay.sql
      - name: Vérifier le seuil horaire et la suppression des différences 9/1
        env:
          PGCONNECT_TIMEOUT: '10'
        run: psql --no-psqlrc -h 127.0.0.1 -U postgres -d nova_poll_v7_disposable -v ON_ERROR_STOP=1 -f tests/security/sql/nova_poll_v7_private_batches.sql
      - name: Deux connexions même jeton puis seize connexions distinctes en parallèle
        run: |
          python3 -m unittest discover -s tests/security -p test_nova_poll_v8_concurrency_contract.py -v
          bash -n scripts/test_nova_poll_v8_concurrent_local.sh
          bash scripts/test_nova_poll_v8_concurrent_local.sh
      - name: Ne jamais transformer un test en autorisation de vote
        run: echo 'NO_GO - laboratoire isolé, scrutin non ouvert, aucune donnée réelle'
