name: SINJIRA V24.5.5 — Préparation commerciale Livre I

on:
  pull_request:
    paths:
      - 'admin/sinjira/precommandes.html'
      - 'compte/mes-achats.html'
      - 'projets/sinjira/romans/precommande.html'
      - 'assets/js/sinjira-admin-preorder-commercial-v24-5-5.js'
      - 'assets/js/sinjira-preorder-commercial-v24-5-5.js'
      - 'assets/css/sinjira-admin-preorder-commercial-v24-5-5.css'
      - 'assets/css/sinjira-preorder-commercial-v24-5-5.css'
      - 'supabase/migrations/**'
      - 'supabase/production-migration-ledger.txt'
      - 'scripts/validate_preorder_commercial_v24_5_5.py'
      - 'scripts/validate_production_migration_ledger.py'
      - 'scripts/validate_production_schema_manifest.py'
      - 'SERVICES_EXTERNES_PAYANTS.md'
      - '.github/workflows/sinjira-preorder-commercial-v24-5-5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Contrat commercial préparatoire V24.5.5
        run: python scripts/validate_preorder_commercial_v24_5_5.py
      - name: Validation statique du site
        run: python scripts/validate_site.py
      - name: Contrat Supabase
        run: python scripts/validate_supabase.py
      - name: Ledger production
        run: python scripts/validate_production_migration_ledger.py
      - name: Manifeste du schéma production
        run: python scripts/validate_production_schema_manifest.py
      - name: Mode gratuit et services externes
        run: python scripts/validate_free_only_mode.py
