name: Projet Nova P54D - Controler observations des cinq jetons
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p54d-observations.yml"
      - "scripts/verifier_observations_numeriques_nova_p54d.py"
      - "scripts/tests/test_verifier_observations_numeriques_nova_p54d.py"
      - "scripts/classer_ecarts_numeriques_nova_p54d.py"
      - "projets/projet-nova/etudes/P54D_*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualitative-observations-no-monetary-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout lecture seule
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: PDF parser epingle
        run: python -m pip install pypdf==5.9.0
      - name: Test 24 verrous des resultats observes
        run: |
          python -m py_compile scripts/verifier_observations_numeriques_nova_p54d.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
            "scripts/tests",pattern="test_verifier_observations_numeriques_nova_p54d.py")
          assert suite.countTestCases()==24,suite.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
      - name: Confirmation de quatre inconnues et de zero economie
        run: |
          python scripts/verifier_observations_numeriques_nova_p54d.py --bilan p54d_reconciliation_publique.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("p54d_reconciliation_publique.json").read_text("utf-8"))
          assert d["occurrences_non_appariees"]==5
          assert d["date_ou_annee_probable"]==1
          assert d["occurrences_indeterminees"]==4
          assert d["causes_de_differences_comptables_demontrees"]==0
          assert d["economies_certifiees_cad"] is None
          assert d["decision"]=="NO_GO_AUTOMATIQUE"
          PY
          set +e
          python scripts/verifier_observations_numeriques_nova_p54d.py --exiger-preuve-comptable
          code=$?
          set -e
          test "$code" -eq 3
      - name: Ne publier que le bilan non identifiant
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-p54d-observations-reelles-sans-chiffres-bruts
          path: p54d_reconciliation_publique.json
          if-no-files-found: ignore
          retention-days: 7
