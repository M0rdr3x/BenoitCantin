name: Projet Nova P54Q - Reproduction locale des PDF sans reseau
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p54q.yml"
      - "scripts/reproduire_pdf_locaux_nova_p54q.py"
      - "scripts/tests/test_reproduire_pdf_locaux_nova_p54q.py"
      - "scripts/tests/test_reproduire_localisations_pdf_nova_p54p.py"
      - "scripts/reproduire_localisations_pdf_nova_p54p.py"
      - "projets/projet-nova/etudes/P54Q_*"
      - "projets/projet-nova/etudes/P54P_REPRODUCTION_POSITIONS_PDF_2024.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-offline-sans-documents-reels:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Pypdf aligne sur P54D
        run: python -m pip install pypdf==5.9.0
      - name: 68 tests P54Q avec PDFs fictifs et aucun acces reseau
        run: |
          python -m py_compile scripts/reproduire_pdf_locaux_nova_p54q.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
            "scripts/tests",pattern="test_reproduire_pdf_locaux_nova_p54q.py")
          assert suite.countTestCases()==68,suite.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
      - name: Baseline privee absente - aucune preuve de reproduction
        run: |
          python scripts/reproduire_pdf_locaux_nova_p54q.py \
            --bilan p54q_bilan_neutre.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("p54q_bilan_neutre.json").read_text("utf-8"))
          assert d["schema_version"]=="P54Q-BILAN-1"
          assert d["mode"]=="COPIES_LOCALES_HORS_GIT_SANS_RESEAU"
          assert d["statut_reproduction"]=="NON_TENTE"
          assert d["copies_exactes_controlees"]==0
          assert d["occurrences_localisees"]==0
          assert d["positions_nfkc"] is None
          assert d["originaux_et_chemins_publies"]==0
          assert d["tokens_et_contextes_publies"]==0
          assert d["signature_emetteur_authentifiee"] is False
          assert d["economies_certifiees_cad"] is None
          assert d["decision"]=="NO_GO_AUTOMATIQUE"
          PY
      - name: Refuser fichier unique et certification fictive
        run: |
          set +e
          python scripts/reproduire_pdf_locaux_nova_p54q.py --ville-pdf "$RUNNER_TEMP/missing.pdf"
          code=$?
          set -e
          test "$code" -eq 2
          set +e
          python scripts/reproduire_pdf_locaux_nova_p54q.py --exiger-certification
          code=$?
          set -e
          test "$code" -eq 3
      - name: Archiver uniquement le constat non tente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-p54q-reproduction-locale-non-tentee-sans-pdf
          path: p54q_bilan_neutre.json
          if-no-files-found: ignore
          retention-days: 7
