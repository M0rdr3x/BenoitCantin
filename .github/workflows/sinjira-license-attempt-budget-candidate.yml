name: Sécurité — candidat quota individuel licences local
on:
  pull_request:
    branches: [main]
    paths:
      - 'security/candidates/license_attempt_budget*.sql'
      - '.github/workflows/sinjira-license-attempt-budget-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'security/candidates/license_attempt_budget*.sql'
      - '.github/workflows/sinjira-license-attempt-budget-candidate.yml'
permissions:
  contents: read
jobs:
  local-license-quota:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0
      - name: Démarrer Supabase local
        run: supabase start
      - name: Vérifier isolation et droits des quotas locaux
        shell: bash
        run: |
          set -euo pipefail
          candidate=security/candidates/license_attempt_budget.sql
          test "$(tail -n 1 "$candidate")" = 'ROLLBACK;'
          { head -n -1 "$candidate"; cat security/candidates/license_attempt_budget_assertions.sql; } | env -i PATH="$PATH" PGPASSWORD=postgres PGCONNECT_TIMEOUT=5 psql -X -w -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres
      - name: Nettoyer Supabase local
        if: always()
        run: supabase stop --no-backup || true
