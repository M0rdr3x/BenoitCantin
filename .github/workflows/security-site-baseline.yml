name: Sécurité — contrat transversal du site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-site-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python figé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Auto-tests des protections
        run: python3 scripts/validate_site_security_baseline.py --self-test
      - name: Vérifier les protections
        run: python3 scripts/validate_site_security_baseline.py
      - name: Empêcher les secrets versionnés
        run: python3 scripts/validate_no_committed_secrets.py
      - name: Valider le retrait des formulaires politiques externes
        run: python3 scripts/validate_nova_form_decommission.py
