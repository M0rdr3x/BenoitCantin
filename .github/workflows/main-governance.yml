name: Gouvernance main SINJIRA

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-associated-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Vérifier que le commit main provient d’une PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
            const mergedToMain = pulls.some(pr => pr.merged_at && pr.base?.ref === 'main');
            if (!mergedToMain) {
              core.setFailed(`Le commit ${sha} est arrivé sur main sans Pull Request fusionnée associée. Examiner immédiatement ce changement.`);
              return;
            }
            core.info(`Commit ${sha} associé à une PR fusionnée vers main.`);

            const protectedRef = process.env.GITHUB_REF_PROTECTED === 'true';
            if (!protectedRef) {
              core.warning('La branche main n’est pas protégée par une branch protection ou un ruleset. Cette alerte ne remplace pas la configuration GitHub Settings > Branches/Rulesets.');
            } else {
              core.info('La branche main est protégée par une branch protection ou un ruleset.');
            }
