name: Gouvernance main SINJIRA

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-associated-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Vérifier que le commit main provient d’une PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
            const mergedToMain = pulls.some(pr => pr.merged_at && pr.base?.ref === 'main');
            if (!mergedToMain) {
              core.setFailed(`Le commit ${sha} est arrivé sur main sans Pull Request fusionnée associée. Examiner immédiatement ce changement.`);
              return;
            }
            core.info(`Commit ${sha} associé à une PR fusionnée vers main.`);

            const protectedRef = process.env.GITHUB_REF_PROTECTED === 'true';
            if (!protectedRef) {
              core.setFailed('La branche main n’est pas protégée par une branch protection ou un ruleset. Cet échec de CI ne remplace pas la configuration GitHub Settings > Branches/Rulesets : activer une protection native avant toute fusion ou publication.');
              return;
            }

            // Deuxième source de vérité : vérification REST du serveur au SHA déclencheur.
            // Un échec API, une branche non protégée ou un SHA déplacé font échouer le job.
            const { data: liveMain } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (liveMain.protected !== true) {
              core.setFailed('La branche main n’est pas protégée selon l’API GitHub : activation d’un ruleset ou d’une protection native obligatoire.');
              return;
            }
            if (liveMain.commit?.sha !== sha) {
              core.setFailed('La branche main a changé depuis le déclenchement : revalider ce commit avant toute publication.');
              return;
            }
            core.info('Protection native de main confirmée par l’API GitHub et SHA du déclenchement inchangé.');
