name: SINJIRA V25 — Navigateur inscription enfant 11 ans

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'compte/inscription.html'
      - 'assets/js/v24-signup.js'
      - 'tests/e2e/test_child_signup.py'
      - 'tests/e2e/test_public_site.py'
      - 'scripts/validate_child_guardian_signup_v25.py'
      - 'scripts/validate_child_signup_browser_workflow_security.py'
      - '.github/workflows/sinjira-child-signup-browser-v25.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sinjira-child-signup-browser-v25-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-contract:
    name: Contrat sécurité navigateur enfant
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Auto-tester la frontière CI enfant
        run: python3 scripts/validate_child_signup_browser_workflow_security.py --self-test

      - name: Vérifier la frontière CI enfant
        run: python3 scripts/validate_child_signup_browser_workflow_security.py

  browser-proof:
    needs: workflow-contract
    name: Parcours enfant 11 ans isolé
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble@sha256:a9731514f24121d1dcd25d58d0a38146646d290a5998fd80d3e533e7b5e21c69
      options: --user 1001
    timeout-minutes: 12
    steps:
      - name: Récupérer le dépôt sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Vérifier la syntaxe de la preuve navigateur
        run: python -m py_compile tests/e2e/test_child_signup.py

      - name: Installer le client Playwright épinglé
        run: python -m pip install --disable-pip-version-check "playwright==1.61.0"

      - name: Démarrer le site statique local
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/sinjira-child-http.log 2>&1 &
          echo $! > /tmp/sinjira-child-http.pid
          i=0
          while [ "$i" -lt 20 ]; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/compte/inscription.html', timeout=1).read(1)" >/dev/null 2>&1; then exit 0; fi
            i=$((i + 1))
            sleep 1
          done
          cat /tmp/sinjira-child-http.log
          exit 1

      - name: Tester l'interface enfant 11 ans sans service distant
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: python tests/e2e/test_child_signup.py

      - name: Arrêter le serveur local
        if: always()
        run: |
          if [ -f /tmp/sinjira-child-http.pid ]; then kill "$(cat /tmp/sinjira-child-http.pid)" || true; fi
