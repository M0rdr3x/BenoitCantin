name: Sécurité — candidat SQL rôles privés et identité authentifiée

on:
  pull_request:
    branches: [main]
    paths:
      - 'security/candidates/private_admin_project_access_identity.sql'
      - 'scripts/validate_private_role_identity_candidate.py'
      - 'scripts/build_private_role_identity_runtime_test.py'
      - 'security/candidates/private_role_identity_runtime_assertions.sql'
      - '.github/workflows/sinjira-private-role-identity-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'security/candidates/private_admin_project_access_identity.sql'
      - 'scripts/validate_private_role_identity_candidate.py'
      - 'scripts/build_private_role_identity_runtime_test.py'
      - 'security/candidates/private_role_identity_runtime_assertions.sql'
      - '.github/workflows/sinjira-private-role-identity-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-identity-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans persistance des credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python figé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Refuser les mutations SQL dangereuses
        run: python3 scripts/validate_private_role_identity_candidate.py --self-test
      - name: Vérifier le candidat SQL non déployable
        run: python3 scripts/validate_private_role_identity_candidate.py

  local-private-rank-identity:
    name: Tester rangs projets privés et admin sous vrais rôles SQL (pgTAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout isolé
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python figé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Auto-tester le générateur pgTAP sans SQL distant
        run: python3 scripts/build_private_role_identity_runtime_test.py --self-test
      - name: Installer Supabase CLI figée
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0
      - name: Démarrer la base Supabase locale
        run: supabase start
      - name: Exécuter 28 assertions pgTAP sans écrire en production
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_private_role_identity_runtime_test.py
          supabase test db supabase/tests/__sinjira_private_role_identity_generated.test.sql --local
      - name: Supprimer les données et la base locale jetable
        if: always()
        run: supabase stop --no-backup || true
