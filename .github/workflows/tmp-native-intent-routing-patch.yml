name: TEMP — Patch routage intentions natives

on:
  push:
    branches:
      - sinjira-v25-native-intent-routing
    paths:
      - '.github/workflows/tmp-native-intent-routing-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Appliquer le patch borné à navigateToUrl
        run: python3 scripts/.tmp_apply_native_intent_routing_patch.py

      - name: Vérifier le diff
        run: git diff --check

      - name: Committer uniquement App.tsx
        run: |
          if git diff --quiet -- mobile-native/App.tsx; then
            echo "Aucun patch à committer"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-native/App.tsx
          git commit -m "V25 — Router les intentions nues vers les sas natifs"
          git push
