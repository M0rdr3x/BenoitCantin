name: Validation Communauté V24.4.80

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-v24-4-80-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  social-rls-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Récupérer le dépôt pour le contrat social/RLS
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python pour le contrat social/RLS
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Vérifier le contrat social/RLS final
        run: python scripts/validate_social_rls_contract.py

  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Configurer Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Vérifier le contrat Communauté privée V24.4.79
        run: python scripts/validate_community_safety_v24_4_79.py
      - name: Vérifier le portail public Communauté V24.4.80
        run: python scripts/validate_public_community_v24_4_80.py
      - name: Vérifier la syntaxe JavaScript communautaire
        run: |
          node --check assets/js/sinjira-social-common.js
          node --check assets/js/sinjira-social-safety-v24-4-79.js
          node --check assets/js/sinjira-social-safety-center-v24-4-79.js
          node --check assets/js/sinjira-community-real.js
          node --check assets/js/sinjira-community-character.js
      - name: Vérifier le ledger + migration future
        run: python scripts/validate_production_migration_ledger.py
