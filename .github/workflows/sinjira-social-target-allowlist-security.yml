name: Sécurité SINJIRA — cibles de modération autorisées

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/admin-social-v20/index.ts'
      - 'scripts/test_admin_social_target_allowlist.mjs'
      - 'scripts/validate_admin_social_target_allowlist.py'
      - '.github/workflows/sinjira-social-target-allowlist-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/admin-social-v20/index.ts'
      - 'scripts/test_admin_social_target_allowlist.mjs'
      - 'scripts/validate_admin_social_target_allowlist.py'
      - '.github/workflows/sinjira-social-target-allowlist-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moderator-target-allowlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Récupérer sans credentials persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Node.js déterministe
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.2'

      - name: Tester les vraies résolutions SQL et décisions de modération
        run: node --test scripts/test_admin_social_target_allowlist.mjs

      - name: Tester la résistance aux régressions de prototype
        run: |
          python3 scripts/validate_admin_social_target_allowlist.py --self-test
          python3 scripts/validate_admin_social_target_allowlist.py

      - name: Conserver les contrôles HTTP, AAL2 et de modération existants
        run: |
          python3 scripts/validate_admin_social_request_security.py --self-test
          python3 scripts/validate_admin_social_request_security.py
          python3 scripts/validate_moderation_appeals_v24_4_90.py
          python3 scripts/validate_dating_moderation_v24_4_78.py
          python3 scripts/validate_edge_function_inventory.py
