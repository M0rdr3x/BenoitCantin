name: Sécurité Edge — délai absolu des requêtes privées

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/read-chunk-deadline.mjs'
      - 'supabase/functions/personal-ai/index.ts'
      - 'supabase/functions/conscience-vault/index.ts'
      - 'scripts/test_edge_body_deadline.mjs'
      - '.github/workflows/sinjira-edge-body-deadline-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/read-chunk-deadline.mjs'
      - 'supabase/functions/personal-ai/index.ts'
      - 'supabase/functions/conscience-vault/index.ts'
      - 'scripts/test_edge_body_deadline.mjs'
      - '.github/workflows/sinjira-edge-body-deadline-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-request-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans identifiants conservés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Tester les délais, interruptions et refus des corps invalides
        run: |
          node --version
          node --test scripts/test_edge_body_deadline.mjs
