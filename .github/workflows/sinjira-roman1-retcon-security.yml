name: SINJIRA — Roman I verrouillé même si lecture SQL échoue

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/admin-sinjira-v18/index.ts'
      - 'scripts/test_admin_roman1_retcon_fail_closed.mjs'
      - 'scripts/validate_admin_roman1_retcon_fail_closed.py'
      - '.github/workflows/sinjira-roman1-retcon-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/admin-sinjira-v18/index.ts'
      - 'scripts/test_admin_roman1_retcon_fail_closed.mjs'
      - 'scripts/validate_admin_roman1_retcon_fail_closed.py'
      - '.github/workflows/sinjira-roman1-retcon-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roman1-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout sans credentials persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Node.js épinglé
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'

      - name: Reproduire les erreurs SQL sur le vrai handler du Roman I
        run: node --test scripts/test_admin_roman1_retcon_fail_closed.mjs

      - name: Rejeter les mutations contournant l'accord retcon
        run: |
          python3 scripts/validate_admin_roman1_retcon_fail_closed.py --self-test
          python3 scripts/validate_admin_roman1_retcon_fail_closed.py

      - name: Protéger les règles historiques MFA et éditoriales
        run: |
          python3 scripts/validate_admin_sinjira_v18_request_security.py --self-test
          python3 scripts/validate_admin_sinjira_v18_request_security.py
          python3 scripts/validate_admin_v18_privacy_security.py --self-test
          python3 scripts/validate_admin_v18_privacy_security.py
          python3 scripts/validate_edge_function_inventory.py
