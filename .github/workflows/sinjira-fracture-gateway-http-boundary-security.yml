name: SINJIRA — Fracture, frontière HTTP et JWT

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/fracture-engine-gateway/**'
      - 'supabase/functions/_shared/read-chunk-deadline.mjs'
      - 'supabase/config.toml'
      - 'scripts/validate_fracture_engine_gateway_security.py'
      - 'scripts/validate_edge_function_inventory.py'
      - 'scripts/test_fracture_gateway_real_body_parser.cjs'
      - '.github/workflows/sinjira-fracture-gateway-http-boundary-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/fracture-engine-gateway/**'
      - 'supabase/functions/_shared/read-chunk-deadline.mjs'
      - 'supabase/config.toml'
      - 'scripts/validate_fracture_engine_gateway_security.py'
      - 'scripts/validate_edge_function_inventory.py'
      - 'scripts/test_fracture_gateway_real_body_parser.cjs'
      - '.github/workflows/sinjira-fracture-gateway-http-boundary-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fracture-http-jwt-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout sans secrets persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Installer Node.js épinglé
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
      - name: Installer Python épinglé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Exécuter les vrais parseurs HTTP avec clients malveillants simulés
        run: node scripts/test_fracture_gateway_real_body_parser.cjs
      - name: Auto-tester les mutations de sécurité JWT, JSON et autorisations
        run: python3 scripts/validate_fracture_engine_gateway_security.py --self-test
      - name: Vérifier le contrat des actions et la confidentialité du jeu
        run: python3 scripts/validate_fracture_engine_gateway_security.py
      - name: Vérifier l'inventaire complet des fonctions Edge
        run: python3 scripts/validate_edge_function_inventory.py
