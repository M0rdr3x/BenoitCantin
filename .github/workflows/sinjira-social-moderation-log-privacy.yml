name: SINJIRA — confidentialité des journaux modération et sécurité

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/sinjira-moderation-appeals-v24-4-90.js'
      - 'assets/js/sinjira-social-safety-center-v24-4-79.js'
      - 'scripts/test_social_moderation_log_privacy.cjs'
      - '.github/workflows/sinjira-social-moderation-log-privacy.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-moderation-appeals-v24-4-90.js'
      - 'assets/js/sinjira-social-safety-center-v24-4-79.js'
      - 'scripts/test_social_moderation_log_privacy.cjs'
      - '.github/workflows/sinjira-social-moderation-log-privacy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-private-rpc-logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans authentifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Node épinglé
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Tester les parcours réels avec erreurs RPC synthétiques
        run: node scripts/test_social_moderation_log_privacy.cjs
