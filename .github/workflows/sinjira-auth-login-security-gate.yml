name: SINJIRA — sécurité du contrôle de connexion

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/sinjira-auth-pages.js'
      - 'scripts/test_auth_login_security_gate.cjs'
      - 'scripts/validate_auth.py'
      - '.github/workflows/sinjira-auth-login-security-gate.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-auth-pages.js'
      - 'scripts/test_auth_login_security_gate.cjs'
      - 'scripts/validate_auth.py'
      - '.github/workflows/sinjira-auth-login-security-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-login-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout sans secrets persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Configurer Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Exécuter les scénarios de sécurité de connexion
        run: node scripts/test_auth_login_security_gate.cjs
      - name: Conserver les contrats d'authentification existants
        run: python3 scripts/validate_auth.py
