name: SINJIRA V24.5.48 — Confidentialité réponses Edge

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Vérifier Python 3.12 sur Ubuntu 24.04
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), "Python 3.12 requis"'

      - name: Auto-tester le contrat CI confidentialité Edge
        run: python3 scripts/validate_edge_response_privacy_workflow_security.py --self-test

      - name: Vérifier le contrat CI confidentialité Edge
        run: python3 scripts/validate_edge_response_privacy_workflow_security.py

      - name: Vérifier V24.5.48
        run: |
          python3 scripts/validate_edge_response_privacy_v24_5_48.py
          python3 scripts/test_streaming_edge_legacy_guard_regressions.py
          python3 scripts/validate_edge_function_inventory.py
