name: SINJIRA — sécurité des corps HTTP privés admin et Registre

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/life-story-export/**'
      - 'supabase/functions/submit-character-questionnaire/**'
      - 'supabase/functions/_shared/read-chunk-deadline.mjs'
      - 'supabase/functions/_shared/auth.ts'
      - 'scripts/validate_life_story_export_request_security.py'
      - 'scripts/validate_character_questionnaire_security.py'
      - 'scripts/validate_edge_function_inventory.py'
      - 'scripts/test_sensitive_admin_registry_body_deadlines.cjs'
      - '.github/workflows/sinjira-sensitive-exports-registry-http-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/life-story-export/**'
      - 'supabase/functions/submit-character-questionnaire/**'
      - 'supabase/functions/_shared/read-chunk-deadline.mjs'
      - 'supabase/functions/_shared/auth.ts'
      - 'scripts/validate_life_story_export_request_security.py'
      - 'scripts/validate_character_questionnaire_security.py'
      - 'scripts/validate_edge_function_inventory.py'
      - 'scripts/test_sensitive_admin_registry_body_deadlines.cjs'
      - '.github/workflows/sinjira-sensitive-exports-registry-http-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-registry-http-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Node.js version figée
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'

      - name: Python version figée
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Tester les vrais parseurs avec clients HTTP bloqués
        run: node scripts/test_sensitive_admin_registry_body_deadlines.cjs

      - name: Auto-tester les garde-fous export administrateur
        run: python3 scripts/validate_life_story_export_request_security.py --self-test

      - name: Auto-tester les garde-fous questionnaire privé
        run: python3 scripts/validate_character_questionnaire_security.py --self-test

      - name: Vérifier les contrats des deux fonctions privées
        run: |
          python3 scripts/validate_life_story_export_request_security.py
          python3 scripts/validate_character_questionnaire_security.py
          python3 scripts/validate_edge_function_inventory.py
