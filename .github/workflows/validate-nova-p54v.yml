name: Projet Nova P54V - Preparation locale de contextes strictement prives
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p54v.yml"
      - "scripts/preparer_contextes_prives_nova_p54v.py"
      - "scripts/tests/test_preparer_contextes_prives_nova_p54v.py"
      - "scripts/reproduire_pdf_locaux_nova_p54q.py"
      - "scripts/verifier_archive_publique_figee_nova_p54t.py"
      - "scripts/preparer_feuilles_localisation_nova_p54u.py"
      - "projets/projet-nova/etudes/P54V_*"
      - "projets/projet-nova/etudes/p54t_archive_durable_p54p/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparation-privee-sans-document-reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout lecture seule sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Dépendance pypdf 5.9.0 version historique
        run: python -m pip install pypdf==5.9.0
      - name: Executer 75 tests strictement synthetiques P54V
        run: |
          python -m py_compile scripts/preparer_contextes_prives_nova_p54v.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
            "scripts/tests",pattern="test_preparer_contextes_prives_nova_p54v.py")
          assert suite.countTestCases()==75,suite.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
      - name: Générer le seul bilan public neutre, sans PDF local
        run: |
          python scripts/preparer_contextes_prives_nova_p54v.py \
            --bilan-public p54v_bilan_public_neutre.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("p54v_bilan_public_neutre.json").read_text("utf-8"))
          assert p["copies_pdf_verifiees_ce_run"]==0
          assert p["positions_nfkc_reproduites_ce_run"]==0
          assert p["fiches_contextuelles_privees_creees"]==0
          assert p["contenus_jetons_extraits_publies"]==0
          assert p["originals_pdfs_publies"]==0
          assert p["avis_independants_authentifies"]==0
          assert p["qualifications_humaines_effectuees"]==0
          assert p["dossiers_p54e_ouverts"]==4
          assert p["blocages_p54o_non_leves"]==10
          assert p["taches_p54n_non_attestees"]==40
          assert p["controles_p54b_non_attestes"]==96
          assert p["controles_p54c_non_attestes"]==8
          assert p["economies_certifiees_cad"] is None
          assert p["pret_a_transmettre"] is False
          assert p["decision"]=="NO_GO_AUTOMATIQUE"
          assert "jeton_brut_STRICTEMENT_PRIVE" not in json.dumps(p)
          PY
      - name: Refuser des documents absents sans créer de fiche
        run: |
          set +e
          python scripts/preparer_contextes_prives_nova_p54v.py \
            --ville-pdf "$RUNNER_TEMP/v.pdf" \
            --mamh-pdf "$RUNNER_TEMP/m.pdf" \
            --fiche-privee "$RUNNER_TEMP/INTERDIT.json"
          code=$?
          set -e
          test "$code" -eq 2
          test ! -e "$RUNNER_TEMP/INTERDIT.json"
      - name: Refuser la certification automatique
        run: |
          set +e
          python scripts/preparer_contextes_prives_nova_p54v.py --exiger-certification
          code=$?
          set -e
          test "$code" -eq 3
      - name: Conserver seulement un bilan sans extrait privé
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-p54v-bilan-sans-contexte-confidentiel
          path: p54v_bilan_public_neutre.json
          if-no-files-found: ignore
          retention-days: 7
