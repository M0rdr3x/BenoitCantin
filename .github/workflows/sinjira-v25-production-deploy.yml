name: SINJIRA V25 — Vérification production coffre

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Saisir exactement VERIFY-SINJIRA-V25"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sinjira-v25-consciousness-vault-production-verify
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: gpvivleexywljowcqkru
  EXPECTED_REMOTE_BASELINE: "20260901002241"
  EXPECTED_REMOTE_BASELINE_NAME: sinjira_v24_5_54_fracture_contribution_atomic_finalize
  SUPABASE_MANAGEMENT_API: https://api.supabase.com/v1

jobs:
  verify-v25-consciousness-vault:
    name: Vérifier le coffre V25 en production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Vérifier la confirmation et le jeton
        shell: bash
        env:
          VERIFY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$VERIFY_CONFIRMATION" = "VERIFY-SINJIRA-V25" || {
            echo "Confirmation invalide; aucune vérification production n'est exécutée." >&2
            exit 1
          }
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "Secret SUPABASE_ACCESS_TOKEN manquant." >&2
            exit 1
          }

      - name: Checkout de main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Vérifier les contrats statiques V25
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_conscience_vault_edge_v25.py
          python3 scripts/validate_edge_function_inventory.py
          python3 scripts/validate_production_schema_manifest.py
          python3 scripts/validate_v25_production_deploy_workflow.py

      - name: Vérifier l'historique V25 en lecture seule
        shell: bash
        run: |
          set -euo pipefail
          history="$RUNNER_TEMP/v25-migrations.json"
          curl --fail-with-body --silent --show-error \
            "$SUPABASE_MANAGEMENT_API/projects/$SUPABASE_PROJECT_REF/database/migrations" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Accept: application/json' \
            --output "$history"

          MIGRATION_HISTORY="$history" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required = [
              "sinjira_v25_0_security_risk_model_convergence",
              "sinjira_v25_0_personal_consciousness_vault",
              "sinjira_v25_0_conscience_vault_challenge_continuity",
              "sinjira_v25_0_device_key_privacy_and_trust_hardening",
              "sinjira_v25_conscience_vault_audit_session_index",
          ]
          baseline_version = os.environ["EXPECTED_REMOTE_BASELINE"]
          baseline_name = os.environ["EXPECTED_REMOTE_BASELINE_NAME"]

          payload = json.loads(Path(os.environ["MIGRATION_HISTORY"]).read_text(encoding="utf-8"))
          if isinstance(payload, list):
              rows = payload
          elif isinstance(payload, dict):
              rows = next((payload[k] for k in ("migrations", "data", "result") if isinstance(payload.get(k), list)), None)
          else:
              rows = None
          if not rows:
              raise SystemExit("Historique de migration distant illisible ou vide.")

          rows = sorted(rows, key=lambda row: str(row.get("version", "")))
          baseline_indexes = [
              i for i, row in enumerate(rows)
              if str(row.get("version")) == baseline_version and row.get("name") == baseline_name
          ]
          if len(baseline_indexes) != 1:
              raise SystemExit("Baseline distante V24.5.54 introuvable de façon unique.")

          after = rows[baseline_indexes[0] + 1:]
          after_names = [str(row.get("name", "")) for row in after]
          if after_names[:len(required)] != required:
              raise SystemExit(
                  "Séquence V25 obligatoire absente ou désordonnée. "
                  f"Observé={after_names[:len(required)]}; attendu={required}"
              )

          versions = {
              str(row.get("name", "")): str(row.get("version", ""))
              for row in after
              if str(row.get("name", "")) in required
          }
          for name in required:
              print(f"{versions.get(name, '?')} {name}")
          PY

      - name: Installer Supabase CLI pour l'inventaire Edge
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}

      - name: Vérifier la présence de conscience-vault
        shell: bash
        run: |
          set -euo pipefail
          functions_list="$RUNNER_TEMP/v25-functions-list.txt"
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" | tee "$functions_list"
          grep -Fq 'conscience-vault' "$functions_list" || {
            echo "conscience-vault absente de production." >&2
            exit 1
          }

      - name: Résumé lecture seule
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF'
          Vérification V25 terminée en lecture seule.
          Aucune migration, aucun secret et aucune Edge Function n'ont été modifiés par ce workflow.
          Leaked Password Protection reste un réglage Supabase Auth séparé à contrôler dans le projet hébergé.
          EOF
