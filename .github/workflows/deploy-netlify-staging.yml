name: Netlify staging — deux deploys immuables

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: SHA Git complet exact à publier depuis ce ref
        required: true
        type: string
      expected_site_name:
        description: Nom canonique exact du site Netlify (*.netlify.app)
        required: true
        type: string
      confirmation:
        description: Saisir exactement STAGING_ONLY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: netlify-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    name: Déployer preview + production-candidate sans promotion
    if: github.ref == 'refs/heads/a1/web-release-transparency'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # La validation de staging et ses secrets doivent être soumis aux
    # protections d'environnement configurées dans GitHub Settings.
    environment: netlify-staging
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_SITE_NAME: ${{ inputs.expected_site_name }}
      CONFIRMATION: ${{ inputs.confirmation }}
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NETLIFY_CLI_TELEMETRY_DISABLED: '1'
      SINJIRA_RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Refuser tout staging depuis une branche non protégée
        # Ce contrôle s'exécute avant checkout et avant accès à un secret.
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_PROTECTED:-false}" != "true" ]; then
            echo "ERREUR: branche de release non protégée par GitHub; activer Branch protection/Ruleset avant staging." >&2
            exit 1
          fi

      - name: Récupérer le dépôt sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Configurer Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'

      - name: Installer Netlify CLI sans identifiants
        # L'installation npm (et ses dépendances transitives) est toujours
        # exécutée AVANT l'injection de NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID.
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_netlify_cli_lock.py
          cli_root="$RUNNER_TEMP/netlify-cli-27.10.2"
          mkdir -p "$cli_root"
          cp "$GITHUB_WORKSPACE/tools/netlify-cli/package.json" "$cli_root/package.json"
          cp "$GITHUB_WORKSPACE/tools/netlify-cli/package-lock.json" "$cli_root/package-lock.json"
          cd "$cli_root"
          : > "$cli_root/npm-user.conf"
          : > "$cli_root/npm-global.conf"
          npm ci --ignore-scripts --no-audit --no-fund \
            --userconfig="$cli_root/npm-user.conf" --globalconfig="$cli_root/npm-global.conf" \
            --registry=https://registry.npmjs.org/
          test -x "$cli_root/node_modules/.bin/netlify"
          node - "$cli_root/node_modules/netlify-cli/package.json" <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (manifest.name !== 'netlify-cli' || manifest.version !== '27.10.2') {
            throw new Error('Version Netlify CLI inattendue: refus du déploiement');
          }
          NODE
          "$cli_root/node_modules/.bin/netlify" --version

      - name: Verrouiller ref, SHA, site et secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "STAGING_ONLY" ]; then
            echo "ERREUR: confirmation exacte STAGING_ONLY requise." >&2
            exit 1
          fi
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERREUR: expected_sha doit être un SHA Git complet en minuscules." >&2
            exit 1
          fi
          if [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo "ERREUR: expected_sha ne correspond pas au GITHUB_SHA du ref déclenché." >&2
            exit 1
          fi
          if ! [[ "$EXPECTED_SITE_NAME" =~ ^[a-z0-9-]+$ ]]; then
            echo "ERREUR: expected_site_name Netlify invalide." >&2
            exit 1
          fi
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "ERREUR: secrets NETLIFY_AUTH_TOKEN et NETLIFY_SITE_ID requis." >&2
            exit 1
          fi

      - name: Auto-tester le smoke HTTP
        run: python3 scripts/validate_web_release_http.py --self-test

      - name: Vérifier l’allowlist publique
        run: python3 scripts/build_netlify_public.py --check

      - name: Construire le preview noindex
        env:
          CONTEXT: deploy-preview
        run: python3 scripts/build_netlify_public.py --output _preview_site --standalone-netlify

      - name: Déployer le preview staging sans promotion
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NPM_CONFIG_OFFLINE: 'true'
        id: preview_deploy
        shell: bash
        run: |
          set -euo pipefail
          json="$(mktemp)"
          trap 'rm -f "$json"' EXIT
          "$RUNNER_TEMP/netlify-cli-27.10.2/node_modules/.bin/netlify" deploy             --dir _preview_site             --no-build             --json             --message "SINJIRA staging preview $GITHUB_SHA" > "$json"
          python3 - "$json" "$EXPECTED_SITE_NAME" <<'PY'
          import json, os, re, sys
          from urllib.parse import urlparse

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_site = sys.argv[2]
          deploy_id = str(data.get("deploy_id") or "").strip().lower()
          raw_site = str(data.get("site_url") or data.get("url") or "").strip().rstrip("/")
          if raw_site.startswith("http://"):
              raw_site = "https://" + raw_site[7:]
          elif raw_site and not raw_site.startswith("https://"):
              raw_site = "https://" + raw_site
          parsed = urlparse(raw_site)
          host = (parsed.hostname or "").lower()
          if (
              parsed.scheme != "https"
              or parsed.username
              or parsed.password
              or parsed.port is not None
              or parsed.path not in {"", "/"}
              or parsed.query
              or parsed.fragment
              or host != f"{expected_site}.netlify.app"
              or not re.fullmatch(r"[a-z0-9-]{6,64}", deploy_id)
          ):
              raise SystemExit("ERREUR: identité du site/deploy Netlify inattendue.")
          permalink = f"https://{deploy_id}--{host}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"PREVIEW_PERMALINK={permalink}\n")
              fh.write(f"NETLIFY_SITE_NAME={expected_site}\n")
          PY

      - name: Prouver le preview immuable
        run: python3 scripts/validate_web_release_http.py "$PREVIEW_PERMALINK" --context preview --expected-sha "$GITHUB_SHA"

      - name: Construire le production-candidate
        env:
          CONTEXT: production
        run: python3 scripts/build_netlify_public.py --output _site --standalone-netlify

      - name: Déployer le production-candidate sans promotion
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NPM_CONFIG_OFFLINE: 'true'
        id: production_deploy
        shell: bash
        run: |
          set -euo pipefail
          json="$(mktemp)"
          trap 'rm -f "$json"' EXIT
          "$RUNNER_TEMP/netlify-cli-27.10.2/node_modules/.bin/netlify" deploy             --dir _site             --no-build             --json             --message "SINJIRA staging production-candidate $GITHUB_SHA" > "$json"
          python3 - "$json" "$EXPECTED_SITE_NAME" <<'PY'
          import json, os, re, sys
          from urllib.parse import urlparse

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_site = sys.argv[2]
          deploy_id = str(data.get("deploy_id") or "").strip().lower()
          raw_site = str(data.get("site_url") or data.get("url") or "").strip().rstrip("/")
          if raw_site.startswith("http://"):
              raw_site = "https://" + raw_site[7:]
          elif raw_site and not raw_site.startswith("https://"):
              raw_site = "https://" + raw_site
          parsed = urlparse(raw_site)
          host = (parsed.hostname or "").lower()
          if (
              parsed.scheme != "https"
              or parsed.username
              or parsed.password
              or parsed.port is not None
              or parsed.path not in {"", "/"}
              or parsed.query
              or parsed.fragment
              or host != f"{expected_site}.netlify.app"
              or not re.fullmatch(r"[a-z0-9-]{6,64}", deploy_id)
          ):
              raise SystemExit("ERREUR: identité du site/deploy Netlify inattendue.")
          permalink = f"https://{deploy_id}--{host}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"PRODUCTION_PERMALINK={permalink}\n")
          PY

      - name: Refuser le même deploy deux fois
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PREVIEW_PERMALINK" = "$PRODUCTION_PERMALINK" ]; then
            echo "ERREUR: preview et production-candidate doivent être deux deploys distincts." >&2
            exit 1
          fi

      - name: Prouver le production-candidate immuable
        run: python3 scripts/validate_web_release_http.py "$PRODUCTION_PERMALINK" --context production-candidate --same-netlify-site-as "$PREVIEW_PERMALINK" --expected-sha "$GITHUB_SHA"

      - name: Écrire la preuve staging non sensible
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          proof = {
              "schema_version": 1,
              "source_sha": os.environ["GITHUB_SHA"],
              "site_name": os.environ["NETLIFY_SITE_NAME"],
              "preview_permalink": os.environ["PREVIEW_PERMALINK"],
              "production_candidate_permalink": os.environ["PRODUCTION_PERMALINK"],
              "production_promoted": False,
              "dns_changed": False,
          }
          with open("netlify-staging-proof.json", "w", encoding="utf-8") as fh:
              json.dump(proof, fh, ensure_ascii=False, sort_keys=True, indent=2)
              fh.write("\n")
          PY

      - name: Téléverser la preuve staging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: netlify-staging-proof-${{ github.sha }}
          path: netlify-staging-proof.json
          if-no-files-found: error
          retention-days: 14

      - name: Résumer la preuve pré-DNS
        if: success()
        shell: bash
        run: |
          {
            echo "### Netlify staging — preuve combinée"
            printf '%s\n' "- Ref : $GITHUB_REF"
            printf '%s\n' "- SHA source : $GITHUB_SHA"
            printf '%s\n' "- Site Netlify : $NETLIFY_SITE_NAME"
            printf '%s\n' "- Preview immuable : $PREVIEW_PERMALINK — **PASS**"
            printf '%s\n' "- Production-candidate immuable : $PRODUCTION_PERMALINK — **PASS**"
            echo "- Deux deploys distincts : **oui**"
            echo "- Même site : **oui**"
            echo "- Promotion production Netlify : **non**"
            echo "- DNS : **inchangé**"
            echo "- Verdict : **PRÊT POUR LE GATE DNS CONTRÔLÉ**"
          } >> "$GITHUB_STEP_SUMMARY"
