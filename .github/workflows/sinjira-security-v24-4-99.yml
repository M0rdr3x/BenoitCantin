name: Validation sécurité SINJIRA V24.4.99

on:
  pull_request:
    paths:
      - 'assets/js/sinjira-recovery-v24-4-99.js'
      - 'assets/js/sinjira-security-v24-4-99.js'
      - 'compte/reinitialiser-mot-de-passe.html'
      - 'compte/securite.html'
      - 'mobile-native/**'
      - 'supabase/migrations/**'
      - 'supabase/production-migration-ledger.txt'
      - 'DOMAIN_MIGRATION_SINJIRA.md'
      - '.github/CODEOWNERS'
      - '.github/workflows/main-governance.yml'
      - '.github/workflows/sinjira-security-v24-4-99.yml'
      - 'scripts/validate_security_v24_4_99.py'
      - 'scripts/validate_security_v24_4_99_workflow_security.py'
      - 'scripts/validate_auth.py'
      - 'scripts/validate_production_migration_ledger.py'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Auto-tester le contrat CI V24.4.99
        run: python scripts/validate_security_v24_4_99_workflow_security.py --self-test
      - name: Vérifier le contrat CI V24.4.99
        run: python scripts/validate_security_v24_4_99_workflow_security.py
      - name: Valider V24.4.99
        run: python scripts/validate_security_v24_4_99.py
      - name: Revalider les parcours Auth
        run: python scripts/validate_auth.py
      - name: Revalider le ledger production
        run: python scripts/validate_production_migration_ledger.py
