name: Sécurité PWA — ne jamais conserver les réponses privées

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-private-cache:
    name: Refuser le cache PWA des sessions et des données privées
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Node 22 vérifié
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
      - name: Vérifier la syntaxe du service worker
        run: node --check sw.js
      - name: Tester le véritable service worker avec données synthétiques
        run: node --test scripts/test_service_worker_cache_boundary.cjs
      - name: Vérifier le contrat des ressources PWA
        run: python3 scripts/validate_pwa.py
      - name: Contrôler la frontière du cache et le contrat social
        run: python3 scripts/validate_social_rls_contract.py
