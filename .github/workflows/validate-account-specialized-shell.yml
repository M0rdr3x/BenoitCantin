name: Compte SINJIRA — inventaire et pages spécialisées

on:
  pull_request:
    paths:
      - 'compte/*.html'
      - 'scripts/validate_account_specialized_shell.py'
      - '.github/workflows/validate-account-specialized-shell.yml'
  push:
    branches: [ main ]
    paths:
      - 'compte/*.html'
      - 'scripts/validate_account_specialized_shell.py'
      - '.github/workflows/validate-account-specialized-shell.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Vérifier l’inventaire et les pages spécialisées du compte
        run: python scripts/validate_account_specialized_shell.py
      - name: Vérifier les appels de modération existants
        run: python scripts/validate_moderation_appeals_v24_4_90.py
