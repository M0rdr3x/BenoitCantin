name: Fracture — Édition Déduction simplifiée

on:
  pull_request:
    paths:
      - 'projets/sinjira/jeux/**'
      - 'assets/media/sinjira-fracture-deduction-simplifiee-*.webp'
      - 'sitemap.xml'
      - 'scripts/validate_fracture_deduction_simplifiee.py'
      - '.github/workflows/validate-fracture-deduction-simplifiee.yml'
  push:
    branches: [main]
    paths:
      - 'projets/sinjira/jeux/**'
      - 'assets/media/sinjira-fracture-deduction-simplifiee-*.webp'
      - 'sitemap.xml'
      - 'scripts/validate_fracture_deduction_simplifiee.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Vérifier Fracture — Déduction simplifiée
        run: python scripts/validate_fracture_deduction_simplifiee.py
