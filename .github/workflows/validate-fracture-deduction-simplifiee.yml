name: Fracture — Édition Déduction simplifiée

on:
  pull_request:
    paths:
      - 'projets/sinjira/jeux/**'
      - 'assets/media/sinjira-fracture-deduction-simplifiee-*.webp'
      - 'sitemap.xml'
      - 'scripts/validate_fracture_deduction_simplifiee.py'
      - '.github/workflows/validate-fracture-deduction-simplifiee.yml'
  push:
    branches: [main]
    paths:
      - 'projets/sinjira/jeux/**'
      - 'assets/media/sinjira-fracture-deduction-simplifiee-*.webp'
      - 'sitemap.xml'
      - 'scripts/validate_fracture_deduction_simplifiee.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Vérifier Fracture — Déduction simplifiée
        run: python scripts/validate_fracture_deduction_simplifiee.py
