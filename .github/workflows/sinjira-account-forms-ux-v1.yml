name: UX SINJIRA — Formulaires du compte V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'compte/connexion.html'
      - 'compte/mot-de-passe-oublie.html'
      - 'compte/reinitialiser-mot-de-passe.html'
      - 'compte/inscription.html'
      - 'compte/profil.html'
      - 'compte/parametres.html'
      - 'assets/js/sinjira-password-visibility-v1.js'
      - 'assets/js/sinjira-form-feedback-v1.js'
      - 'tests/e2e/test_auth_forms_responsive.py'
      - 'assets/css/sinjira-forms-ux-v1.css'
      - 'scripts/validate_sinjira_account_forms_ux_v1.py'
      - 'tests/e2e/test_public_site.py'
      - '.github/workflows/sinjira-account-forms-ux-v1.yml'
  push:
    branches: [main]
    paths:
      - 'compte/connexion.html'
      - 'compte/mot-de-passe-oublie.html'
      - 'compte/reinitialiser-mot-de-passe.html'
      - 'compte/inscription.html'
      - 'compte/profil.html'
      - 'compte/parametres.html'
      - 'assets/js/sinjira-password-visibility-v1.js'
      - 'assets/js/sinjira-form-feedback-v1.js'
      - 'tests/e2e/test_auth_forms_responsive.py'
      - 'assets/css/sinjira-forms-ux-v1.css'
      - 'scripts/validate_sinjira_account_forms_ux_v1.py'
      - 'tests/e2e/test_public_site.py'
      - '.github/workflows/sinjira-account-forms-ux-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-formulaires:
    name: Formulaires accessibles et droits préservés
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Contrôler les libellés et les sections facultatives
        run: python3 scripts/validate_sinjira_account_forms_ux_v1.py
      - name: Vérifier la syntaxe JS
        run: |
          node --check assets/js/sinjira-password-visibility-v1.js
          node --check assets/js/sinjira-form-feedback-v1.js
      - name: Vérifier les contrats de sécurité des comptes
        run: python3 scripts/validate_account_auth_security_shell.py
      - name: Vérifier la réception Auth/Registre sans accès privé
        run: python3 scripts/validate_sinjira_signup_registry_delivery.py
