permissions:
  contents: read
jobs:
  verifications:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verifier les calculs et la provenance
        run: node --test projets/projet-nova/tests/*.test.mjs
