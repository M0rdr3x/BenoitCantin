name: Nova-Sinjira - verifications financieres
on:
  push:
    paths:
      - "projets/projet-nova/assets/comparateur-financier-*.mjs"
      - "projets/projet-nova/tests/*.test.mjs"
      - "projets/projet-nova/data/registre-donnees-services-nova-sinjira.json"
      - "projets/projet-nova/data/reperes-financiers-nova-sinjira-2026.json"
      - "projets/projet-nova/data/diagnostic-g0-sante-premiere-ligne-2025.json"
      - "projets/projet-nova/data/dictionnaire-indicateurs-g0-sante.json"
      - "projets/projet-nova/data/portrait-regional-g0-sante-2025.json"
      - "projets/projet-nova/data/matrice-preuves-g0-5-sante.json"
      - "projets/projet-nova/assets/g0-sante-gate-core.mjs"
      - "projets/projet-nova/data/registre-rh-regional-g0-6-sante.json"
      - "projets/projet-nova/assets/g06-capacite-rh-core.mjs"
      - "projets/projet-nova/capacite-rh-g0-6-sante.html"
      - "projets/projet-nova/preuves-g0-5-sante.html"
      - "projets/projet-nova/data/portrait-regional-g0-sante-2025.csv"
      - "projets/projet-nova/portrait-regional-g0-sante.html"
      - "projets/projet-nova/indicateurs-g0-sante.html"
      - "projets/projet-nova/data/plan-acquisition-donnees-g0-sante.json"
      - "projets/projet-nova/diagnostic-g0-sante.html"
      - ".github/workflows/nova-sinjira-finances-tests.yml"
  pull_request:
    paths:
      - "projets/projet-nova/assets/comparateur-financier-*.mjs"
      - "projets/projet-nova/tests/*.test.mjs"
      - "projets/projet-nova/data/registre-donnees-services-nova-sinjira.json"
      - "projets/projet-nova/data/reperes-financiers-nova-sinjira-2026.json"
      - "projets/projet-nova/data/diagnostic-g0-sante-premiere-ligne-2025.json"
      - "projets/projet-nova/data/dictionnaire-indicateurs-g0-sante.json"
      - "projets/projet-nova/data/portrait-regional-g0-sante-2025.json"
      - "projets/projet-nova/data/matrice-preuves-g0-5-sante.json"
      - "projets/projet-nova/assets/g0-sante-gate-core.mjs"
      - "projets/projet-nova/data/registre-rh-regional-g0-6-sante.json"
      - "projets/projet-nova/assets/g06-capacite-rh-core.mjs"
      - "projets/projet-nova/capacite-rh-g0-6-sante.html"
      - "projets/projet-nova/preuves-g0-5-sante.html"
      - "projets/projet-nova/data/portrait-regional-g0-sante-2025.csv"
      - "projets/projet-nova/portrait-regional-g0-sante.html"
      - "projets/projet-nova/indicateurs-g0-sante.html"
      - "projets/projet-nova/data/plan-acquisition-donnees-g0-sante.json"
      - "projets/projet-nova/diagnostic-g0-sante.html"
      - ".github/workflows/nova-sinjira-finances-tests.yml"
permissions:
  contents: read
jobs:
  verifications:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
      - name: Verifier les calculs et la provenance
        run: node --test projets/projet-nova/tests/*.test.mjs
