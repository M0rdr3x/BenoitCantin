name: Validation sécurité mineurs V24.4.82

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'assets/js/sinjira-social-common.js'
      - 'assets/js/sinjira-social-safety-v24-4-79.js'
      - 'assets/js/sinjira-social-safety-center-v24-4-79.js'
      - 'assets/js/sinjira-dating-safety-v24-4-78.js'
      - 'assets/js/sinjira-community-rules.js'
      - 'scripts/validate_minor_exploitation_safety_v24_4_82.py'
      - 'scripts/validate_minor_safety_workflow_security.py'
      - '.github/workflows/validate-safety-v24-4-82.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'assets/js/sinjira-social-common.js'
      - 'assets/js/sinjira-social-safety-v24-4-79.js'
      - 'assets/js/sinjira-social-safety-center-v24-4-79.js'
      - 'assets/js/sinjira-dating-safety-v24-4-78.js'
      - 'assets/js/sinjira-community-rules.js'
      - 'scripts/validate_minor_exploitation_safety_v24_4_82.py'
      - 'scripts/validate_minor_safety_workflow_security.py'
      - '.github/workflows/validate-safety-v24-4-82.yml'

permissions:
  contents: read

jobs:
  safety-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Auto-tester le workflow sécurité mineurs
        run: python scripts/validate_minor_safety_workflow_security.py --self-test
      - name: Vérifier le workflow sécurité mineurs
        run: python scripts/validate_minor_safety_workflow_security.py
      - name: Valider le contrat V24.4.82
        run: python scripts/validate_minor_exploitation_safety_v24_4_82.py
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check assets/js/sinjira-social-common.js
          node --check assets/js/sinjira-social-safety-v24-4-79.js
          node --check assets/js/sinjira-social-safety-center-v24-4-79.js
          node --check assets/js/sinjira-dating-safety-v24-4-78.js
          node --check assets/js/sinjira-community-rules.js
      - name: Vérifier le ledger production
        run: python scripts/validate_production_migration_ledger.py
