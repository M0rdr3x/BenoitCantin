name: SINJIRA V24.5.34 — Copie de référence précommande

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - sinjira-v24.5.34-copy-preorder-reference

permissions:
  contents: read

jobs:
  preorder-reference-copy-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Vérifier V24.5.34
        run: python scripts/validate_preorder_reference_copy_v24_5_34.py
      - name: Vérifier V24.5.33 historique
        run: python scripts/validate_preorder_printable_v24_5_33.py
      - name: Vérifier V24.5.32 historique
        run: python scripts/validate_preorder_receipt_v24_5_32.py
      - name: Vérifier le ledger production inchangé
        run: python scripts/validate_production_migration_ledger.py
