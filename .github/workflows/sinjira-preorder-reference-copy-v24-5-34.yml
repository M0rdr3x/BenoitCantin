name: SINJIRA V24.5.34 — Copie de référence précommande

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - sinjira-v24.5.34-copy-preorder-reference

permissions:
  contents: read

jobs:
  preorder-reference-copy-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Vérifier Python 3.12 du runner Ubuntu 24.04
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), "Python 3.12 requis"'
      - name: Vérifier V24.5.34
        run: python3 scripts/validate_preorder_reference_copy_v24_5_34.py
      - name: Vérifier V24.5.33 historique
        run: python3 scripts/validate_preorder_printable_v24_5_33.py
      - name: Vérifier V24.5.32 historique
        run: python3 scripts/validate_preorder_receipt_v24_5_32.py
      - name: Vérifier le ledger production inchangé
        run: python3 scripts/validate_production_migration_ledger.py
