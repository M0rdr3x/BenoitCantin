name: Compte SINJIRA — shell secondaire

on:
  pull_request:
    paths:
      - 'compte/mes-parties.html'
      - 'compte/documents.html'
      - 'compte/mon-personnage.html'
      - 'compte/communaute.html'
      - 'compte/monde-parallele.html'
      - 'compte/emploi.html'
      - 'compte/marche.html'
      - 'compte/jetons.html'
      - 'scripts/validate_account_secondary_shell.py'
      - '.github/workflows/validate-account-secondary-shell.yml'
  push:
    branches: [ main ]
    paths:
      - 'compte/mes-parties.html'
      - 'compte/documents.html'
      - 'compte/mon-personnage.html'
      - 'compte/communaute.html'
      - 'compte/monde-parallele.html'
      - 'compte/emploi.html'
      - 'compte/marche.html'
      - 'compte/jetons.html'
      - 'scripts/validate_account_secondary_shell.py'
      - '.github/workflows/validate-account-secondary-shell.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Vérifier le shell secondaire du compte
        run: python scripts/validate_account_secondary_shell.py
