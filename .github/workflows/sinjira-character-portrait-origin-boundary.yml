name: SINJIRA — isolation des portraits de personnages

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/sinjira-character-portrait-url.mjs'
      - 'assets/js/sinjira-community-character.js'
      - 'assets/js/sinjira-messages-character.js'
      - 'assets/js/sinjira-mon-personnage.js'
      - 'compte/reseau-personnage.html'
      - 'compte/messages-personnage.html'
      - 'compte/mon-personnage.html'
      - 'scripts/test_character_portrait_origin_boundary.cjs'
      - '.github/workflows/sinjira-character-portrait-origin-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-character-portrait-url.mjs'
      - 'assets/js/sinjira-community-character.js'
      - 'assets/js/sinjira-messages-character.js'
      - 'assets/js/sinjira-mon-personnage.js'
      - 'compte/reseau-personnage.html'
      - 'compte/messages-personnage.html'
      - 'compte/mon-personnage.html'
      - 'scripts/test_character_portrait_origin_boundary.cjs'
      - '.github/workflows/sinjira-character-portrait-origin-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portrait-origin:
    name: Refuser les portraits provenant de domaines tiers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Node épinglé
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Contrat de syntaxe ESM et tests
        run: |
          node --check assets/js/sinjira-character-portrait-url.mjs
          node --check assets/js/sinjira-community-character.js
          node --check assets/js/sinjira-messages-character.js
          node --check assets/js/sinjira-mon-personnage.js
          node --check scripts/test_character_portrait_origin_boundary.cjs
      - name: Vérifier les trois interfaces avec chemins non fiables
        run: node scripts/test_character_portrait_origin_boundary.cjs
