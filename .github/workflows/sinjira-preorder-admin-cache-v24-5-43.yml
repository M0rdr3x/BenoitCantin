name: SINJIRA V24.5.43 — Convergence cache admin

on:
  pull_request:
    paths:
      - 'admin/sinjira/precommandes.html'
      - 'PREORDER_ADMIN_CACHE_CONVERGENCE_V24_5_43.md'
      - 'scripts/validate_preorder_admin_cache_v24_5_43.py'
      - 'supabase/production-migration-ledger.txt'
      - '.github/workflows/sinjira-preorder-admin-cache-v24-5-43.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Valider V24.5.43
        run: python3 scripts/validate_preorder_admin_cache_v24_5_43.py
      - name: Valider le ledger production inchangé
        run: python3 scripts/validate_production_migration_ledger.py
