name: SINJIRA V25 — Frontière self-only Mode Voyage

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260821222514_sinjira_v24_4_98_account_security_center.sql'
      - 'supabase/migrations/20260821222615_sinjira_v24_4_98_security_rpc.sql'
      - 'supabase/migrations/20260822201257_sinjira_v24_5_10_security_rpc_boundary.sql'
      - 'supabase/migrations/20260911001000_sinjira_v25_travel_mode_country_normalization.sql'
      - 'supabase/migrations/20260914223000_sinjira_v25_travel_mode_client_visibility_boundary.sql'
      - 'supabase/migrations/20260921005000_sinjira_v25_travel_mode_internal_response_minimization.sql'
      - 'supabase/tests/security_travel_self_only_v25.test.sql'
      - 'scripts/validate_security_travel_self_only_v25.py'
      - '.github/workflows/sinjira-security-travel-self-only-v25.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260821222514_sinjira_v24_4_98_account_security_center.sql'
      - 'supabase/migrations/20260821222615_sinjira_v24_4_98_security_rpc.sql'
      - 'supabase/migrations/20260822201257_sinjira_v24_5_10_security_rpc_boundary.sql'
      - 'supabase/migrations/20260911001000_sinjira_v25_travel_mode_country_normalization.sql'
      - 'supabase/migrations/20260914223000_sinjira_v25_travel_mode_client_visibility_boundary.sql'
      - 'supabase/migrations/20260921005000_sinjira_v25_travel_mode_internal_response_minimization.sql'
      - 'supabase/tests/security_travel_self_only_v25.test.sql'
      - 'scripts/validate_security_travel_self_only_v25.py'
      - '.github/workflows/sinjira-security-travel-self-only-v25.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Vérifier l'isolation des voyages par compte
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Vérifier la syntaxe du garde-fou
        run: python3 -m py_compile scripts/validate_security_travel_self_only_v25.py

      - name: Auto-tester le garde-fou
        run: python3 scripts/validate_security_travel_self_only_v25.py --self-test

      - name: Vérifier la frontière self-only
        run: python3 scripts/validate_security_travel_self_only_v25.py
