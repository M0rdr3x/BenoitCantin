name: Sécurité — répétition migration MAINTAIN PG17

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/tests/postgres17_maintain_postcheck.test.sql'
      - 'supabase/tests/security_advisor_contract_v24_5_24.test.sql'
      - 'supabase/tests/privileged_rpc_effective_acl.test.sql'
      - '.github/workflows/postgres17-maintain-remediation.yml'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Installer Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: 2.111.0
      - name: Vérifier l'intégrité de la migration validée
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '9f77166a8e87388b2ec37595dbe25916f81ed7b58368608104f1bf26961f5821' 'supabase/migrations/20261127230813_sinjira_pg17_maintain_least_privilege.sql' | sha256sum --check --strict
      - name: Rejouer les migrations sur la pile locale isolée
        run: supabase start
      - name: Contrôler la migration et ses postconditions
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --local
          supabase test db supabase/tests/postgres17_maintain_postcheck.test.sql --local
          supabase test db supabase/tests/security_advisor_contract_v24_5_24.test.sql --local
          supabase test db supabase/tests/privileged_rpc_effective_acl.test.sql --local
      - name: Arrêter la pile locale
        if: always()
        run: supabase stop --no-backup || true
