name: SINJIRA — Sécurité des métadonnées photo

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/submit-character-questionnaire/index.ts'
      - 'scripts/test_sinjira_registry_photo_metadata.cjs'
      - 'scripts/test_sinjira_registry_photo_binary.cjs'
      - 'security/candidates/registry_source_insert_mfa.sql'
      - 'scripts/validate_registry_source_insert_mfa.py'
      - '.github/workflows/sinjira-registry-photo-metadata-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/submit-character-questionnaire/index.ts'
      - 'scripts/test_sinjira_registry_photo_metadata.cjs'
      - 'scripts/test_sinjira_registry_photo_binary.cjs'
      - 'security/candidates/registry_source_insert_mfa.sql'
      - 'scripts/validate_registry_source_insert_mfa.py'
      - '.github/workflows/sinjira-registry-photo-metadata-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  photo-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Contrôler les métadonnées Storage et les chemins
        run: |
          node scripts/test_sinjira_registry_photo_metadata.cjs
          node scripts/test_sinjira_registry_photo_binary.cjs
          node scripts/test_sinjira_character_photo_path.cjs
          python3 scripts/validate_character_questionnaire_security.py
          python3 scripts/validate_registry_source_insert_mfa.py
