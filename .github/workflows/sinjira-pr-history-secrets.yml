name: Sécurité — secrets dans tous les commits de la PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  historical-secrets:
    name: Refuser les secrets même retirés avant la revue
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout du SHA exact de la PR, historique complet
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exiger Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'

      - name: Tester les commits synthétiques ajoutés puis retirés
        run: python3 -m unittest scripts.test_pr_commit_secrets -v

      - name: Scanner chaque fichier modifié de chaque commit de PR
        env:
          GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/validate_pr_commit_secrets.py \
            --base "$GUARD_BASE_SHA" \
            --head "$GUARD_HEAD_SHA"
