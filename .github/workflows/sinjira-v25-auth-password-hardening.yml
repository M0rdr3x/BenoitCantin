name: SINJIRA V25 — Durcissement Auth mots de passe compromis

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Saisir exactement ENABLE-SINJIRA-V25-LEAKED-PASSWORD-PROTECTION"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sinjira-v25-auth-leaked-password-hardening-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: gpvivleexywljowcqkru
  SUPABASE_ORGANIZATION_SLUG: glaxqwyumblfqmzusqbt
  SUPABASE_MANAGEMENT_API: https://api.supabase.com/v1

jobs:
  enable-leaked-password-protection:
    name: Activer la protection HIBP en production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Vérifier la confirmation et le jeton
        shell: bash
        env:
          AUTH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$AUTH_CONFIRMATION" = "ENABLE-SINJIRA-V25-LEAKED-PASSWORD-PROTECTION" || {
            echo "Confirmation invalide; aucune configuration Auth n'est modifiée." >&2
            exit 1
          }
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "Secret SUPABASE_ACCESS_TOKEN manquant." >&2
            exit 1
          }

      - name: Checkout de main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Vérifier le contrat statique du workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_auth_password_hardening_workflow.py

      - name: Vérifier l’éligibilité du plan Supabase
        shell: bash
        run: |
          set -euo pipefail
          organization="$RUNNER_TEMP/supabase-organization.json"
          curl --fail-with-body --silent --show-error \
            "$SUPABASE_MANAGEMENT_API/organizations/$SUPABASE_ORGANIZATION_SLUG" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Accept: application/json' \
            --output "$organization"

          ORGANIZATION="$organization" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["ORGANIZATION"]).read_text(encoding="utf-8"))
          if not isinstance(payload, dict):
              raise SystemExit("Organisation Supabase distante illisible.")
          plan = payload.get("plan")
          eligible = {"pro", "team", "enterprise"}
          if plan not in eligible:
              raise SystemExit(
                  f"Activation HIBP bloquée avant PATCH: plan Supabase={plan!r}; "
                  "Supabase réserve cette fonction aux plans Pro et supérieurs."
              )
          print(f"Éligibilité HIBP confirmée: plan Supabase={plan}.")
          PY

      - name: Lire et borner la configuration Auth actuelle
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/auth-config-before.json"
          curl --fail-with-body --silent --show-error \
            "$SUPABASE_MANAGEMENT_API/projects/$SUPABASE_PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Accept: application/json' \
            --output "$before"

          AUTH_CONFIG="$before" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["AUTH_CONFIG"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(payload, dict):
              raise SystemExit("Configuration Auth distante illisible.")

          minimum = payload.get("password_min_length")
          hibp = payload.get("password_hibp_enabled")
          if not isinstance(minimum, int) or minimum < 12:
              raise SystemExit(
                  f"Précondition refusée: password_min_length={minimum!r}; SINJIRA exige au moins 12."
              )
          if not isinstance(hibp, bool):
              raise SystemExit("Champ password_hibp_enabled absent ou invalide.")

          stable = dict(payload)
          stable.pop("password_hibp_enabled", None)
          digest = hashlib.sha256(
              json.dumps(stable, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          Path(os.environ["RUNNER_TEMP"], "auth-config-before.sha256").write_text(digest, encoding="ascii")

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as handle:
              handle.write(f"already_enabled={'true' if hibp else 'false'}\n")

          print(f"Préflight Auth: longueur minimale={minimum}; HIBP={'déjà actif' if hibp else 'inactif' }.")
          PY

      - name: Activer uniquement la protection contre les mots de passe compromis
        if: steps.preflight.outputs.already_enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/auth-config-patch-response.json"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            "$SUPABASE_MANAGEMENT_API/projects/$SUPABASE_PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json' \
            --data '{"password_hibp_enabled":true}' \
            --output "$response"
          echo "PATCH Auth borné accepté par la Management API."

      - name: Vérifier que seul HIBP a changé
        shell: bash
        run: |
          set -euo pipefail
          after="$RUNNER_TEMP/auth-config-after.json"
          curl --fail-with-body --silent --show-error \
            "$SUPABASE_MANAGEMENT_API/projects/$SUPABASE_PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Accept: application/json' \
            --output "$after"

          AUTH_CONFIG="$after" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["AUTH_CONFIG"]).read_text(encoding="utf-8"))
          if not isinstance(payload, dict):
              raise SystemExit("Configuration Auth post-PATCH illisible.")
          if payload.get("password_hibp_enabled") is not True:
              raise SystemExit("ÉCHEC: password_hibp_enabled n'est pas true après l'opération.")
          minimum = payload.get("password_min_length")
          if not isinstance(minimum, int) or minimum < 12:
              raise SystemExit(f"ÉCHEC: password_min_length a régressé ({minimum!r}).")

          stable = dict(payload)
          stable.pop("password_hibp_enabled", None)
          after_digest = hashlib.sha256(
              json.dumps(stable, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          before_digest = Path(os.environ["RUNNER_TEMP"], "auth-config-before.sha256").read_text(encoding="ascii").strip()
          if after_digest != before_digest:
              raise SystemExit(
                  "ÉCHEC: un autre paramètre Auth a changé pendant l'opération. "
                  "Aucun rollback automatique n'est tenté pour ne pas écraser un changement concurrent."
              )
          print(f"Postflight Auth: HIBP actif; longueur minimale toujours {minimum}; aucun autre paramètre modifié.")
          PY

      - name: Vérifier la disparition du WARN Security Advisor
        shell: bash
        run: |
          set -euo pipefail
          advisor="$RUNNER_TEMP/security-advisor.json"
          for attempt in 1 2 3 4 5 6; do
            curl --fail-with-body --silent --show-error \
              "$SUPABASE_MANAGEMENT_API/projects/$SUPABASE_PROJECT_REF/advisors/security" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Accept: application/json' \
              --output "$advisor"

            if ADVISOR="$advisor" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["ADVISOR"]).read_text(encoding="utf-8"))
          def contains_warn(value):
              if isinstance(value, dict):
                  if value.get("name") == "auth_leaked_password_protection":
                      return True
                  return any(contains_warn(v) for v in value.values())
              if isinstance(value, list):
                  return any(contains_warn(v) for v in value)
              return False
          raise SystemExit(1 if contains_warn(payload) else 0)
          PY
            then
              echo "OK Security Advisor: auth_leaked_password_protection a disparu."
              exit 0
            fi
            echo "Security Advisor encore en cours de rafraîchissement (tentative $attempt/6)."
            sleep 10
          done
          echo "La configuration Auth est active, mais le Security Advisor expose encore le WARN après 6 vérifications." >&2
          exit 1

      - name: Résumé
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF'
          Durcissement Auth SINJIRA V25 terminé.
          Seul password_hibp_enabled a été autorisé à passer à true.
          Aucun mot de passe utilisateur, fournisseur Auth, secret, schéma SQL ou Edge Function n'a été modifié.
          EOF
