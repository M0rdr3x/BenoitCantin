name: NOVA sondage - tests PostgreSQL locaux confidentialité V7 (aucun vote réel)

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/NOVA_POLL_SCHEMA_PREDEPLOY.sql"
      - "tests/security/sql/nova_poll_v7_*.sql"
      - "tests/security/test_nova_poll_v7_disposable_contract.py"
      - "docs/nova-sondages/rapport-prevol-prive-postgresql-v7-2026-11-09.md"
      - ".github/workflows/nova-poll-v7-sql-private-lab.yml"
  push:
    branches: [main]
    paths:
      - "supabase/NOVA_POLL_SCHEMA_PREDEPLOY.sql"
      - "tests/security/sql/nova_poll_v7_*.sql"
      - "tests/security/test_nova_poll_v7_disposable_contract.py"
      - "docs/nova-sondages/rapport-prevol-prive-postgresql-v7-2026-11-09.md"
      - ".github/workflows/nova-poll-v7-sql-private-lab.yml"

permissions:
  contents: read

concurrency:
  group: nova-poll-v7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-isolated-schema:
    name: Rejouer la migration du sondage dans PostgreSQL jetable et mesurer les seuils
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: nova_poll_v7_disposable
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd=pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - name: Source exacte sans persistance de credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Contrat Python statique sans réseau ni comptes
        run: python3 -m unittest discover -s tests/security -p test_nova_poll_v7_disposable_contract.py -v
      - name: Schéma Git dans une base locale jetable seulement
        env:
          PGCONNECT_TIMEOUT: '10'
        run: |
          psql --no-psqlrc -h 127.0.0.1 -U postgres -d nova_poll_v7_disposable -v ON_ERROR_STOP=1 -f tests/security/sql/nova_poll_v7_lab_setup.sql
      - name: RPC inaccessible au public et anti-rejeu sur bulletins fictifs
        env:
          PGCONNECT_TIMEOUT: '10'
        run: |
          psql --no-psqlrc -h 127.0.0.1 -U postgres -d nova_poll_v7_disposable -v ON_ERROR_STOP=1 -f tests/security/sql/nova_poll_v7_security_replay.sql
      - name: Délai de six heures et suppression des écarts de un à quatre bulletins
        env:
          PGCONNECT_TIMEOUT: '10'
        run: |
          psql --no-psqlrc -h 127.0.0.1 -U postgres -d nova_poll_v7_disposable -v ON_ERROR_STOP=1 -f tests/security/sql/nova_poll_v7_private_batches.sql
      - name: Décision contrôlée - l'homologation reste interdite
        run: echo 'NOVA-POLL-V7-LAB-ONLY: aucun vote réel; le sondage reste fermé, 6/11 critères, pas de prévol privé complet ni GO.'
