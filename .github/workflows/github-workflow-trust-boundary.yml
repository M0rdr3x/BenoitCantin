name: Sécurité — contrôle transversal des workflows GitHub

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-workflow-trust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-trust-boundary:
    name: Refuser les escalades de privilèges CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans jeton persistant
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python épinglé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Tests négatifs des permissions et des déclencheurs
        run: python3 scripts/test_github_workflow_trust_boundary.py
      - name: Contrôle complet du dépôt
        run: python3 scripts/validate_github_workflow_trust_boundary.py --check
