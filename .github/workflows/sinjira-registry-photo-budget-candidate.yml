name: Sécurité — candidat quota photo partagé local
on:
  pull_request:
    branches: [main]
    paths:
      - 'security/candidates/registry_photo_budget*.sql'
      - 'security/candidates/registry-photo-budget.mjs'
      - 'scripts/test_registry_photo_budget_concurrency.py'
      - 'scripts/test_registry_photo_budget_rpc.mjs'
      - '.github/workflows/sinjira-registry-photo-budget-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'security/candidates/registry_photo_budget*.sql'
      - 'security/candidates/registry-photo-budget.mjs'
      - 'scripts/test_registry_photo_budget_concurrency.py'
      - 'scripts/test_registry_photo_budget_rpc.mjs'
      - '.github/workflows/sinjira-registry-photo-budget-candidate.yml'
permissions:
  contents: read
jobs:
  local-registry-photo-quota:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Tester le contrat RPC candidat
        run: node scripts/test_registry_photo_budget_rpc.mjs
      - name: Démarrer Supabase local
        run: supabase start
      - name: Vérifier ACL, limites, compteurs et expiration
        shell: bash
        run: |
          set -euo pipefail
          candidate=security/candidates/registry_photo_budget.sql
          test "$(tail -n 1 "$candidate")" = 'ROLLBACK;'
          { head -n -1 "$candidate"; cat security/candidates/registry_photo_budget_assertions.sql; } | env -i PATH="$PATH" PGPASSWORD=postgres PGCONNECT_TIMEOUT=5 psql -X -w -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres
      - name: Tester les connexions concurrentes isolées
        run: python3 scripts/test_registry_photo_budget_concurrency.py
      - name: Nettoyer Supabase local
        if: always()
        run: supabase stop --no-backup || true
