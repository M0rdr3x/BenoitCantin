name: Projet Nova P55G - Recus d integrite locaux sans certification
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p55g.yml"
      - "scripts/controler_integrite_pieces_nova_p55g.py"
      - "scripts/tests/test_controler_integrite_pieces_nova_p55g.py"
      - "scripts/verifier_interpretation_sources_nova_p55f.py"
      - "scripts/prioriser_pieces_manquantes_nova_p55e.py"
      - "scripts/preparer_dossier_experts_nova_p55d.py"
      - "scripts/rapprocher_pieces_documentaires_nova_p55c.py"
      - "scripts/controler_acquisition_sources_nova_p55b.py"
      - "projets/projet-nova/etudes/P55G_*"
      - "projets/projet-nova/etudes/P55F_*"
      - "projets/projet-nova/etudes/P55E_*"
      - "projets/projet-nova/etudes/P55D_*"
      - "projets/projet-nova/etudes/P55C_*"
      - "projets/projet-nova/etudes/P55B_*"
      - "projets/projet-nova/etudes/P54Q_*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier-recus-prives-synthetiques:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Parseur PDF epingle sur P54Q
        run: python -m pip install pypdf==5.9.0
      - name: Lancer 70 tests de copies et recus synthetiques
        run: |
          python -m py_compile scripts/controler_integrite_pieces_nova_p55g.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
              "scripts/tests",pattern="test_controler_integrite_pieces_nova_p55g.py")
          assert suite.countTestCases()==70,suite.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
      - name: Generer un plan et un bilan neutres sans PDF ni SHA prive
        run: |
          python scripts/controler_integrite_pieces_nova_p55g.py \
            --plan-public p55g_plan_neutre.json --bilan-public p55g_bilan_neutre.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path("p55g_plan_neutre.json").read_text("utf8"))
          report=json.loads(Path("p55g_bilan_neutre.json").read_text("utf8"))
          assert report["schema_version"]=="P55G-BILAN-PUBLIC-1"
          assert report["copies_attendues"]==2
          assert report["copies_locales_fournies"]==0
          assert report["positions_nfkc_reproduites_techniquement"]==0
          assert report["recu_prive_recontrole_octets"] is False
          assert report["recu_prive_est_attestation_de_provenance"] is False
          assert report["avis_professionnels_authentifies"]==0
          assert report["economies_certifiees_cad"] is None
          assert report["decision"]=="NO_GO_AUTOMATIQUE"
          assert plan["recu_n_est_pas_signature"] is True
          assert plan["aucun_pdf_telecharge_automatiquement"] is True
          assert len(plan["sources_officielles_a_obtenir"])==2
          for d in (plan,report):
              raw=json.dumps(d)
              assert "sha256" not in raw and "offset_texte" not in raw
              assert "/hors_git" not in raw
          PY
      - name: Forcer refus des chemins partiels et de l authenticite automatique
        run: |
          set +e
          python scripts/controler_integrite_pieces_nova_p55g.py --exiger-authenticite
          status=$?
          set -e
          test "$status" -eq 3
          set +e
          python scripts/controler_integrite_pieces_nova_p55g.py --ville-pdf "$RUNNER_TEMP/inexistant.pdf"
          status=$?
          set -e
          test "$status" -eq 2
      - name: Archiver exclusivement deux sorties publiques neutres
        uses: actions/upload-artifact@v4
        with:
          name: nova-p55g-integrite-bilan-plan-neutres
          path: |
            p55g_plan_neutre.json
            p55g_bilan_neutre.json
          retention-days: 7
