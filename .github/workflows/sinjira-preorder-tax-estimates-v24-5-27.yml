name: SINJIRA V24.5.27 — Estimation fiscale indicative

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260823195851_sinjira_v24_5_27_preorder_tax_estimate_preparation.sql'
      - 'supabase/migrations/20260823200303_sinjira_v24_5_27_tax_rate_precision_hardening.sql'
      - 'supabase/migrations/20260823201127_sinjira_v24_5_27_tax_input_and_readiness_hardening.sql'
      - 'supabase/tests/preorder_tax_estimates_v24_5_27.test.sql'
      - 'supabase/production-migration-ledger.txt'
      - 'assets/js/sinjira-admin-preorder-tax-v24-5-27.js'
      - 'assets/js/sinjira-preorder-tax-estimate-v24-5-27.js'
      - 'assets/js/sinjira-admin-preorder-readiness-v24-5-26.js'
      - 'assets/js/sinjira-preorder-fulfillment-v24-5-6.js'
      - 'PREORDER_TAX_ESTIMATES_V24_5_27.md'
      - 'scripts/validate_preorder_tax_estimates_v24_5_27.py'
      - 'scripts/validate_production_migration_ledger.py'
      - 'scripts/validate_production_schema_manifest.py'
      - '.github/workflows/sinjira-preorder-tax-estimates-v24-5-27.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260823195851_sinjira_v24_5_27_preorder_tax_estimate_preparation.sql'
      - 'supabase/migrations/20260823200303_sinjira_v24_5_27_tax_rate_precision_hardening.sql'
      - 'supabase/migrations/20260823201127_sinjira_v24_5_27_tax_input_and_readiness_hardening.sql'
      - 'supabase/tests/preorder_tax_estimates_v24_5_27.test.sql'
      - 'assets/js/sinjira-admin-preorder-tax-v24-5-27.js'
      - 'assets/js/sinjira-preorder-tax-estimate-v24-5-27.js'
      - 'PREORDER_TAX_ESTIMATES_V24_5_27.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Valider V24.5.27
        run: python scripts/validate_preorder_tax_estimates_v24_5_27.py
      - name: Valider le ledger production
        run: python scripts/validate_production_migration_ledger.py
      - name: Valider le manifeste du schéma
        run: python scripts/validate_production_schema_manifest.py
      - name: Préserver V24.5.26 comme contrat historique
        run: python scripts/validate_preorder_sale_readiness_v24_5_26.py
