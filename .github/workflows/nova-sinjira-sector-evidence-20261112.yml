name: "Nova–Sinjira — contrôle des preuves des 14 secteurs"
on:
  pull_request:
    branches: [main]
    paths:
      - 'projets/projet-nova/data/registre-donnees-services-nova-sinjira.json'
      - 'scripts/validate_nova_sinjira_sector_evidence_20261112.mjs'
      - 'tests/nova-sinjira-sector-evidence-20261112.test.mjs'
      - '.github/workflows/nova-sinjira-sector-evidence-20261112.yml'
  push:
    branches: [main]
    paths:
      - 'projets/projet-nova/data/registre-donnees-services-nova-sinjira.json'
      - 'scripts/validate_nova_sinjira_sector_evidence_20261112.mjs'
      - 'tests/nova-sinjira-sector-evidence-20261112.test.mjs'
permissions:
  contents: read
jobs:
  register:
    name: "Sources, chiffrage et personnel — aucune estimation inventée"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout sans jeton persistant
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Vérifier le validateur et les 8 cas de régression
        run: |
          node --check scripts/validate_nova_sinjira_sector_evidence_20261112.mjs
          node --test tests/nova-sinjira-sector-evidence-20261112.test.mjs
      - name: Afficher le rapport de preuves (aucun pourcentage)
        run: |
          node scripts/validate_nova_sinjira_sector_evidence_20261112.mjs > /tmp/nova-sinjira-evidence.json
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const d=JSON.parse(readFileSync("/tmp/nova-sinjira-evidence.json","utf8"));
            if(!d.validStructure||d.totals.sectors!==14||
               d.global_completion_percent!==null||d.delivery_date!==null)
              process.exit(1);
            console.log(JSON.stringify({structure:d.validStructure,totaux:d.totals,
              avertissement:d.scope},null,2));
          '
      - name: Publication interdite sans homologation
        run: |
          echo "CONTROLE_DOCUMENTAIRE_SEULEMENT : aucun secteur pilote ni budget certifié"
