name: SINJIRA — Fracture accusations finales V38
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/sinjira-fracture-accusations-v38.mjs'
      - 'tests/games/test_fracture_accusations_v38.mjs'
      - 'docs/SINJIRA_FRACTURE_ACCUSATIONS_V38.md'
      - '.github/workflows/sinjira-fracture-accusations-v38.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-fracture-accusations-v38.mjs'
      - 'tests/games/test_fracture_accusations_v38.mjs'
      - 'docs/SINJIRA_FRACTURE_ACCUSATIONS_V38.md'
      - '.github/workflows/sinjira-fracture-accusations-v38.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sinjira-fracture-accusations-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Accusations privées et départages sans fuite
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Récupérer sans identifiants persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Vérifier la syntaxe et la compatibilité V36
        run: |
          node --check assets/js/sinjira-fracture-accusations-v38.mjs
          node --test tests/games/test_fracture_mechanics_v36.mjs tests/games/test_fracture_accusations_v38.mjs
      - name: Rejouer le contrat de confidentialité V36
        run: python3 scripts/validate_fracture_mechanics_v36.py
