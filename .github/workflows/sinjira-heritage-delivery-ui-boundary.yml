name: Sécurité SINJIRA — liens privés et actions Héritage

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/sinjira-admin-life-story-v24-5-2.js'
      - 'admin/sinjira/heritage.html'
      - 'scripts/test_sinjira_heritage_delivery_boundary.cjs'
      - '.github/workflows/sinjira-heritage-delivery-ui-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-admin-life-story-v24-5-2.js'
      - 'admin/sinjira/heritage.html'
      - 'scripts/test_sinjira_heritage_delivery_boundary.cjs'
      - '.github/workflows/sinjira-heritage-delivery-ui-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heritage-ui:
    name: Refuser les faux liens privés et les décisions héritage altérées
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Installer Node.js épinglé
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Vérifier la syntaxe de la console et du test
        run: |
          node --check assets/js/sinjira-admin-life-story-v24-5-2.js
          node --check scripts/test_sinjira_heritage_delivery_boundary.cjs
      - name: Tester les vraies fonctions Héritage et les liens 256 bits
        run: node scripts/test_sinjira_heritage_delivery_boundary.cjs
      - name: Régression des frontières SQL et PDF Histoire de vie
        run: |
          python3 scripts/validate_life_story_legacy_v24_5_2.py
          python3 scripts/validate_life_story_export_request_security.py
          python3 scripts/validate_life_story_delivery_error_security.py
