name: SINJIRA — protection XSS du tableau analytique administrateur

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/sinjira-admin.js'
      - 'scripts/test_admin_analytics_dom_xss.mjs'
      - 'scripts/validate_admin_analytics_dom_xss.py'
      - 'supabase/functions/admin-analytics/index.ts'
      - '.github/workflows/sinjira-admin-analytics-dom-xss-security.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-admin.js'
      - 'scripts/test_admin_analytics_dom_xss.mjs'
      - 'scripts/validate_admin_analytics_dom_xss.py'
      - 'supabase/functions/admin-analytics/index.ts'
      - '.github/workflows/sinjira-admin-analytics-dom-xss-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-analytics-dom-xss:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Installer Node.js épinglé
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.2'

      - name: Tester le script administrateur exact sans navigateur ni données réelles
        run: |
          node --check assets/js/sinjira-admin.js
          node --test scripts/test_admin_analytics_dom_xss.mjs

      - name: Refuser les régressions XSS et les changements de périmètre
        run: |
          python3 scripts/validate_admin_analytics_dom_xss.py --self-test
          python3 scripts/validate_admin_analytics_dom_xss.py

      - name: Contrôler le serveur JWT/AAL2 et l'inventaire Edge
        run: |
          python3 scripts/validate_admin_analytics_request_security.py --self-test
          python3 scripts/validate_admin_analytics_request_security.py
          python3 scripts/validate_edge_function_inventory.py
