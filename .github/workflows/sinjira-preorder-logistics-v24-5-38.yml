name: SINJIRA V24.5.38 — Préparation logistique précommandes

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/production-migration-ledger.txt'
      - 'supabase/tests/**'
      - 'assets/js/sinjira-admin-preorder-workflow-v24-5-36.js'
      - 'scripts/validate_preorder_logistics_v24_5_38.py'
      - 'scripts/validate_production_migration_ledger.py'
      - 'PREORDER_LOGISTICS_V24_5_38.md'
      - '.github/workflows/sinjira-preorder-logistics-v24-5-38.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Valider V24.5.38
        run: python3 scripts/validate_preorder_logistics_v24_5_38.py
      - name: Valider le ledger production
        run: python3 scripts/validate_production_migration_ledger.py
