name: SINJIRA V25 — Routage uniforme hubs natifs

on:
  pull_request:
    branches: [main]
    paths:
      - 'compte/*.html'
      - 'mobile-native/App.tsx'
      - 'mobile-native/NativeModuleRouter.tsx'
      - 'mobile-native/NativeHomeHub.tsx'
      - 'mobile-native/NativePersonalAiHub.tsx'
      - 'mobile-native/NativeParallelWorldHub.tsx'
      - 'mobile-native/NativeDatingHub.tsx'
      - 'mobile-native/NativeEmploymentHub.tsx'
      - 'mobile-native/NativeGamesHub.tsx'
      - 'mobile-native/NativeLibraryHub.tsx'
      - 'mobile-native/NativeCommunityHub.tsx'
      - 'mobile-native/NativeCharacterNetworkHub.tsx'
      - 'mobile-native/NativeRelationsHub.tsx'
      - 'mobile-native/NativeCommerceHub.tsx'
      - 'mobile-native/NativeLifeStoryHub.tsx'
      - 'mobile-native/NativeCharacterHub.tsx'
      - 'mobile-native/NativeMessagesHub.tsx'
      - 'mobile-native/NativeAlertsHub.tsx'
      - 'mobile-native/NativeProfileHub.tsx'
      - 'mobile-native/NativePrivacyHub.tsx'
      - 'mobile-native/NativeSettingsHub.tsx'
      - 'mobile-native/NativeSecurityHub.tsx'
      - 'mobile-native/NATIVE_ACCOUNT_ROUTE_CLASSIFICATION_V25.md'
      - 'mobile-native/NATIVE_ROUTE_DISPATCH_V25.md'
      - 'mobile-native/NATIVE_SECONDARY_ROUTE_ALIASES_V25.md'
      - 'mobile-native/NATIVE_GAMES_HUB_V25.md'
      - 'mobile-native/NATIVE_CHARACTER_NETWORK_HUB_V25.md'
      - 'mobile-native/safePublicShare.ts'
      - 'mobile-native/package.json'
      - 'mobile-native/package-lock.json'
      - 'mobile-native/scripts/validate-vault-mobile.mjs'
      - 'scripts/validate_mobile_native_account_route_classification_v25.py'
      - 'scripts/validate_mobile_native_route_dispatch_v25.py'
      - 'scripts/validate_mobile_native_secondary_route_aliases_v25.py'
      - 'scripts/validate_mobile_native_personal_ai_hub_v25.py'
      - 'scripts/validate_mobile_native_parallel_world_hub_v25.py'
      - 'scripts/validate_mobile_native_dating_hub_v25.py'
      - 'scripts/validate_mobile_native_employment_hub_v25.py'
      - 'scripts/validate_mobile_native_games_hub_v25.py'
      - 'scripts/validate_mobile_native_library_hub_v25.py'
      - 'scripts/validate_mobile_native_community_hub_v25.py'
      - 'scripts/validate_mobile_native_character_network_hub_v25.py'
      - 'scripts/validate_mobile_native_relations_hub_v25.py'
      - 'scripts/validate_mobile_native_commerce_hub_v25.py'
      - 'scripts/validate_mobile_native_life_story_hub_v25.py'
      - 'scripts/validate_mobile_native_character_hub_v25.py'
      - 'scripts/validate_mobile_native_messages_hub_v25.py'
      - 'scripts/validate_mobile_native_alerts_hub_v25.py'
      - 'scripts/validate_mobile_native_settings_hub_v25.py'
      - 'scripts/validate_mobile_native_privacy_hub_v25.py'
      - 'scripts/validate_mobile_native_profile_hub_v25.py'
      - 'scripts/validate_mobile_native_home_hub_v25.py'
      - 'scripts/validate_mobile_native_security_hub_v25.py'
      - 'scripts/validate_mobile_navigation_boundary_v25.py'
      - 'scripts/validate_mobile_safe_share_v25.py'
      - 'scripts/validate_device_challenge_client_boundary.py'
      - 'scripts/validate_no_committed_secrets.py'
      - '.github/workflows/sinjira-mobile-native-account-route-classification-v25.yml'
      - '.github/workflows/sinjira-mobile-native-character-network-hub-v25.yml'
      - '.github/workflows/sinjira-mobile-native-secondary-route-aliases-v25.yml'
      - '.github/workflows/sinjira-mobile-native-route-dispatch-v25.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-route-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Revalider la classification exhaustive des routes compte
        run: python3 scripts/validate_mobile_native_account_route_classification_v25.py

      - name: Valider le routage uniforme des hubs natifs V25
        run: python3 scripts/validate_mobile_native_route_dispatch_v25.py

      - name: Revalider les alias secondaires natifs
        run: python3 scripts/validate_mobile_native_secondary_route_aliases_v25.py

      - name: Revalider le hub Mon IA natif
        run: python3 scripts/validate_mobile_native_personal_ai_hub_v25.py

      - name: Revalider le hub Monde parallèle natif
        run: python3 scripts/validate_mobile_native_parallel_world_hub_v25.py

      - name: Revalider le hub Rencontres natif
        run: python3 scripts/validate_mobile_native_dating_hub_v25.py

      - name: Revalider le hub Emploi natif
        run: python3 scripts/validate_mobile_native_employment_hub_v25.py

      - name: Revalider le hub Mes parties natif
        run: python3 scripts/validate_mobile_native_games_hub_v25.py

      - name: Revalider le hub Bibliothèque natif
        run: python3 scripts/validate_mobile_native_library_hub_v25.py

      - name: Revalider le hub Communauté natif
        run: python3 scripts/validate_mobile_native_community_hub_v25.py

      - name: Revalider le hub Réseau personnage natif
        run: python3 scripts/validate_mobile_native_character_network_hub_v25.py

      - name: Revalider le hub Relations natif
        run: python3 scripts/validate_mobile_native_relations_hub_v25.py

      - name: Revalider le hub Commerce natif
        run: python3 scripts/validate_mobile_native_commerce_hub_v25.py

      - name: Revalider le hub Histoire de vie natif
        run: python3 scripts/validate_mobile_native_life_story_hub_v25.py

      - name: Revalider le hub Mon personnage natif
        run: python3 scripts/validate_mobile_native_character_hub_v25.py

      - name: Revalider le hub Messages natif
        run: python3 scripts/validate_mobile_native_messages_hub_v25.py

      - name: Revalider le hub Alertes natif
        run: python3 scripts/validate_mobile_native_alerts_hub_v25.py

      - name: Revalider le hub Paramètres natif
        run: python3 scripts/validate_mobile_native_settings_hub_v25.py

      - name: Revalider le hub Vie privée natif
        run: python3 scripts/validate_mobile_native_privacy_hub_v25.py

      - name: Revalider le hub Profil natif
        run: python3 scripts/validate_mobile_native_profile_hub_v25.py

      - name: Revalider l'accueil natif V25
        run: python3 scripts/validate_mobile_native_home_hub_v25.py

      - name: Revalider le hub Sécurité natif
        run: python3 scripts/validate_mobile_native_security_hub_v25.py

      - name: Revalider la frontière challenge client
        run: python3 scripts/validate_device_challenge_client_boundary.py

      - name: Revalider la frontière de navigation mobile
        run: python3 scripts/validate_mobile_navigation_boundary_v25.py

      - name: Revalider le partage public natif
        run: python3 scripts/validate_mobile_safe_share_v25.py

      - name: Revalider l'absence de secrets suivis
        run: python3 scripts/validate_no_committed_secrets.py

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile-native/package.json

      - name: Installer les dépendances sans scripts de cycle de vie
        working-directory: mobile-native
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Vérifier le contrat mobile sensible existant
        working-directory: mobile-native
        run: npm run validate:vault

      - name: Vérifier TypeScript
        working-directory: mobile-native
        run: npm run typecheck
