name: Sécurité SINJIRA — navigation des bibliothèques

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/sinjira-library.js'
      - 'assets/js/sinjira-library-v24-4-61.js'
      - 'assets/js/sinjira-novel-href.mjs'
      - 'assets/js/sinjira-account-v18.js'
      - 'assets/js/sinjira-reads-v24-4-61.js'
      - 'compte/mes-lectures.html'
      - 'compte/bibliotheque-romans.html'
      - 'assets/js/sinjira-document-url-policy.mjs'
      - 'assets/js/sinjira-library-hub-v26.js'
      - 'scripts/test_sinjira_library_safe_links.cjs'
      - 'scripts/test_sinjira_novel_safe_links.cjs'
      - 'scripts/validate_library_v24_4_61.py'
      - 'scripts/test_sinjira_document_url_boundary.mjs'
      - '.github/workflows/sinjira-library-safe-links.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-library.js'
      - 'assets/js/sinjira-library-v24-4-61.js'
      - 'assets/js/sinjira-novel-href.mjs'
      - 'assets/js/sinjira-account-v18.js'
      - 'assets/js/sinjira-reads-v24-4-61.js'
      - 'compte/mes-lectures.html'
      - 'compte/bibliotheque-romans.html'
      - 'assets/js/sinjira-document-url-policy.mjs'
      - 'assets/js/sinjira-library-hub-v26.js'
      - 'scripts/test_sinjira_library_safe_links.cjs'
      - 'scripts/test_sinjira_novel_safe_links.cjs'
      - 'scripts/validate_library_v24_4_61.py'
      - 'scripts/test_sinjira_document_url_boundary.mjs'
      - '.github/workflows/sinjira-library-safe-links.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-library-navigation:
    name: Refuser les protocoles injectés dans les liens bibliothèque
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans jeton persistant
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Node fixé
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Contrôle syntaxique des interfaces et du test
        run: |
          node --check assets/js/sinjira-library.js
          node --check assets/js/sinjira-library-v24-4-61.js
          node --check assets/js/sinjira-account-v18.js
          node --check assets/js/sinjira-reads-v24-4-61.js
          node --check assets/js/sinjira-novel-href.mjs
          node --check assets/js/sinjira-library-hub-v26.js
          node --check assets/js/sinjira-document-url-policy.mjs
          node --check scripts/test_sinjira_library_safe_links.cjs
          node --check scripts/test_sinjira_novel_safe_links.cjs
          node --check scripts/test_sinjira_document_url_boundary.mjs
      - name: Simuler les URLs dangereuses sans accès aux comptes
        run: node scripts/test_sinjira_library_safe_links.cjs
      - name: Vérifier toutes les fiches romans depuis des métadonnées hostiles
        run: node scripts/test_sinjira_novel_safe_links.cjs
      - name: Vérifier le contrat des lecteurs V24 et historiques
        run: python3 scripts/validate_library_v24_4_61.py
      - name: Rejeter les faux documents signés et origines hostiles
        run: node scripts/test_sinjira_document_url_boundary.mjs
