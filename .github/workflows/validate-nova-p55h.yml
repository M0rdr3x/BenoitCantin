name: Projet Nova P55H - Acquisition publique volontaire et verification locale
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p55h.yml"
      - "scripts/acquerir_pdfs_publics_nova_p55h.py"
      - "scripts/tests/test_acquerir_pdfs_publics_nova_p55h.py"
      - "scripts/controler_integrite_pieces_nova_p55g.py"
      - "scripts/verifier_interpretation_sources_nova_p55f.py"
      - "scripts/prioriser_pieces_manquantes_nova_p55e.py"
      - "scripts/preparer_dossier_experts_nova_p55d.py"
      - "scripts/rapprocher_pieces_documentaires_nova_p55c.py"
      - "scripts/controler_acquisition_sources_nova_p55b.py"
      - "projets/projet-nova/etudes/P55H_*"
      - "projets/projet-nova/etudes/P55G_*"
      - "projets/projet-nova/etudes/P55F_*"
      - "projets/projet-nova/etudes/P55E_*"
      - "projets/projet-nova/etudes/P55D_*"
      - "projets/projet-nova/etudes/P55C_*"
      - "projets/projet-nova/etudes/P55B_*"
      - "projets/projet-nova/etudes/P54Q_*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controles-acquisition-synthetique:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Installer dependance PDF pour import P54Q
        run: python -m pip install pypdf==5.9.0
      - name: Lancer 71 tests avec faux PDF et faux HTTP uniquement
        run: |
          python -m py_compile scripts/acquerir_pdfs_publics_nova_p55h.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
              "scripts/tests",pattern="test_acquerir_pdfs_publics_nova_p55h.py")
          assert suite.countTestCases()==71,suite.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
      - name: Valider plan public neutre sans acces aux PDF publics
        run: |
          python scripts/acquerir_pdfs_publics_nova_p55h.py \
            --plan-public p55h_plan_neutre.json --bilan-public p55h_bilan_neutre.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("p55h_plan_neutre.json").read_text("utf-8"))
          d=json.loads(Path("p55h_bilan_neutre.json").read_text("utf-8"))
          assert p["schema_version"]=="P55H-PLAN-PUBLIC-1"
          assert p["activation_reseau_automatique"] is False
          assert len(p["sources_publiees_a_consulter"])==2
          assert d["schema_version"]=="P55H-BILAN-PUBLIC-1"
          assert d["copies_locales_acquises_en_mode_volontaire"]==0
          assert d["copies_non_obtenues"]==2
          assert d["reproduction_nfkc_non_effectuee"] is True
          assert d["avis_professionnels_authentifies"]==0
          assert d["mandats_signes"]==0
          assert d["economies_certifiees_cad"] is None
          assert d["decision"]=="NO_GO_AUTOMATIQUE"
          assert not d["transmission_externe_autorisee"]
          assert not d["fusion_main_autorisee"]
          for output in (p,d):
              raw=json.dumps(output)
              assert "sha256" not in raw and "offset_texte" not in raw
              assert "RECU_P55H" not in raw
          PY
      - name: Interdire telechargement sans opt-in et certification automatique
        run: |
          set +e
          python scripts/acquerir_pdfs_publics_nova_p55h.py --autoriser-lecture-https-public
          status=$?
          set -e
          test "$status" -eq 2
          set +e
          python scripts/acquerir_pdfs_publics_nova_p55h.py \
            --destination-privee "$RUNNER_TEMP/acquisition"
          status=$?
          set -e
          test "$status" -eq 2
          set +e
          python scripts/acquerir_pdfs_publics_nova_p55h.py --exiger-authenticite
          status=$?
          set -e
          test "$status" -eq 3
      - name: Archiver seulement les deux rapports neutres sans PDF ni recu
        uses: actions/upload-artifact@v4
        with:
          name: nova-p55h-acquisition-mode-neutre
          path: |
            p55h_plan_neutre.json
            p55h_bilan_neutre.json
          retention-days: 7
