name: Sécurité — intégrité des workflows GitHub Actions

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-actions:
    name: Contrat de provenance et de permissions GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout sans identifiants persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python figé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Auto-tester les invariants de sécurité
        run: python scripts/validate_workflow_supply_chain.py --self-test
      - name: Vérifier chaque workflow du dépôt
        run: python scripts/validate_workflow_supply_chain.py
      - name: Tester les 32 régressions du writer historique NOVA
        run: python scripts/validate_nova_seo_workflow_security.py --self-test
      - name: Contrôler le writer historique NOVA sans token ni réseau
        run: python scripts/validate_nova_seo_workflow_security.py
      - name: Exécuter le vrai script de push avec un faux Git et un faux jeton
        run: python scripts/test_nova_seo_ephemeral_git_auth.py
      - name: Tester la non-réapparition de NOVA sur l'accueil
        run: python scripts/validate_nova_home_boundary.py --self-test
      - name: Vérifier l'accueil public SINJIRA sans accès NOVA retiré
        run: python scripts/validate_nova_home_boundary.py
