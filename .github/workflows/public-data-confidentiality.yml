name: Sécurité — confidentialité des données publiques NOVA et SINJIRA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-data-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-data-security:
    name: Données publiques sans réponses individuelles
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans jeton Git persistant
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python épinglé
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Tester les refus d'exemples individuels
        run: python3 scripts/validate_public_data_confidentiality.py --self-test
      - name: Refuser fichiers publics inconnus et identifiants personnels
        run: python3 scripts/validate_public_data_confidentiality.py
