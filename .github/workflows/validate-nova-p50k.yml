name: Projet Nova P50K - pre-EFVP non probante
on:
  pull_request:
    paths:
      - "projets/projet-nova/controles/P50K_*"
      - "scripts/validate_nova_pre_efvp_p50k.py"
      - "scripts/tests/test_validate_nova_pre_efvp_p50k.py"
      - ".github/workflows/validate-nova-p50k.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controles-preparatoires-seuls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vérification du code P50K
        run: python -m py_compile scripts/validate_nova_pre_efvp_p50k.py
      - name: Tests de non-contournement (fictifs)
        run: python -m unittest discover -s scripts/tests -p "test_validate_nova_pre_efvp_p50k.py" -v
      - name: Vérification du modèle, toujours NO_GO
        run: python scripts/validate_nova_pre_efvp_p50k.py
