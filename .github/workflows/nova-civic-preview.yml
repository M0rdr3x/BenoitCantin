name: Nova — sondages et Boussole, prévisualisation sans collecte

on:
  # Un push déclenche seulement si SON commit touche les fichiers Nova.
  # Sur une PR très volumineuse, pull_request.synchronize verrait sinon tout
  # le diff de la PR et relancerait les tests pour des changements non Nova.
  push:
    branches: [integration/sinjira-catalogues-pages-securisees-2026-10-13, audit/nova-40-64-boussole-2026-10-25]
    paths:
      - 'projets/projet-nova/**'
      - 'tests/e2e/test_nova_survey_visual.py'
      - 'tests/e2e/test_nova_consultation40_visual.py'
      - 'tests/e2e/test_nova_compass_full_preview.py'
      - 'tests/test_nova_compass_scores.cjs'
      - 'scripts/validate_nova_consultation40.py'
      - 'scripts/validate_nova_survey.py'
      - 'scripts/validate_nova_public_access.py'
      - 'scripts/validate_nova_public_results.py'
      - 'tests/e2e/nova_network_stall_helpers.py'
      - '.github/workflows/nova-civic-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

# Ne pas interrompre une preuve 40/64/Boussole déjà en exécution :
# la branche d'audit reste figée et la PR d'intégration évolue en parallèle.
concurrency:
  group: nova-civic-preview-${{ github.sha }}
  cancel-in-progress: false

jobs:
  score-contract:
    # Calcul mathématique local, aucune interface / aucun accès réseau.
    name: Boussole — sept contrats des 16 dimensions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans identifiants persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Épingler la version Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Tester le vrai calcul de la Boussole
        run: node --test tests/test_nova_compass_scores.cjs

  civic-preview:
    # IMPORTANT: exécuter sur les PR DRAFT. Aucun droit de publication.
    name: Nova 40/64/Boussole — ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble@sha256:a9731514f24121d1dcd25d58d0a38146646d290a5998fd80d3e533e7b5e21c69
      options: --user 1001
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout de la PR sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python de façon reproductible
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Installer Playwright compatible avec l'image épinglée
        run: python -m pip install --disable-pip-version-check 'playwright==1.61.0'

      - name: Valider les contrats de confidentialité et l'inventaire Nova
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_nova_consultation40.py --self-test
          python scripts/validate_nova_survey.py --self-test
          python scripts/validate_nova_public_access.py --self-test
          python scripts/validate_nova_public_results.py --self-test

      - name: Démarrer le serveur local en lecture seule
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/nova-preview-http.log 2>&1 &
          echo $! >/tmp/nova-preview-http.pid
          for attempt in $(seq 1 20); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/projets/projet-nova/', timeout=1).read(1)" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nova-preview-http.log
          exit 1

      - name: Tester les 40 questions, les 64 propositions et la Boussole
        env:
          BROWSER: ${{ matrix.browser }}
        shell: bash
        run: |
          set -euo pipefail
          python tests/e2e/test_nova_consultation40_visual.py
          python tests/e2e/test_nova_survey_visual.py
          python tests/e2e/test_nova_compass_full_preview.py

      - name: Arrêter le serveur de test local
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/nova-preview-http.pid ]; then
            kill "$(cat /tmp/nova-preview-http.pid)" || true
          fi
