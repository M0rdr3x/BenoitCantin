name: SINJIRA — Fracture rapports et Preuve V37
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/sinjira-fracture-reports-v37.mjs'
      - 'tests/games/test_fracture_reports_v37.mjs'
      - 'docs/SINJIRA_FRACTURE_RAPPORTS_V37.md'
      - '.github/workflows/sinjira-fracture-reports-v37.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/sinjira-fracture-reports-v37.mjs'
      - 'tests/games/test_fracture_reports_v37.mjs'
      - 'docs/SINJIRA_FRACTURE_RAPPORTS_V37.md'
      - '.github/workflows/sinjira-fracture-reports-v37.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sinjira-fracture-reports-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Rapports publics, Preuve et non-divulgation
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Récupérer le dépôt sans identifiants persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Node épinglé
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Vérifier les syntaxes et les contrats métier
        run: |
          node --check assets/js/sinjira-fracture-reports-v37.mjs
          node --test tests/games/test_fracture_mechanics_v36.mjs tests/games/test_fracture_reports_v37.mjs
      - name: Conserver la frontière de confidentialité V36
        run: python3 scripts/validate_fracture_mechanics_v36.py
