name: Synchroniser Supabase production

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/**'
      - 'scripts/validate_supabase.py'
      - 'scripts/validate_edge_function_inventory.py'
      - 'scripts/validate_social_rls_contract.py'
      - 'scripts/validate_production_migration_ledger.py'
      - '.github/workflows/supabase-production-preflight.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'supabase/**'
      - 'scripts/validate_supabase.py'
      - 'scripts/validate_edge_function_inventory.py'
      - 'scripts/validate_social_rls_contract.py'
      - 'scripts/validate_production_migration_ledger.py'
      - '.github/workflows/supabase-production-preflight.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: "Appliquer réellement les migrations, secrets opérationnels et Edge Functions"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: gpvivleexywljowcqkru
      OPTIONAL_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      OPTIONAL_CHARACTER_REPORT_TO_EMAIL: ${{ secrets.CHARACTER_REPORT_TO_EMAIL }}
      OPTIONAL_FRACTURE_REPORT_TO_EMAIL: ${{ secrets.FRACTURE_REPORT_TO_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}

      - name: Vérifier le dépôt Supabase
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_supabase.py
          python scripts/validate_edge_function_inventory.py
          python scripts/validate_social_rls_contract.py
          python scripts/validate_production_migration_ledger.py
          supabase --version

      - name: Détecter les secrets de connexion Supabase
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Secrets de connexion Supabase présents." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "Prévol distant non exécuté : SUPABASE_ACCESS_TOKEN et/ou SUPABASE_DB_PASSWORD absent(s)." >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Le lancement manuel exige les deux secrets GitHub Actions."
            exit 2
          fi
          echo "CI non destructive : aucune écriture Supabase n'est tentée et l'absence de secrets n'échoue pas la validation." >> "$GITHUB_STEP_SUMMARY"

      - name: Auditer l’inventaire Edge Functions de production
        if: ${{ steps.auth.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$PROJECT_ID" | tee /tmp/sinjira-functions-before.txt

          missing=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            if ! grep -Fq "$name" /tmp/sinjira-functions-before.txt; then
              echo "Edge Function canonique absente de production: $name"
              missing=1
            fi
          done < <(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_*' -printf '%f\n' | sort)

          retired=(
            admin-reader
            generate-sinjira-character
            admin-literary
            validate-phone-v22
            guardian-create-youth-v22
            create-youth-account
          )
          retired_found=0
          for name in "${retired[@]}"; do
            if grep -Fq "$name" /tmp/sinjira-functions-before.txt; then
              echo "Edge Function retirée physiquement présente (stub neutralisé attendu): $name"
              retired_found=$((retired_found+1))
            fi
          done

          {
            echo '### Inventaire Edge Functions production'
            if [ "$missing" -eq 0 ]; then echo '- Toutes les fonctions canoniques du dépôt sont présentes.'; else echo '- Des fonctions canoniques sont absentes.'; fi
            if [ "$retired_found" -eq 0 ]; then
              echo '- Aucun des six anciens slugs connus n’est physiquement déployé.'
            else
              echo "- $retired_found ancien(s) slug(s) restent physiquement présents comme stubs neutralisés 410. Leur présence est informative tant que la suppression physique n’est pas disponible; aucun appel actif n’est autorisé par le validateur du dépôt."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test "$missing" -eq 0

      - name: Lier le projet de production
        if: ${{ steps.auth.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Exporter l'historique exact des migrations de production
        if: ${{ steps.auth.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -a supabase "$tmp/supabase"
          rm -rf "$tmp/supabase/migrations"
          mkdir -p "$tmp/supabase/migrations"
          (
            cd "$tmp"
            supabase migration fetch --linked
          )
          rm -rf /tmp/supabase-production-migrations
          mkdir -p /tmp/supabase-production-migrations
          cp -a "$tmp/supabase/migrations/." /tmp/supabase-production-migrations/
          find /tmp/supabase-production-migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tee /tmp/supabase-production-migrations/MANIFEST.txt
          count="$(find /tmp/supabase-production-migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          echo "Historique distant exporté en lecture seule : $count migration(s)." >> "$GITHUB_STEP_SUMMARY"
          test "$count" -gt 0

      - name: Publier l'historique distant comme artefact de prévol
        if: ${{ steps.auth.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-migrations-${{ github.run_id }}
          path: /tmp/supabase-production-migrations
          if-no-files-found: error
          retention-days: 7

      - name: Auditer les fonctions SQL déjà en production
        if: ${{ steps.auth.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint --linked --schema public --level error --fail-on error | tee /tmp/sinjira-db-lint-before.txt
          echo '### Lint SQL production avant synchronisation' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/sinjira-db-lint-before.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Comparer l'historique des migrations
        if: ${{ steps.auth.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" | tee /tmp/sinjira-migrations-before.txt
          echo '### Historique Supabase avant synchronisation' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/sinjira-migrations-before.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Prévisualiser les migrations sans modifier la production
        if: ${{ steps.auth.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD" | tee /tmp/sinjira-dry-run.txt
          echo '### Dry-run base de données' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/sinjira-dry-run.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Appliquer les migrations de production
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && steps.auth.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Auditer les fonctions SQL après migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && steps.auth.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint --linked --schema public --level error --fail-on error | tee /tmp/sinjira-db-lint-after.txt
          echo '### Lint SQL production après migrations' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/sinjira-db-lint-after.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Garantir les secrets Edge Functions indispensables
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && steps.auth.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(supabase secrets list --project-ref "$PROJECT_ID")"
          if ! grep -Eq '(^|[[:space:]])SINJIRA_LICENSE_PEPPER([[:space:]]|$)' <<< "$secrets"; then
            pepper="$(openssl rand -hex 32)"
            supabase secrets set "SINJIRA_LICENSE_PEPPER=$pepper" --project-ref "$PROJECT_ID"
            unset pepper
            echo "SINJIRA_LICENSE_PEPPER créé une seule fois dans Supabase (valeur non affichée)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SINJIRA_LICENSE_PEPPER déjà présent; conservation de la valeur existante." >> "$GITHUB_STEP_SUMMARY"
          fi

          supabase secrets set "REPORT_FROM_EMAIL=SINJIRA <no-reply@benoitcantin.com>" --project-ref "$PROJECT_ID"

          if [ -n "${OPTIONAL_CHARACTER_REPORT_TO_EMAIL:-}" ]; then
            supabase secrets set "CHARACTER_REPORT_TO_EMAIL=$OPTIONAL_CHARACTER_REPORT_TO_EMAIL" --project-ref "$PROJECT_ID"
            echo "Destination du rapport personnage synchronisée depuis GitHub Secrets (valeur non affichée)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Destination du rapport personnage absente de GitHub Secrets; la valeur Supabase existante est conservée sans lecture ni affichage." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${OPTIONAL_FRACTURE_REPORT_TO_EMAIL:-}" ]; then
            supabase secrets set "FRACTURE_REPORT_TO_EMAIL=$OPTIONAL_FRACTURE_REPORT_TO_EMAIL" --project-ref "$PROJECT_ID"
            echo "Destination du rapport Fracture synchronisée depuis GitHub Secrets (valeur non affichée)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Destination du rapport Fracture absente de GitHub Secrets; la valeur Supabase existante est conservée sans lecture ni affichage." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${OPTIONAL_RESEND_API_KEY:-}" ]; then
            supabase secrets set "RESEND_API_KEY=$OPTIONAL_RESEND_API_KEY" --project-ref "$PROJECT_ID"
          fi
          secrets_after="$(supabase secrets list --project-ref "$PROJECT_ID")"
          if grep -Eq '(^|[[:space:]])RESEND_API_KEY([[:space:]]|$)' <<< "$secrets_after"; then
            echo "Courriel transactionnel: secret RESEND_API_KEY présent." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Courriel transactionnel: RESEND_API_KEY absent; les données restent enregistrées mais l'envoi de courriel demeure désactivé." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "IA distante payante: aucun secret OpenAI n'est synchronisé par ce workflow; le mode gratuit reste la référence de production." >> "$GITHUB_STEP_SUMMARY"

      - name: Déployer toutes les Edge Functions du dépôt
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && steps.auth.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy --project-ref "$PROJECT_ID" --use-api

      - name: Vérifier les Edge Functions déployées
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && steps.auth.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$PROJECT_ID" | tee /tmp/sinjira-functions.txt
          missing=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            if ! grep -Fq "$name" /tmp/sinjira-functions.txt; then echo "Edge Function manquante après déploiement: $name"; missing=1; fi
          done < <(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_*' -printf '%f\n' | sort)

          retired=(admin-reader generate-sinjira-character admin-literary validate-phone-v22 guardian-create-youth-v22 create-youth-account)
          retired_found=0
          for name in "${retired[@]}"; do
            if grep -Fq "$name" /tmp/sinjira-functions.txt; then
              echo "Edge Function retirée physiquement présente après synchronisation (stub neutralisé attendu): $name"
              retired_found=$((retired_found+1))
            fi
          done
          echo "Fonctions retirées encore physiquement présentes: $retired_found" >> "$GITHUB_STEP_SUMMARY"
          test "$missing" -eq 0

      - name: Vérifier l'historique et le dry-run après déploiement
        id: final_verify
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && steps.auth.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" | tee /tmp/sinjira-migrations-after.txt
          supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD" | tee /tmp/sinjira-dry-run-after.txt
          echo '### Vérification finale Supabase' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/sinjira-migrations-after.txt >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/sinjira-dry-run-after.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: ÉTAT PRODUCTION
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          echo '## ÉTAT PRODUCTION' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.auth.outputs.ready }}" != "true" ]; then
            echo '⛔ NON SYNCHRONISÉ : les secrets de connexion Supabase ne sont pas disponibles au workflow. Aucune écriture de production n’a eu lieu.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo '🟡 PRÉVOL PR : historique distant exporté, production auditée et dry-run exécuté; aucune écriture de production.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo '🟡 PRÉVOL SEULEMENT : production auditée + dry-run; aucune migration ni Edge Function appliquée.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ inputs.apply }}" != "true" ]; then
            echo '🟡 PRÉVOL MANUEL SEULEMENT : aucune modification de production, car apply=false.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.final_verify.outcome }}" = "success" ]; then
            echo '✅ APPLIQUÉ ET VÉRIFIÉ : migrations appliquées, Edge Functions contrôlées, historique relu et dry-run final réussi sans étape restante.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '❌ ÉCHEC OU SYNCHRONISATION PARTIELLE : apply=true a été demandé mais la vérification finale n’est pas verte. Ne pas considérer la production synchronisée; consulter la première étape en échec.' >> "$GITHUB_STEP_SUMMARY"
          fi
