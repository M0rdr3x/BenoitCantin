name: SINJIRA V24.5.37 — Convergence droits utilisateur

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - sinjira-v24.5.37-user-rights-convergence

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  user-rights-convergence-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Vérifier V24.5.37
        run: python scripts/validate_user_rights_convergence_v24_5_37.py
      - name: Vérifier V24.5.36 historique
        run: python scripts/validate_preorder_admin_workflow_v24_5_36.py
      - name: Vérifier le ledger production
        run: python scripts/validate_production_migration_ledger.py
