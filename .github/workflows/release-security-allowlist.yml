name: Release candidate — confinement public et confidentialité

on:
  pull_request:
    branches:
      - a1/web-release-transparency
  push:
    branches:
      - a1/web-release-transparency
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-security-allowlist-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-allowlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Source exacte du candidat, sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Python reproductible
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Récupérer main pour comparer les redirections historiques, sans écriture
        shell: bash
        run: |
          set -euo pipefail
          git -c fetch.fsckObjects=true fetch --no-tags --depth=1 origin \
            '+refs/heads/main:refs/remotes/origin/main'
          git rev-parse --verify 'refs/remotes/origin/main^{commit}'

      - name: Auto-tester le garde Netlify de non-régression historique
        run: python3 scripts/validate_release_main_redirects.py --self-test

      - name: Préserver les alias de main, 404 prioritaires et confinement _site
        run: python3 scripts/validate_release_main_redirects.py

      - name: Tester symlinks, fichiers cachés et sorties dangereuses
        run: python3 scripts/build_netlify_public.py --self-test-security

      - name: Contrôler la construction publique Netlify/preview
        run: python3 scripts/build_netlify_public.py --check

      - name: Contrôler le confinement GitHub Pages
        run: python3 scripts/build_netlify_public.py --check --security-containment

      - name: Tester les en-têtes, les parcours privés et les refus HTTP
        run: python3 scripts/validate_web_release_http.py --self-test

      - name: Valider l'intégrité de la Boussole et ses routes publiques
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha1
          from scripts.build_netlify_public import relative_path_allowed

          expected = {
              "assets/media/nova-boussole-electorale-v2.webp": "b4725fec0cccb1e0ec7df3797929ce105ea30c3a",
              "assets/media/nova-boussole-electorale.webp": "0478c0ab322cfd854f249c6e964a7c52d3c65d48",
              "projets/projet-nova/METHODOLOGIE_BOUSSOLE.md": "60df5d5a246b6b0d1a1feaa0241d4aa37fb755ed",
              "projets/projet-nova/assets/boussole-electorale.css": "524f8f15c4d35f82c787a2dd32e130c3341f06e7",
              "projets/projet-nova/assets/boussole-electorale.js": "7681e03217773678a5bb4fa6b25ba2fb2ab7230c",
              "projets/projet-nova/boussole-electorale.html": "9dc5e6b4c0e41ec129332efab9df9d6b84e03593",
              "projets/projet-nova/data/boussole-electorale-v1.json": "3929b31063093252a397aa921a1f0b1608de284e",
              "projets/projet-nova/data/boussole-electorale-v2.json": "77786171dad3fc902f1376312b8547b9f1684ff9",
              "projets/projet-nova/data/boussole-partis-2026.json": "a27b0dfee3321bb49b7ee339eccf50a691a3ebbd",
              "projets/projet-nova/data/boussole-preuves-2026.json": "50ec372f75b8ae4a81dd2f6d3fc54f0bfe25fbf6",
              "projets/projet-nova/data/boussole-sources-partis-2026.json": "a1a2dbab3036c3716286a3c420e38137fe612389",
          }
          for path, digest in expected.items():
              source = Path(path)
              data = source.read_bytes()
              # Les onze blobs sont ceux du candidat Nova qualifié dans 3 navigateurs.
              # Vérification directe octet pour octet, sans normalisation qui
              # permettrait de masquer une modification non revue.
              if path == "projets/projet-nova/boussole-electorale.html":
                  assert data.count(b"script.js?v=26.2.0") == 1, "Version de navigation Boussole inattendue"
              observed = sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              assert observed == digest, f"Fichier Boussole changé sans revue: {path}"
              expected_public = not path.endswith(".md")
              assert relative_path_allowed(source) == expected_public, f"Allowlist incorrecte: {path}"

          home = Path("index.html").read_text()
          nova = Path("projets/projet-nova/index.html").read_text()
          nova_js = Path("projets/projet-nova/script.js").read_text()
          sitemap = Path("sitemap.xml").read_text()
          home_css = Path("assets/css/home-v24-4-12.css").read_text()
          nova_css = Path("projets/projet-nova/styles.css").read_text()
          route = "/projets/projet-nova/boussole-electorale.html"
          assert home.count(route) >= 4, "Boussole non accessible partout depuis l'accueil"
          import re
          compass_link = re.search(
              r'<a\b[^>]*class="[^"]*\bnode-boussole-home\b[^"]*"[^>]*>',
              home,
          )
          assert compass_link and 'href="' + route + '"' in compass_link.group(), (
              "Porte orbitale Boussole absente ou mal liée"
          )
          assert 'class="nova-compass-entry"' in nova, "Entrée Boussole Nova absente"
          assert nova.count("boussole-electorale.html") >= 4, "Navigation Nova incomplète"
          assert "boussole-electorale.html" in nova_js, "Menu Nova reconstruit sans Boussole"
          assert "<loc>https://www.benoitcantin.com" + route + "</loc>" in sitemap
          assert ".node-boussole-home" in home_css
          assert ".nova-compass-entry-link" in nova_css
          assert "data-ai-transparency" in home
          assert "/transparence-ia.html" in nova
          assert "if(isOfficialHost&&!isNoindexSurface)return;" in nova_js
          print(f"OK Boussole: {len(expected)} blobs main identiques; CSS, navigation, SEO, confidentialité et artefacts vérifiés.")
          PY

      - name: Vérifier la continuité hors ligne du questionnaire sans données privées
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          from scripts.build_netlify_public import relative_path_allowed

          worker = Path('sw.js').read_text(encoding='utf-8')
          assert "benoitcantin-v24-4-95-public-14-owned-lifecycle" in worker
          assert "const releaseMarker=u.pathname==='/.well-known/release.json';" in worker
          assert "if(releaseMarker){e.respondWith(fetch(new Request(r,{cache:'no-store'})));return}" in worker
          assert "if(privatePath){e.respondWith(fetch(new Request(r,{cache:'no-store'}))" in worker
          assert "function cacheableResponse(resp)" in worker

          precache = worker.split("const CORE=[", 1)[1].split("];", 1)[0]
          entries = re.findall(r"'(/[^']+)'", precache)
          assert len(entries) == len(set(entries)), "Entrées PWA en double"
          expected = {
              '/projets/projet-nova/script.js',
              '/projets/projet-nova/styles.css',

              '/projets/projet-nova/assets/boussole-electorale.js',
              '/projets/projet-nova/assets/boussole-electorale.css',
              '/projets/projet-nova/data/boussole-electorale-v2.json',
              '/projets/projet-nova/data/boussole-partis-2026.json',
              '/projets/projet-nova/data/boussole-sources-partis-2026.json',
              '/projets/projet-nova/data/boussole-preuves-2026.json',
              '/assets/media/nova-boussole-electorale.webp',
              '/assets/media/nova-boussole-electorale-v2.webp',
          }
          assert expected <= set(entries), "Fichiers publics Boussole absents du précache PWA"
          # Les quatre pages civiques (y compris le sondage 40/64 et le
          # profil Boussole) sont du HTML dynamique de consentement :
          # ne jamais les conserver en Cache Storage.
          civic_pages = (
              '/projets/projet-nova/consultation-40.html',
              '/projets/projet-nova/sondage.html',
              '/projets/projet-nova/boussole-electorale.html',
              '/projets/projet-nova/resultats-sondages.html',
          )
          assert all(uri not in entries for uri in civic_pages), (
              "Pages civiques personnelles précachées dans la PWA"
          )
          assert "const privateCivicPage=(" in worker
          for uri in civic_pages:
              assert f"u.pathname==='{uri}'" in worker, f"Garde réseau absente pour {uri}"
          assert "if(privateCivicPage){e.respondWith(fetch(new Request(r,{cache:'no-store'})));return}" in worker, (
              "Réponses civiques susceptibles d'être enregistrées par la PWA"
          )

          forbidden = ('/compte/', '/admin/', '/Admin/', '/app/', '/histoire-de-vie/',
                       '/supabase/', '/docs/', '/scripts/', '/tests/', '/mobile-native/')
          for uri in entries:
              assert not uri.startswith(forbidden), "Fichier privé précaché: " + uri
              rel = Path(uri.lstrip('/'))
              if uri.endswith('/'):
                  rel = rel / 'index.html'
              assert rel.is_file(), "Fichier PWA absent: " + uri
              assert relative_path_allowed(rel), "Fichier non publiable précaché: " + uri
          print(f"OK PWA: {len(entries)} assets publics; les 4 pages civiques exclues du cache et réseau no-store.")
          PY

      - name: Auto-tester la continuité des sources de main
        run: python3 scripts/validate_release_main_source_continuity.py --self-test

      - name: Vérifier les 28 sources approuvées et refuser les fonctions Edge non canoniques
        run: python3 scripts/validate_release_main_source_continuity.py

      - name: Tester les refus SEO, le secours hors ligne et les formulaires
        run: python3 scripts/validate_release_offline_a11y.py --self-test

      - name: Contrôler les pages publiques réconciliées sans navigateur
        run: python3 scripts/validate_release_offline_a11y.py

      - name: Vérifier la syntaxe JavaScript de la navigation et du service worker
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check assets/js/site.js
          node --check projets/projet-nova/script.js
          node --check sw.js
          node --check assets/js/sinjira-reader.js
          node --check scripts/test_sinjira_reader_offline.mjs

      - name: Auto-tester le contrat de navigation sensible
        run: python3 scripts/validate_release_navigation_runtime.py --self-test

      - name: Garantir l'accessibilité du menu et les frontières public/privé
        run: python3 scripts/validate_release_navigation_runtime.py

      - name: Vérifier les tests négatifs des pages de l'univers SINJIRA
        run: python3 scripts/validate_release_sinjira_hubs.py --self-test

      - name: Protéger le référencement, les menus et le contrat privé Livre I
        run: python3 scripts/validate_release_sinjira_hubs.py

      - name: Tester le lecteur PDF public en mode anonyme et sans réseau
        run: node scripts/test_sinjira_reader_offline.mjs

      - name: Tester le refus des anciennes fiches joueur actives
        run: python3 scripts/validate_release_fracture_redirect.py --self-test

      - name: Préserver la redirection exacte de main vers les règles officielles
        run: python3 scripts/validate_release_fracture_redirect.py

      - name: Vérifier la navigation mobile Projet Nova dans un DOM simulé
        shell: bash
        run: |
          set -euo pipefail
          node --check projets/projet-nova/script.js
          node --check scripts/test_nova_navigation_runtime.mjs
          node scripts/test_nova_navigation_runtime.mjs

      - name: Tester en exécution la confidentialité des réponses PWA
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          node --check scripts/test_service_worker_privacy_runtime.mjs
          node scripts/test_service_worker_privacy_runtime.mjs

      - name: Tester la détection des anciens caches JavaScript de Projet Nova
        run: python3 scripts/validate_nova_script_cache.py --self-test

      - name: Exiger le script de navigation actuel sur chaque page Nova
        run: python3 scripts/validate_nova_script_cache.py

      - name: Tester la classification des conflits et la 404 Projet Nova
        run: python3 scripts/audit_release_conflict_categories.py --self-test

      - name: Bloquer les anciens formulaires politiques et les confirmations trompeuses
        run: python3 scripts/validate_nova_form_decommission.py

      - name: Vérifier les scénarios de régression des canaux Projet Nova
        run: python3 scripts/test_nova_form_decommission.py

      - name: Auto-tester la liste positive des PDF publics
        run: python3 scripts/validate_release_public_pdfs.py --self-test

      - name: Refuser tout PDF non autorisé dans l'artefact Web
        run: python3 scripts/validate_release_public_pdfs.py

      - name: Vérifier les fichiers, routes et liens de l’ensemble du site
        run: python3 scripts/validate_site.py
