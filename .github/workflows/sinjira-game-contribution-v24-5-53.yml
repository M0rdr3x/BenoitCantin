name: SINJIRA V24.5.53 — Contribution jeu sans UUID

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Auto-tester le contrat CI contribution jeu
        run: python scripts/validate_game_contribution_workflow_security.py --self-test

      - name: Vérifier le contrat CI contribution jeu
        run: python scripts/validate_game_contribution_workflow_security.py

      - name: Vérifier V24.5.53
        run: |
          python scripts/validate_game_contribution_v24_5_53.py
          python scripts/validate_contribution_revocation_v24_5_52.py
          python scripts/validate_delete_account_v24_5_51.py
          python scripts/validate_edge_function_inventory.py
          python scripts/validate_production_migration_ledger.py
