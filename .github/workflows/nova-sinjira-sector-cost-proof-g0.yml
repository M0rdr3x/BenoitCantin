name: NOVA–SINJIRA — contrôle des preuves G0 des 14 secteurs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/validate_nova_sinjira_sector_evidence_20261112.mjs'
      - 'tests/nova-sinjira-sector-evidence-20261112.test.mjs'
      - 'projets/projet-nova/data/registre-donnees-services-nova-sinjira.json'
      - '.github/workflows/nova-sinjira-sector-cost-proof-g0.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/validate_nova_sinjira_sector_evidence_20261112.mjs'
      - 'tests/nova-sinjira-sector-evidence-20261112.test.mjs'
      - 'projets/projet-nova/data/registre-donnees-services-nova-sinjira.json'
      - '.github/workflows/nova-sinjira-sector-cost-proof-g0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-sinjira-sector-g0-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sector-evidence:
    name: Contrôle structurel du chiffrage et des sources
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer la version exacte du dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Tester les 14 secteurs, les coûts et la non-certification
        run: node --test tests/nova-sinjira-sector-evidence-20261112.test.mjs
      - name: Valider le registre réel sans publier de données privées
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate_nova_sinjira_sector_evidence_20261112.mjs > /tmp/nova-sinjira-g0-report.json
          node --input-type=module -e '
            import fs from "node:fs";
            const r=JSON.parse(fs.readFileSync("/tmp/nova-sinjira-g0-report.json","utf8"));
            if (!r.validStructure || r.totals.sectors!==14 ||
                r.global_completion_percent!==null || r.delivery_date!==null)
              process.exit(1);
            console.log("G0 valide structurellement; aucun pourcentage ni date globale déduits.");
          '
