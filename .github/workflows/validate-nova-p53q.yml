name: Projet Nova P53Q - Inventaire 102 pieces primaires
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-nova-p53q.yml"
      - "scripts/inventorier_pieces_primaires_nova_p53q.py"
      - "scripts/tests/test_inventorier_pieces_primaires_nova_p53q.py"
      - "scripts/constituer_dossiers_institutionnels_nova_p53p.py"
      - "scripts/prioriser_sources_officielles_nova_p53o.py"
      - "scripts/preparer_acquisition_preuves_nova_p53n.py"
      - "scripts/construire_registre_couts_evitables_nova_p53m.py"
      - "scripts/evaluer_hypotheses_economies_nova_p53l.py"
      - "scripts/preparer_controles_probatoires_nova_p53k.py"
      - "scripts/auditer_appariements_municipaux_nova_p53j.py"
      - "projets/projet-nova/etudes/P53Q_*"
      - "projets/projet-nova/etudes/P53P_DOSSIERS_INSTITUTIONNELS_2024.json"
      - "projets/projet-nova/etudes/P53O_MATRICE_SOURCES_OFFICIELLES.json"
      - "projets/projet-nova/etudes/P53N_PLAN_ACQUISITION_PREUVES.json"
      - "projets/projet-nova/etudes/P53M_CRITERES_COUTS_EVITABLES.json"
      - "projets/projet-nova/etudes/P53L_CADRE_EVALUATION_ECONOMIES.json"
      - "projets/projet-nova/etudes/P53K_EXIGENCES_PROBATOIRES.json"
      - "projets/projet-nova/etudes/P53I_SOURCES_REVISION_ET_CHARGES_2024.json"
      - "projets/projet-nova/etudes/P53H_PRIORITES_VERIFICATION_2024.json"
      - "projets/projet-nova/etudes/sources/P53I_MAMH_2024_1344_RECETTES_CHARGES_SELECTION.csv"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventaire-non-certifie:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Source sans credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Tests P53Q — 52 cas
        run: |
          python -m py_compile scripts/inventorier_pieces_primaires_nova_p53q.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover(
            "scripts/tests",pattern="test_inventorier_pieces_primaires_nova_p53q.py")
          assert suite.countTestCases()==52,suite.countTestCases()
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
      - name: Recalculer 102 positions et refuser la certification
        run: |
          python scripts/inventorier_pieces_primaires_nova_p53q.py --bilan p53q_bilan.json --inventaire p53q_inventaire.json
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path("p53q_bilan.json").read_text("utf-8"))
          d=json.loads(Path("p53q_inventaire.json").read_text("utf-8"))["entrees"]
          assert b["organismes_cibles"]==6
          assert b["emplacements_documentaires"]==102
          assert b["originaux_transactionnels_authentifies"]==0
          assert b["appariements_bilateraux_certifies"]==0
          assert b["demandes_reellement_envoyees"]==0
          assert b["economies_certifiees_cad"] is None
          assert b["decision"]=="NO_GO_AUTOMATIQUE"
          assert len(d)==102
          assert all(x["montant_economie_certifiee_cad"] is None for x in d)
          PY
          set +e
          python scripts/inventorier_pieces_primaires_nova_p53q.py --exiger-preuves-certifiees --bilan p53q_refus.json
          result=$?
          set -e
          test "$result" -eq 3
      - name: Conserver le bilan non sensible
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-p53q-102-categories-de-pieces-no-go
          path: |
            p53q_bilan.json
            p53q_refus.json
          if-no-files-found: ignore
          retention-days: 7
