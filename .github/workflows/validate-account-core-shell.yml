name: Compte SINJIRA — shell privé

on:
  pull_request:
    paths:
      - 'compte/index.html'
      - 'compte/bibliotheque.html'
      - 'compte/licences.html'
      - 'compte/mes-lectures.html'
      - 'compte/mes-achats.html'
      - 'compte/notifications.html'
      - 'compte/profil.html'
      - 'compte/parametres.html'
      - 'scripts/validate_account_core_shell.py'
      - '.github/workflows/validate-account-core-shell.yml'
  push:
    branches: [ main ]
    paths:
      - 'compte/index.html'
      - 'compte/bibliotheque.html'
      - 'compte/licences.html'
      - 'compte/mes-lectures.html'
      - 'compte/mes-achats.html'
      - 'compte/notifications.html'
      - 'compte/profil.html'
      - 'compte/parametres.html'
      - 'scripts/validate_account_core_shell.py'
      - '.github/workflows/validate-account-core-shell.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Vérifier le shell privé du compte
        run: python scripts/validate_account_core_shell.py
