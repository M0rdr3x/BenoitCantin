name: SINJIRA — Cloisonnement du stockage privé

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/storage_private_owner_isolation.test.sql'
      - 'scripts/smoke_private_storage_isolation_local.py'
      - 'supabase/config.toml'
      - '.github/workflows/sinjira-storage-owner-isolation.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/storage_private_owner_isolation.test.sql'
      - 'scripts/smoke_private_storage_isolation_local.py'
      - 'supabase/config.toml'
      - '.github/workflows/sinjira-storage-owner-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout sans jeton persistant
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Installer Supabase CLI épinglé
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0
      - name: Démarrer Supabase local complet
        run: supabase start
      - name: Tester les politiques Storage avec deux identités synthétiques
        run: supabase test db supabase/tests/storage_private_owner_isolation.test.sql --local
      - name: Vérifier les URL signées et les suppressions via Storage
        shell: bash
        run: |
          set -euo pipefail
          status_env="$(supabase status -o env)"
          API_URL="$(sed -n 's/^API_URL="\(.*\)"$/\1/p' <<< "$status_env" | head -n1)"
          ANON_KEY="$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' <<< "$status_env" | head -n1)"
          test -n "$API_URL"
          test -n "$ANON_KEY"
          SINJIRA_LOCAL_API_URL="$API_URL" SINJIRA_LOCAL_ANON_KEY="$ANON_KEY" python3 scripts/smoke_private_storage_isolation_local.py
      - name: Arrêter la base locale
        if: always()
        run: supabase stop --no-backup || true
