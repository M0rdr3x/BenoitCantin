name: SINJIRA — preuve Storage privé avant signature PDF

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/private-document-storage.mjs'
      - 'supabase/functions/get-document-url/index.ts'
      - 'scripts/test_private_document_storage.mjs'
      - 'scripts/test_document_external_urls.mjs'
      - 'scripts/test_document_access_rank_security.mjs'
      - 'scripts/validate_get_document_storage_security.py'
      - 'scripts/validate_get_document_url_security.py'
      - 'supabase/functions/_shared/private-book-storage-guard.mjs'
      - 'supabase/functions/get-novel-file-url/index.ts'
      - 'supabase/functions/get-private-book-url/index.ts'
      - 'scripts/test_private_book_storage_guard.mjs'
      - 'supabase/functions/_shared/read-chunk-deadline.mjs'
      - 'scripts/test_novel_http_deadline_security.mjs'
      - 'scripts/validate_edge_response_privacy_v24_5_48.py'
      - 'scripts/test_streaming_edge_legacy_guard_regressions.py'
      - 'scripts/validate_novel_storage_security.py'
      - 'scripts/validate_get_private_book_url_security.py'
      - 'scripts/validate_edge_function_inventory.py'
      - '.github/workflows/sinjira-private-bucket-proof-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/private-document-storage.mjs'
      - 'supabase/functions/get-document-url/index.ts'
      - 'scripts/test_private_document_storage.mjs'
      - 'scripts/test_document_external_urls.mjs'
      - 'scripts/test_document_access_rank_security.mjs'
      - 'scripts/validate_get_document_storage_security.py'
      - 'scripts/validate_get_document_url_security.py'
      - 'supabase/functions/_shared/private-book-storage-guard.mjs'
      - 'supabase/functions/get-novel-file-url/index.ts'
      - 'supabase/functions/get-private-book-url/index.ts'
      - 'scripts/test_private_book_storage_guard.mjs'
      - 'supabase/functions/_shared/read-chunk-deadline.mjs'
      - 'scripts/test_novel_http_deadline_security.mjs'
      - 'scripts/validate_edge_response_privacy_v24_5_48.py'
      - 'scripts/test_streaming_edge_legacy_guard_regressions.py'
      - 'scripts/validate_novel_storage_security.py'
      - 'scripts/validate_get_private_book_url_security.py'
      - 'scripts/validate_edge_function_inventory.py'
      - '.github/workflows/sinjira-private-bucket-proof-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-private-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout sans identifiants persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python version verrouillée
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Node version verrouillée
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          check-latest: false
      - name: Tester les buckets privés et les chemins PDF
        run: node --test scripts/test_private_book_storage_guard.mjs
      - name: Tester l'autorisation documentaire et les compartiments publics
        run: node --test scripts/test_private_document_storage.mjs scripts/test_document_access_rank_security.mjs
      - name: Refuser les URL externes non approuvées
        run: node scripts/test_document_external_urls.mjs
      - name: Vérifier la frontière de signature documentaire
        run: |
          python3 scripts/validate_get_document_storage_security.py --self-test
          python3 scripts/validate_get_document_storage_security.py
          python3 scripts/validate_get_document_url_security.py --self-test
          python3 scripts/validate_get_document_url_security.py
      - name: Vérifier les délais HTTP absolus et les corps JSON du roman
        run: node --test scripts/test_novel_http_deadline_security.mjs
      - name: Préserver les anciens contrats de confidentialité Edge
        run: |
          python3 scripts/validate_edge_response_privacy_v24_5_48.py
          python3 scripts/test_streaming_edge_legacy_guard_regressions.py
      - name: Tester les mutations de sécurité du roman
        run: |
          python3 scripts/validate_novel_storage_security.py --self-test
          python3 scripts/validate_novel_storage_security.py
      - name: Tester les mutations de sécurité du Livre I
        run: |
          python3 scripts/validate_get_private_book_url_security.py --self-test
          python3 scripts/validate_get_private_book_url_security.py
      - name: Vérifier la cohérence globale des Edge Functions
        run: python3 scripts/validate_edge_function_inventory.py
