name: Consentement Mode Voyage

on:
  pull_request:
    paths:
      - 'compte/securite.html'
      - 'assets/js/sinjira-security-travel-consent-v25.js'
      - 'scripts/validate_security_travel_consent_v25.py'
      - '.github/workflows/sinjira-security-travel-consent-v25.yml'
  push:
    branches:
      - main
    paths:
      - 'compte/securite.html'
      - 'assets/js/sinjira-security-travel-consent-v25.js'
      - 'scripts/validate_security_travel_consent_v25.py'
      - '.github/workflows/sinjira-security-travel-consent-v25.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Vérifier le consentement Voyage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Vérifier les garde-fous
        run: python3 scripts/validate_security_travel_consent_v25.py
