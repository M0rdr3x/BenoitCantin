name: SINJIRA V25 — Moteur de risque sécurité

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/security_risk_model_v25.test.sql'
      - 'supabase/config.toml'
      - 'scripts/validate_security_risk_workflow_security.py'
      - '.github/workflows/sinjira-security-risk-v25.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/security_risk_model_v25.test.sql'
      - 'supabase/config.toml'
      - 'scripts/validate_security_risk_workflow_security.py'
      - '.github/workflows/sinjira-security-risk-v25.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk-model-pgtap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0
          github-token: ${{ github.token }}

      - name: Auto-tester le contrat CI du moteur de risque
        run: python scripts/validate_security_risk_workflow_security.py --self-test

      - name: Vérifier le contrat CI du moteur de risque
        run: python scripts/validate_security_risk_workflow_security.py

      - name: Démarrer PostgreSQL Supabase local et appliquer les migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db start

      - name: Exécuter les 20 assertions pgTAP V25
        shell: bash
        run: |
          set -euo pipefail
          supabase test db supabase/tests/security_risk_model_v25.test.sql --local

      - name: Arrêter la base locale
        if: always()
        shell: bash
        run: supabase stop --no-backup || true
