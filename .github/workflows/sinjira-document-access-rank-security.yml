name: Sécurité SINJIRA — niveaux ACL documentaires exacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/get-document-url/index.ts'
      - 'scripts/test_private_document_storage.mjs'
      - 'scripts/test_document_external_urls.mjs'
      - 'supabase/functions/_shared/private-document-storage.mjs'
      - 'scripts/test_document_access_rank_security.mjs'
      - 'scripts/validate_document_access_rank_security.py'
      - '.github/workflows/sinjira-document-access-rank-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/get-document-url/index.ts'
      - 'scripts/test_private_document_storage.mjs'
      - 'scripts/test_document_external_urls.mjs'
      - 'supabase/functions/_shared/private-document-storage.mjs'
      - 'scripts/test_document_access_rank_security.mjs'
      - 'scripts/validate_document_access_rank_security.py'
      - '.github/workflows/sinjira-document-access-rank-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-acl:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout sans credentials persistants
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Installer Node.js fixe
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'

      - name: Tester le véritable handler, les ACL et les buckets privés
        run: node --test scripts/test_document_access_rank_security.mjs scripts/test_private_document_storage.mjs
      - name: Interdire les liens documentaires externes non approuvés
        run: node scripts/test_document_external_urls.mjs

      - name: Rejeter les régressions d'autorisation
        run: |
          python3 scripts/validate_document_access_rank_security.py --self-test
          python3 scripts/validate_document_access_rank_security.py

      - name: Préserver les contrats existants de documents et du site
        run: |
          python3 scripts/validate_get_document_url_security.py --self-test
          python3 scripts/validate_get_document_url_security.py
          python3 scripts/validate_edge_response_privacy_v24_5_48.py
          python3 scripts/validate_edge_function_inventory.py
          node scripts/test_public_edge_body_limits.mjs
