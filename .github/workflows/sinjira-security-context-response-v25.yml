name: SINJIRA V25 — Security context borné et fail-closed

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/security-context/index.ts'
      - 'scripts/validate_security_context_request_security.py'
      - 'scripts/validate_security_context_response_v25.py'
      - '.github/workflows/sinjira-security-context-response-v25.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/security-context/index.ts'
      - 'scripts/validate_security_context_request_security.py'
      - 'scripts/validate_security_context_response_v25.py'
      - '.github/workflows/sinjira-security-context-response-v25.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sinjira-security-context-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Vérifier requête bornée, réponse minimale et fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Vérifier la syntaxe des garde-fous
        run: |
          python3 -m py_compile scripts/validate_security_context_request_security.py
          python3 -m py_compile scripts/validate_security_context_response_v25.py

      - name: Auto-tester la frontière de requête
        run: python3 scripts/validate_security_context_request_security.py --self-test

      - name: Vérifier la frontière de requête
        run: python3 scripts/validate_security_context_request_security.py

      - name: Auto-tester la réponse publique fail-closed
        run: python3 scripts/validate_security_context_response_v25.py --self-test

      - name: Vérifier la réponse publique fail-closed
        run: python3 scripts/validate_security_context_response_v25.py
