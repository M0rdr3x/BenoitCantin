name: Sécurité CI — confidentialité des identifiants Netlify staging

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-netlify-staging.yml'
      - '.github/workflows/netlify-staging-secret-scope.yml'
      - 'scripts/validate_netlify_staging_secret_scope.py'
      - 'scripts/validate_netlify_cli_lock.py'
      - 'tools/netlify-cli/package.json'
      - 'tools/netlify-cli/package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-netlify-staging.yml'
      - '.github/workflows/netlify-staging-secret-scope.yml'
      - 'scripts/validate_netlify_staging_secret_scope.py'
      - 'scripts/validate_netlify_cli_lock.py'
      - 'tools/netlify-cli/package.json'
      - 'tools/netlify-cli/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scope:
    name: Contrôler l'isolation des secrets de déploiement
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Tester les échecs d'isolation des secrets sans valeur réelle
        run: python3 scripts/validate_netlify_staging_secret_scope.py --self-test
      - name: Valider le workflow Netlify staging
        run: python3 scripts/validate_netlify_staging_secret_scope.py


      - name: Tester les empreintes npm et leurs mutations
        run: |
          python3 scripts/validate_netlify_cli_lock.py --self-test
          python3 scripts/validate_netlify_cli_lock.py

      - name: Configurer Node sans jeton
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'

      - name: Vérifier npm ci et exécution locale sans secrets
        shell: bash
        env:
          NETLIFY_CLI_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          cli_root="$RUNNER_TEMP/netlify-cli-locked-check"
          mkdir -p "$cli_root"
          cp "$GITHUB_WORKSPACE/tools/netlify-cli/package.json" "$cli_root/package.json"
          cp "$GITHUB_WORKSPACE/tools/netlify-cli/package-lock.json" "$cli_root/package-lock.json"
          touch "$cli_root/npm-user.conf" "$cli_root/npm-global.conf"
          cd "$cli_root"
          npm ci --ignore-scripts --no-audit --no-fund --no-progress \
            --userconfig="$cli_root/npm-user.conf" --globalconfig="$cli_root/npm-global.conf" \
            --registry=https://registry.npmjs.org/
          "$cli_root/node_modules/.bin/netlify" --version
