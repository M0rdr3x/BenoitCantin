name: Sécurité CI — confidentialité des identifiants Netlify staging

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-netlify-staging.yml'
      - '.github/workflows/netlify-staging-secret-scope.yml'
      - 'scripts/validate_netlify_staging_secret_scope.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-netlify-staging.yml'
      - '.github/workflows/netlify-staging-secret-scope.yml'
      - 'scripts/validate_netlify_staging_secret_scope.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scope:
    name: Contrôler l'isolation des secrets de déploiement
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Tester les échecs d'isolation des secrets sans valeur réelle
        run: python3 scripts/validate_netlify_staging_secret_scope.py --self-test
      - name: Valider le workflow Netlify staging
        run: python3 scripts/validate_netlify_staging_secret_scope.py

      # Étape temporaire sans secrets, destinée à produire un lockfile authentique.
      - name: Installer Node pour produire le lockfile Netlify sans secrets
        if: github.head_ref == 'security/netlify-staging-secret-scope-20261112'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'

      - name: Produire un lockfile npm auditable sans identifiants
        if: github.head_ref == 'security/netlify-staging-secret-scope-20261112'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/netlify-cli-lockgen"
          cd "$RUNNER_TEMP/netlify-cli-lockgen"
          cat > package.json <<'JSON'
          {
            "name": "sinjira-netlify-cli-toolchain",
            "version": "1.0.0",
            "private": true,
            "dependencies": { "netlify-cli": "27.10.2" }
          }
          JSON
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
            --registry=https://registry.npmjs.org/ \
            --userconfig=/dev/null --globalconfig=/dev/null \
            --fetch-retries=1 --fetch-timeout=20000
          node - <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const buf = fs.readFileSync('package-lock.json');
          if (buf.length > 2_000_000) throw Error('lockfile trop gros');
          const lock = JSON.parse(buf.toString('utf8'));
          if (lock.lockfileVersion !== 3 || lock.packages[''].dependencies['netlify-cli'] !== '27.10.2') {
            throw Error('lockfile invalide');
          }
          console.log('SINJIRA_LOCK_SHA256 ' + crypto.createHash('sha256').update(buf).digest('hex'));
          console.log('SINJIRA_LOCK_BYTES ' + buf.length);
          const encoded = buf.toString('base64');
          for (let pos = 0; pos < encoded.length; pos += 3000) {
            console.log('SINJIRA_LOCK_PART ' + encoded.slice(pos, pos + 3000));
          }
          console.log('SINJIRA_LOCK_END');
          JS
