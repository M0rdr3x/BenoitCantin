name: Sécurité CI — confidentialité des identifiants Netlify staging

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-netlify-staging.yml'
      - '.github/workflows/netlify-staging-secret-scope.yml'
      - 'scripts/validate_netlify_staging_secret_scope.py'
      - 'scripts/validate_netlify_cli_lock.py'
      - 'tools/netlify-cli/package.json'
      - 'tools/netlify-cli/package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-netlify-staging.yml'
      - '.github/workflows/netlify-staging-secret-scope.yml'
      - 'scripts/validate_netlify_staging_secret_scope.py'
      - 'scripts/validate_netlify_cli_lock.py'
      - 'tools/netlify-cli/package.json'
      - 'tools/netlify-cli/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scope:
    name: Contrôler l'isolation des secrets de déploiement
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Tester les échecs d'isolation des secrets sans valeur réelle
        run: python3 scripts/validate_netlify_staging_secret_scope.py --self-test
      - name: Valider le workflow Netlify staging
        run: python3 scripts/validate_netlify_staging_secret_scope.py


      - name: Tester les empreintes npm et leurs mutations
        run: |
          python3 scripts/validate_netlify_cli_lock.py --self-test
          python3 scripts/validate_netlify_cli_lock.py

      - name: Configurer Node sans jeton
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'

      - name: Vérifier npm ci et exécution locale sans secrets
        shell: bash
        env:
          NETLIFY_CLI_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          cli_root="$RUNNER_TEMP/netlify-cli-locked-check"
          mkdir -p "$cli_root"
          cp "$GITHUB_WORKSPACE/tools/netlify-cli/package.json" "$cli_root/package.json"
          cp "$GITHUB_WORKSPACE/tools/netlify-cli/package-lock.json" "$cli_root/package-lock.json"
          touch "$cli_root/npm-user.conf" "$cli_root/npm-global.conf"
          cd "$cli_root"
          npm ci --ignore-scripts --no-audit --no-fund --no-progress \
            --userconfig="$cli_root/npm-user.conf" --globalconfig="$cli_root/npm-global.conf" \
            --registry=https://registry.npmjs.org/
          "$cli_root/node_modules/.bin/netlify" --version

      - name: Auditer les vulnérabilités des dépendances Netlify sans secrets
        shell: bash
        run: |
          set -euo pipefail
          cli_root="$RUNNER_TEMP/netlify-cli-locked-check"
          cd "$cli_root"
          audit_status=0
          npm audit --json --omit=dev \
            --userconfig="$cli_root/npm-user.conf" \
            --globalconfig="$cli_root/npm-global.conf" \
            --registry=https://registry.npmjs.org/ \
            > "$RUNNER_TEMP/netlify-cli-audit.json" || audit_status=$?
          node - "$RUNNER_TEMP/netlify-cli-audit.json" "$audit_status" <<'JS'
          const fs = require('node:fs');
          const path = process.argv[2];
          const code = Number(process.argv[3]);
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (code !== 0 && code !== 1) throw Error('Échec du service audit npm: code ' + code);
          if (!doc.metadata || !doc.metadata.vulnerabilities) {
            throw Error('Audit npm non exploitable: statistiques absentes');
          }
          const meta = doc.metadata.vulnerabilities;
          console.log('SINJIRA_NPM_AUDIT_COUNTS ' + JSON.stringify(meta));
          const vulns = Object.entries(doc.vulnerabilities || {});
          for (const [name, v] of vulns.filter(([, v]) => ['critical', 'high'].includes(v.severity)).slice(0, 30)) {
            const fix = typeof v.fixAvailable === 'object' ? JSON.stringify(v.fixAvailable) : String(v.fixAvailable);
            console.log('SINJIRA_NPM_AUDIT_VULN ' + JSON.stringify({name, severity:v.severity, range:v.range, fix}));
          }
          console.log('SINJIRA_NPM_AUDIT_END');
          JS

      # Génération ponctuelle : aucune clé Netlify/Supabase n'est disponible.
      - name: Évaluer une mise à jour Netlify 27.19.0 sans secrets
        if: github.head_ref == 'security/netlify-staging-secret-scope-20261112'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/netlify-cli-27.19.0-candidate"
          mkdir -p "$root"
          node - "$root/package.json" <<'JS'
          const fs = require('node:fs');
          fs.writeFileSync(process.argv[2], JSON.stringify({
            name:'sinjira-netlify-cli-toolchain',
            version:'1.0.0',
            private:true,
            dependencies:{'netlify-cli':'27.19.0'}
          }, null, 2) + '\n');
          JS
          touch "$root/npm-user.conf" "$root/npm-global.conf"
          cd "$root"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --no-progress \
            --userconfig="$root/npm-user.conf" --globalconfig="$root/npm-global.conf" \
            --registry=https://registry.npmjs.org/ --fetch-retries=1 --fetch-timeout=30000
          status=0
          npm audit --json --omit=dev \
            --userconfig="$root/npm-user.conf" --globalconfig="$root/npm-global.conf" \
            --registry=https://registry.npmjs.org/ \
            > "$root/audit.json" || status=$?
          node - "$root/audit.json" "$root/package-lock.json" "$status" <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const audit = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const buf = fs.readFileSync(process.argv[3]);
          const status = Number(process.argv[4]);
          if (status !== 0 && status !== 1) throw Error('Audit npm indisponible');
          if (!audit.metadata?.vulnerabilities) throw Error('Statistiques audit manquantes');
          const findings = audit.metadata.vulnerabilities;
          const lock = JSON.parse(buf.toString('utf8'));
          const count = Object.keys(lock.packages).length - 1;
          console.log('SINJIRA_UPGRADE_AUDIT ' + JSON.stringify(findings));
          console.log('SINJIRA_UPGRADE_PACKAGES ' + count);
          console.log('SINJIRA_UPGRADE_SHA256 ' + crypto.createHash('sha256').update(buf).digest('hex'));
          console.log('SINJIRA_UPGRADE_BYTES ' + buf.length);
          console.log('SINJIRA_UPGRADE_NETLIFY_SRI ' + lock.packages['node_modules/netlify-cli']?.integrity);
          if (findings.critical || findings.high) {
            console.log('SINJIRA_UPGRADE_BLOCKED High or critical vulnerabilities remain');
          } else {
            const encoded = buf.toString('base64');
            for (let pos = 0; pos < encoded.length; pos += 3000)
              console.log('SINJIRA_UPGRADE_PART ' + encoded.slice(pos, pos + 3000));
          }
          console.log('SINJIRA_UPGRADE_END');
          JS
