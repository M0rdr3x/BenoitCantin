name: Sécurité CI — confidentialité des identifiants Netlify staging

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-netlify-staging.yml'
      - '.github/workflows/netlify-staging-secret-scope.yml'
      - 'scripts/validate_netlify_staging_secret_scope.py'
      - 'scripts/validate_netlify_cli_lock.py'
      - 'scripts/validate_netlify_cli_audit.py'
      - 'tools/netlify-cli/package.json'
      - 'tools/netlify-cli/package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-netlify-staging.yml'
      - '.github/workflows/netlify-staging-secret-scope.yml'
      - 'scripts/validate_netlify_staging_secret_scope.py'
      - 'scripts/validate_netlify_cli_lock.py'
      - 'scripts/validate_netlify_cli_audit.py'
      - 'tools/netlify-cli/package.json'
      - 'tools/netlify-cli/package-lock.json'
  # Surveillance périodique : détecter les nouveaux avis de sécurité npm.
  # Aucun secret de déploiement n'est accessible à ce workflow.
  schedule:
    - cron: '47 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scope:
    name: Contrôler l'isolation des secrets de déploiement
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Tester les échecs d'isolation des secrets sans valeur réelle
        run: python3 scripts/validate_netlify_staging_secret_scope.py --self-test
      - name: Valider le workflow Netlify staging
        run: python3 scripts/validate_netlify_staging_secret_scope.py


      - name: Tester les empreintes npm et leurs mutations
        run: |
          python3 scripts/validate_netlify_cli_lock.py --self-test
          python3 scripts/validate_netlify_cli_lock.py

      - name: Configurer Node sans jeton
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'

      - name: Vérifier npm ci et exécution locale sans secrets
        shell: bash
        env:
          NETLIFY_CLI_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          cli_root="$RUNNER_TEMP/netlify-cli-locked-check"
          mkdir -p "$cli_root"
          cp "$GITHUB_WORKSPACE/tools/netlify-cli/package.json" "$cli_root/package.json"
          cp "$GITHUB_WORKSPACE/tools/netlify-cli/package-lock.json" "$cli_root/package-lock.json"
          touch "$cli_root/npm-user.conf" "$cli_root/npm-global.conf"
          cd "$cli_root"
          npm ci --ignore-scripts --no-audit --no-fund --no-progress \
            --userconfig="$cli_root/npm-user.conf" --globalconfig="$cli_root/npm-global.conf" \
            --registry=https://registry.npmjs.org/
          "$cli_root/node_modules/.bin/netlify" --version

      - name: Auditer les vulnérabilités des dépendances Netlify sans secrets
        shell: bash
        run: |
          set -euo pipefail
          cli_root="$RUNNER_TEMP/netlify-cli-locked-check"
          cd "$cli_root"
          audit_status=0
          npm audit --json --omit=dev \
            --userconfig="$cli_root/npm-user.conf" \
            --globalconfig="$cli_root/npm-global.conf" \
            --registry=https://registry.npmjs.org/ \
            > "$RUNNER_TEMP/netlify-cli-audit.json" || audit_status=$?
          python3 "$GITHUB_WORKSPACE/scripts/validate_netlify_cli_audit.py" --self-test
          python3 "$GITHUB_WORKSPACE/scripts/validate_netlify_cli_audit.py" \
            "$RUNNER_TEMP/netlify-cli-audit.json" --exit-status "$audit_status"
          # Les alertes modérées/faibles restent visibles sans bloquer le chantier.
          node - "$RUNNER_TEMP/netlify-cli-audit.json" <<'JS'
          const fs = require('node:fs');
          const doc = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          for (const [name, v] of Object.entries(doc.vulnerabilities || {})) {
            if (['moderate', 'low'].includes(v.severity)) {
              console.log('SINJIRA_NPM_AUDIT_REMAINING ' + JSON.stringify({
                name, severity:v.severity, range:v.range,
                fixAvailable:v.fixAvailable
              }));
            }
          }
          JS

      # Diagnostic temporaire sans credentials : ne jamais conserver un lock
      # simplement parce que npm propose une mise à jour transitive.
      - name: Évaluer npm audit fix sans scripts ni secrets
        if: github.head_ref == 'security/netlify-staging-secret-scope-20261112'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/netlify-auditfix-candidate"
          mkdir -p "$root"
          cp "$GITHUB_WORKSPACE/tools/netlify-cli/package.json" "$root/package.json"
          cp "$GITHUB_WORKSPACE/tools/netlify-cli/package-lock.json" "$root/package-lock.json"
          touch "$root/npm-user.conf" "$root/npm-global.conf"
          cd "$root"
          status=0
          npm audit fix --package-lock-only --ignore-scripts --no-fund --no-progress \
            --userconfig="$root/npm-user.conf" --globalconfig="$root/npm-global.conf" \
            --registry=https://registry.npmjs.org/ || status=$?
          if [ "$status" -gt 1 ]; then
            echo "SINJIRA_FIX_ERROR npm audit fix unavailable status=$status"
            exit 1
          fi
          audit_status=0
          npm audit --json --omit=dev \
            --userconfig="$root/npm-user.conf" --globalconfig="$root/npm-global.conf" \
            --registry=https://registry.npmjs.org/ > "$root/audit.json" || audit_status=$?
          node - "$root/package-lock.json" "$root/audit.json" "$audit_status" <<'JS'
          const fs = require('node:fs'), crypto = require('node:crypto');
          const buf = fs.readFileSync(process.argv[2]);
          const lock = JSON.parse(buf.toString('utf8'));
          const audit = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          if (![0,1].includes(Number(process.argv[4]))) throw Error('audit non exploitable');
          const v = audit.metadata?.vulnerabilities;
          if (!v || v.critical || v.high) throw Error('audits élevés ou critiques');
          if (lock.packages?.['']?.dependencies?.['netlify-cli'] !== '27.19.0'
            || lock.packages?.['node_modules/netlify-cli']?.version !== '27.19.0') {
            throw Error('version directe Netlify altérée');
          }
          console.log('SINJIRA_FIX_COUNTS ' + JSON.stringify(v));
          console.log('SINJIRA_FIX_PACKAGES ' + (Object.keys(lock.packages).length - 1));
          console.log('SINJIRA_FIX_SHA256 ' + crypto.createHash('sha256').update(buf).digest('hex'));
          console.log('SINJIRA_FIX_BYTES ' + buf.length);
          console.log('SINJIRA_FIX_CLI_SRI ' + lock.packages['node_modules/netlify-cli']?.integrity);
          if (v.total >= 18) {
            console.log('SINJIRA_FIX_UNCHANGED: no improvement over 18 advisories');
          } else {
            const b64 = buf.toString('base64');
            for(let n=0;n<b64.length;n+=3000) console.log('SINJIRA_FIX_PART '+b64.slice(n,n+3000));
          }
          console.log('SINJIRA_FIX_END');
          JS
