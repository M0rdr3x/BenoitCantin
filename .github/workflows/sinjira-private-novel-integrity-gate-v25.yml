name: SINJIRA V25 — Intégrité diffusion privée Livre I

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'supabase/migrations/20261005150000_sinjira_v25_private_novel_integrity_gate.sql'
      - 'supabase/tests/private_novel_integrity_gate_v25.test.sql'
      - 'supabase/functions/admin-private-novel-release/**'
      - 'supabase/functions/_shared/auth.ts'
      - 'supabase/config.toml'
      - 'projets/sinjira/codex/livre-i-source-artifacts-2026-10-04.json'
      - 'scripts/validate_private_novel_integrity_gate_v25.py'
      - '.github/workflows/sinjira-private-novel-integrity-gate-v25.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  private-novel-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt sans credentials persistés
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'

      - name: Valider les gardes statiques de release privée
        run: |
          python3 -m py_compile scripts/validate_private_novel_integrity_gate_v25.py
          python3 scripts/validate_private_novel_integrity_gate_v25.py --self-test
          python3 scripts/validate_private_novel_integrity_gate_v25.py

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0

      - name: Démarrer une pile Supabase locale propre
        run: supabase start

      - name: Reconstruire la base locale depuis zéro
        run: supabase db reset

      - name: Prouver la chaîne intégrité → décision humaine → activation
        run: supabase test db supabase/tests/private_novel_integrity_gate_v25.test.sql

      - name: Arrêter et supprimer la pile locale
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then supabase stop --no-backup || true; fi
