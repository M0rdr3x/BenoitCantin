name: SINJIRA — Origines HTTPS strictes de la WebView native

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile-native/App.tsx'
      - 'mobile-native/safePublicShare.ts'
      - 'mobile-native/scripts/test-external-navigation-guard.mjs'
      - 'mobile-native/scripts/test-trusted-origin-boundary.mjs'
      - '.github/workflows/sinjira-native-origin-boundary-security.yml'
  push:
    branches: [ main ]
    paths:
      - 'mobile-native/App.tsx'
      - 'mobile-native/safePublicShare.ts'
      - 'mobile-native/scripts/test-external-navigation-guard.mjs'
      - 'mobile-native/scripts/test-trusted-origin-boundary.mjs'
      - '.github/workflows/sinjira-native-origin-boundary-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  origin-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Obtenir les sources sans identifiants Git
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Préparer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.2'

      - name: Installer les dépendances sans exécuter les scripts tiers
        working-directory: mobile-native
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Tester la navigation WebView réelle
        working-directory: mobile-native
        run: npm run test:navigation-guard

      - name: Vérifier la configuration et le partage des origines canoniques
        working-directory: mobile-native
        run: node scripts/test-trusted-origin-boundary.mjs

      - name: Vérifier les types
        working-directory: mobile-native
        run: npm run typecheck

      - name: Vérifier le garde historique des partages sûrs
        run: python3 scripts/validate_mobile_safe_share_v25.py
