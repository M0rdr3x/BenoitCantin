# SÉCURITÉ : NE JAMAIS PUBLIER la racine du dépôt ni ce dossier source.
# Lorsqu'un site Netlify cible Projet NOVA comme package directory,
# sa base doit rester la racine du dépôt. Le constructeur produit
# exclusivement un artefact public audité _site avec ses propres
# fichiers _headers et _redirects (CSP, protection des zones privées,
# refus des répertoires techniques).
#
# Si la base Netlify est configurée sur ce sous-dossier, la commande
# ne trouve pas le constructeur racine et le déploiement échoue fermé.
# Consultez netlify.toml à la racine pour la configuration canonique.

[build]
  command = "python3 scripts/build_netlify_public.py --standalone-netlify"
  publish = "_site"
