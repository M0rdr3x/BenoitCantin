[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'self' https://formspree.io; base-uri 'self'; frame-ancestors 'self'; object-src 'self'"

[[headers]]
  for = "/projets/sinjira/documents/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Les surfaces privées/authentifiées ne doivent jamais être mises en cache
# par le navigateur, le CDN ou un intermédiaire partagé.
[[headers]]
  for = "/compte/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Pragma = "no-cache"
    Referrer-Policy = "no-referrer"


[[headers]]
  for = "/administration.html"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Pragma = "no-cache"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Pragma = "no-cache"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/Admin/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Pragma = "no-cache"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Pragma = "no-cache"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/supabase/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Pragma = "no-cache"
    Referrer-Policy = "no-referrer"


