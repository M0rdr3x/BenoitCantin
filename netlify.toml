[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'self' https://formspree.io; base-uri 'self'; frame-ancestors 'self'; object-src 'self'"

[[headers]]
  for = "/projets/sinjira/documents/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/nova"
  to = "/projets/projet-nova/index.html"
  status = 301

[[redirects]]
  from = "/roman"
  to = "/projets/sinjira/index.html"
  status = 301

[[redirects]]
  from = "/registre"
  to = "/projets/sinjira/registre/index.html"
  status = 301

[[redirects]]
  from = "/projets/ere-des-consciences/*"
  to = "/projets/sinjira/:splat"
  status = 301

[[redirects]]
  from = "/sinjira"
  to = "/projets/sinjira/index.html"
  status = 301
