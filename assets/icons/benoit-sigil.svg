<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Sceau de Benoit Cantin</title>
  <desc id="desc">Monogramme BC entouré de deux orbites et d'une étoile.</desc>
  <defs>
    <linearGradient id="g" x1="18" y1="14" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9FF7FF"/>
      <stop offset=".48" stop-color="#7C8CFF"/>
      <stop offset="1" stop-color="#E7A7FF"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="68%">
      <stop stop-color="#1B3155"/>
      <stop offset="1" stop-color="#070B19"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="48" fill="url(#core)" stroke="url(#g)" stroke-width="2"/>
  <ellipse cx="64" cy="64" rx="57" ry="24" fill="none" stroke="url(#g)" stroke-width="2.2" transform="rotate(-18 64 64)" opacity=".9"/>
  <ellipse cx="64" cy="64" rx="26" ry="57" fill="none" stroke="url(#g)" stroke-width="1.5" transform="rotate(31 64 64)" opacity=".62"/>
  <circle cx="19" cy="72" r="3.4" fill="#A8FBFF" filter="url(#glow)"/>
  <path d="M101 23l2.3 5.4 5.7 1.2-4.5 3.8.6 5.8-5-3-5.3 2.4 1.3-5.7-4-4.2 5.8-.5z" fill="#F4C7FF" filter="url(#glow)"/>
  <text x="64" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800" letter-spacing="-3" fill="#F8FBFF">BC</text>
</svg>
